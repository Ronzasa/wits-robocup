  // is no use for a number whose whole claim is "right now" — and this one
  // costs a few hundred bytes and reads nothing off disk. No crowd and no bar
  // here: reactions belong on the broadcast, over the match they are about.
  cupCast.room = cupRoom({
    run: showing,
    countEl: document.getElementById("cup-watching"),
    intervalMs: CUP_TAB_ROOM_POLL_MS,
  });

  function drawHero() {
    const shown = cupStateAfter(bracket, state.revealed);
    // While the broadcast is running the hero shows *this* cup's winner only
    // once it has been won on screen; before that it shows the previous one,
    // which is not a spoiler for the competition being watched.
    if (shown.champion) {
      heroEl.innerHTML = cupWinnerHtml(bracket, shown.champion, state.revealed, {
        eyebrow: "Cup winners", when: cupRunDate(showing),
      });
    } else if (lastFinished && lastFinished.run_id !== showing) {
      heroEl.innerHTML = `<div class="cup-winner">
        <img class="trophy" src="assets/badge-weekly-cup-champion.png" alt="">
        <div class="cup-winner-copy">
          <div class="eyebrow">Holders</div>
          <div class="who">${escapeHtml(
            watchTeamLabel(lastFinished.champion_name || lastFinished.champion))}</div>
          <div class="small muted">
            Won ${escapeHtml(cupRunDate(lastFinished.run_id))} ·
            <a href="#/cup/${encodeURIComponent(lastFinished.run_id)}">review that cup</a>
          </div>
        </div>
      </div>`;
    } else {
      heroEl.innerHTML = `<div class="cup-winner pending">
        <img class="trophy" src="assets/badge-weekly-cup-champion.png" alt="">
        <div class="cup-winner-copy">
          <div class="eyebrow">${state.finished ? "Cup winners" : "In progress"}</div>
          <div class="who">Not decided yet</div>
          <div class="small muted">${state.total} of
            ${bracket.matches_total || matches.length} matches played</div>
        </div>
      </div>`;
    }
  }

  function draw(following) {
    bracketEl.innerHTML = cupBracketHtml(
      bracket, state, { kickoffs: cupKickoffs(broadcast) });
    bindCupBracket(bracketEl, bracket, state);
    const shown = cupStateAfter(bracket, state.revealed);
    // Once there is a champion the two pools are empty, so saying "0 unbeaten"
    // would read as though the cup had lost track of everybody.
    progressEl.textContent =
      `${state.revealed} of ${bracket.matches_total || matches.length} matches · `
      + (shown.champion
        ? `${shown.out.size} out, one winner`
        : `${shown.upper.size} unbeaten · ${shown.lower.size} on one loss`
          + ` · ${shown.out.size} out`);
    drawHero();
    tableEl.innerHTML = state.revealed >= state.total ? cupStandingHtml(bracket, state) : "";
    const deck = bracketEl.querySelector(".cup-match.on-deck, .cup-match.playing");
    if (following && deck) {
      deck.scrollIntoView({ behavior: "smooth", block: "nearest", inline: "center" });
    }
  }

  function drawHistory() {
    // Shown even when there is only one cup. It is then one row saying which
    // it is, which is mildly redundant and much better than a feature that
    // appears out of nowhere the first Sunday there are two.
    historyEl.innerHTML = cups.length ? cupHistoryHtml(cups, showing) : "";
    for (const node of historyEl.querySelectorAll(".cup-past")) {
      node.onclick = () => go(`#/cup/${encodeURIComponent(node.dataset.run)}`);
    }
  }

  function drawActions() {
    // On air there is one thing to offer and it is not a choice: join what
    // everybody else is watching. "Show every result" is deliberately not
    // offered — it is a spoiler button during a live competition, and it
    // would spoil it for the room as well as for the person who pressed it,
    // because they are the same broadcast.
    actionsEl.innerHTML = live
      ? `<button id="cup-play" class="on-air-join">Join the broadcast</button>
         <span class="small muted" style="margin-left:10px">
           Live now, in sync with the room: the match being played on the big
           screen is the match you get, at the minute it is at.
         </span>`
      : `<button id="cup-play" ${state.total ? "" : "disabled"}>Watch the cup</button>
      ${state.revealed < state.total
        ? '<button id="cup-reveal" class="ghost">Show every result</button>' : ""}
      <span class="small muted" style="margin-left:10px">
        ${state.total
          ? "Plays every match in order, full screen, revealing the bracket as it goes."
          : "Nothing has been played yet."}
      </span>`;
    const play = document.getElementById("cup-play");
    if (play) play.onclick = () => startCast(bracket, matches, data, state);
    const reveal = document.getElementById("cup-reveal");
    if (reveal) reveal.onclick = () => { state.revealed = state.total; draw(); drawActions(); };
  }

  draw();
  drawActions();
  drawHistory();
}

// ---------------------------------------------------------------------------
// The broadcast
//
// The same full-screen shell the Spotlight tab uses — the frame, the lockup,
// the goal burst, the slates — because it is the same thing: a match played at
// real speed for people watching rather than for people scrubbing. What a cup
// adds is that the matches are in an order that means something, and that
// finishing one changes a bracket.
//
// The bracket is one keypress or one button away throughout, drawn over the
// broadcast rather than replacing it, so "what does this do to the draw?" is
// answerable without leaving the match.
// ---------------------------------------------------------------------------

function startCast(bracket, matches, data, pageState) {
  // The page's own countdown is replaced by the broadcast's; `stopCup` clears
  // whichever is current.
  const clock = cupCast ? cupCast.clock : 0;
  clearInterval(clock);
  stopCup();

  // `bracket`, `matches`, `data` and these two are all reassigned by
  // `refresh()` while a live cup is on air, because a live cup's later rounds
  // are not on disk when the broadcast starts. Parameters rather than
  // constants for exactly that reason.
  let broadcast = data.broadcast || null;
  let live = !!(broadcast && broadcast.live);

  const state = {
    // A scripted cup winds the reveal position back to the start, because
    // being watched from the beginning is the point of reviewing one. A live
    // cup takes its position from the clock on the first tick of the driver:
    // the broadcast is already however far through it is, and this screen has
    // to join it there rather than start a second one.
    revealed: 0,
    total: live ? broadcast.matches : pageState.total,
    finished: pageState.finished,
    onDeck: false,
    playing: false,
  };
  document.body.classList.add("spotlight-on");
  view.innerHTML = `
    <div class="spotlight">
      <div class="spotlight-stage" id="cc-stage"></div>
      <div class="spotlight-frame" aria-hidden="true"></div>
      <img class="spotlight-lockup" src="assets/spotlight-cup-lockup.png" alt="">
      <div class="spotlight-goal" id="cc-goal" aria-live="polite">
        <img class="goal-art" src="assets/spotlight-goal-burst.png" alt="">
        <img class="goal-art own" src="assets/spotlight-own-goal-burst.png" alt="">
        <div class="spotlight-goal-copy">
          <strong id="cc-goal-headline">Goal</strong>
          <span id="cc-goal-team"></span>
        </div>
      </div>
      <div class="spotlight-interstitial on" id="cc-slate" aria-live="polite">
        <div class="spotlight-slate-copy">
          <img class="spotlight-slate-lockup" src="assets/spotlight-cup-lockup.png"
            alt="Soccer Agent Cup">
          <div class="spotlight-slate-kicker" id="cc-kicker">Cup</div>
          <h2 class="spotlight-slate-title" id="cc-title">Preparing the draw</h2>
          <p class="spotlight-slate-meta" id="cc-meta"></p>
          <div class="cup-out" id="cc-out"></div>
        </div>
      </div>
      <div class="cup-crowd" id="cc-crowd" aria-hidden="true"></div>
      <div class="cup-cast-bracket" id="cc-bracket" aria-hidden="true">
        <div class="cup-cast-bracket-inner">
          <div class="cup-cast-bracket-head">
            <strong>Bracket</strong>
            <span class="small muted" id="cc-progress"></span>
            <button class="exit" id="cc-close">Back to the match</button>
          </div>
          <div id="cc-tree"></div>
        </div>
      </div>
      <div class="spotlight-bar">
        <span class="tag" id="cc-tag">Cup</span>
        <span class="fixture" id="cc-fixture">—</span>
        <span class="count" id="cc-count"></span>
        <span class="watching" id="cc-watching"></span>
        <span class="bar-actions">
          <button class="exit" id="cc-toggle">Bracket</button>
          <button class="exit" id="cc-exit">Exit</button>
        </span>
      </div>
      <div class="cup-react" id="cc-react" hidden></div>
    </div>`;

  const stage = document.getElementById("cc-stage");
  const slateEl = document.getElementById("cc-slate");
  const kickerEl = document.getElementById("cc-kicker");
  const titleEl = document.getElementById("cc-title");
  const metaEl = document.getElementById("cc-meta");
  const outEl = document.getElementById("cc-out");
  const goalEl = document.getElementById("cc-goal");
  const goalHeadlineEl = document.getElementById("cc-goal-headline");
  const goalTeamEl = document.getElementById("cc-goal-team");
  const panelEl = document.getElementById("cc-bracket");
  const treeEl = document.getElementById("cc-tree");
  const progressEl = document.getElementById("cc-progress");
  const fixtureEl = document.getElementById("cc-fixture");
  const countEl = document.getElementById("cc-count");

  cupCast = {
    timer: 0, holdTimer: 0, goalTimer: 0, clock: 0,
    sync: 0, poll: 0,
    onMessage: null, onKey: null, panel: false,
    // Which beat of the rundown is on screen, when the replay was last told
    // where it should be, and — if the clock has run past the bracket this
    // page holds — that it is showing a hold rather than that beat, and when
    // it last asked for a fresher one. Live driver only; see `driveLive`.
    beat: null, nudgedAt: 0, stalled: false, askedAt: 0, retimedAt: 0,
    // When the deck beat on screen began, by the same clock the countdowns
    // are read against. Scripted driver only: it is what the estimates for
    // every match after this one are projected from. See `castEstimates`.
    deckAt: 0,
    // The furthest round the tree has been grown to. Only a round beyond this
    // gets the arrival animation, so re-drawing the panel — which happens on
    // every kickoff, every full time and every press of the bracket button —
    // does not replay it.
    grownTo: -1,
  };

  // Which round the competition has reached: the one the next match belongs
  // to, so the round being played is on the board while it is being played.
  // Rebuilt by `refresh()`, since a live cup gains rounds as it is played.
  const roundIndexOf = new Map();
  function indexRounds() {
    roundIndexOf.clear();
    (bracket.rounds || []).forEach((round, index) => {
      for (const item of round.matches || []) roundIndexOf.set(item.match_id, index);
    });
  }
  indexRounds();
  function reachedRound() {
    const at = Math.min(state.revealed, matches.length - 1);
    return roundIndexOf.get(matches[at].match_id) ?? 0;
  }

  // -- when a reviewed cup gets to a match ---------------------------------
  //
  // A cup on air has a rundown and a server clock behind it, so `cupKickoffs`
  // hands every box a time of day it will keep. A cup being reviewed has
  // neither — and is still not unknowable, because this driver *is* the
  // schedule: every beat's length is one of the constants above and a match's
  // is its own tick count, so the rest of the afternoon can simply be added
  // up. That is the difference between a bracket of thirty-eight boxes you can
  // plan an evening around and one you cannot.
  //
  // Only ever an estimate, and said as one — see `cupRoughly`. The beats are
  // local timers that pause with the tab, so anybody who looks away for a
  // minute has moved all of these by a minute. Re-anchored on each deck beat
  // for that reason: a pause costs the projection one match rather than the
  // whole of the rest of the cup.

  /**
   * Projected deck-beat times for every match still to come.
   *
   * `null` while a cup is on air, where the rundown is the authority and
   * guessing alongside it would put this screen out of step with every other
   * one, and `null` before the first deck beat has given it an anchor.
   */
  function castEstimates() {
    if (live || !cupCast || !cupCast.deckAt) return null;
    const at = new Map();
    let when = cupCast.deckAt;
    for (let index = state.revealed; index < matches.length; index += 1) {
      at.set(matches[index].match_id, when);
      when += cupCycleMs(matches, index, broadcast && broadcast.beats);
    }
    return at;
  }

  function showSlate(kind, kicker, titleHtml, meta, cards) {
    slateEl.className = `spotlight-interstitial on${kind ? ` ${kind}` : ""}`;
    kickerEl.textContent = kicker;
    titleEl.innerHTML = titleHtml;
    metaEl.textContent = meta || "";
    outEl.innerHTML = cards || "";
  }

  function hideSlate() {
    slateEl.classList.remove("on");
    outEl.innerHTML = "";
  }

  function hideGoal() {
    goalEl.classList.remove("show");
  }

  function celebrateGoal(message) {
    if (!cupCast) return;
    // One class does the whole switch: which overlay is shown, the colour of
    // its glow, and the colour of the copy under it. See `.spotlight-goal`.
    goalEl.classList.toggle("own-goal", !!message.ownGoal);
    goalHeadlineEl.textContent = message.ownGoal ? "Own goal" : "Goal";
    goalTeamEl.textContent = message.teamName ? watchTeamLabel(message.teamName) : "";
    cancelTimer(cupCast.goalTimer);
    hideGoal();
    void goalEl.offsetWidth;   // restart the animation for goals close together
    goalEl.classList.add("show");
    cupCast.goalTimer = pausableTimeout(hideGoal, CUP_GOAL_MS);
  }

  function drawPanel(moving) {
    // The tree is grown to the round in play and no further, and the round
    // that has just been reached is animated in. Together that is the bracket
    // *opening out* as the cup is played rather than sitting there full of
    // empty boxes with the answer two columns along.
    //
    // The growth is only marked as shown when the panel is actually up. Most
    // of a broadcast is spent watching a match with the bracket closed, and an
    // animation played into a hidden panel is an animation nobody sees — so it
    // waits, and runs the first time the bracket is looked at.
    const limit = reachedRound();
    const fresh = limit > cupCast.grownTo ? limit : null;
    if (fresh !== null && cupCast.panel) cupCast.grownTo = limit;
    treeEl.innerHTML = cupBracketHtml(bracket, state, {
      limit, fresh, moving,
      kickoffs: cupKickoffs(broadcast),
      estimates: castEstimates(),
    });
    bindCupBracket(treeEl, bracket, state);
    const shown = cupStateAfter(bracket, state.revealed);
    progressEl.textContent =
      `${state.revealed} of ${bracket.matches_total || matches.length} played · `
      + (shown.champion
        ? `${shown.out.size} out, one winner`
        : `${shown.upper.size} unbeaten · ${shown.lower.size} on one loss`);
    if (!cupCast || !cupCast.panel) return;
    // Follow whatever the broadcast is pointing at, in that order: a team
    // arriving somewhere, a team leaving for the last time, then the match
    // coming up. Centred rather than nearest, because the lower bracket is a
    // long way down from the upper one and "nearest" leaves a drop off screen
    // — which made the movement play where nobody could see it.
    const focus = treeEl.querySelector(".cup-match.receiving")
      // A drop with nowhere to drop *to* yet lands in the lower bracket's
      // queue instead of in a box — see `waiting` in `cupBracketHtml`. It is
      // the same beat and it gets the same follow, or the movement plays a
      // thousand pixels below whatever is on screen.
      || treeEl.querySelector(".cup-wait.moving")
      || treeEl.querySelector(".cup-match.parting")
      || treeEl.querySelector(".cup-match.on-deck")
      || treeEl.querySelector(".cup-match.playing");
    if (focus) {
      // Instant, not smooth. A smooth scroll of nearly a thousand pixels
      // through two nested scroll containers is one of the easier things for a
      // browser to quietly decline, and if it declines then the movement plays
      // somewhere off screen — which is exactly the complaint this is here to
      // answer. A cut is also what a broadcast would do.
      focus.scrollIntoView({ behavior: "auto", block: "center", inline: "center" });
    }
  }

  function togglePanel(open) {
    if (!cupCast) return;
    cupCast.panel = open === undefined ? !cupCast.panel : !!open;
    panelEl.classList.toggle("on", cupCast.panel);
    panelEl.setAttribute("aria-hidden", String(!cupCast.panel));
    document.getElementById("cc-toggle").textContent =
      cupCast.panel ? "Hide bracket" : "Bracket";
    if (cupCast.panel) drawPanel();
  }

  function finishCast() {
    stopCup();
    // Back to the tab, with everything revealed — the broadcast has been
    // watched, so there is nothing left to spoil. Navigating names the cup
    // that was watched, so leaving the broadcast never moves which cup is
    // being looked at.
    const target = `#/cup/${encodeURIComponent(data.run.run_id)}`;
    // Setting an unchanged hash fires no event, so that case has to re-route
    // by hand; setting a different one must *not*, or the tab renders twice.
    if (location.hash === target) route();
    else go(target);
  }

  // -- the beats -----------------------------------------------------------
  //
  // Rendering a beat and deciding when the next one is due are deliberately
  // separate, because a cup has two things that can decide it.
  //
  // A cup being reviewed is *scripted*: one beat schedules the next on a
  // timer, the replay's own full time is what ends a match, and pausing the
  // tab pauses the broadcast — which is what somebody watching a competition
  // from three weeks ago wants.
  //
  // A cup on air is not scheduled at all. The server's rundown says which beat
  // the current moment belongs to and the page renders that one, so every
  // screen watching shows the same thing whatever its own tab has been doing:
  // a viewer who joins at half past five joins mid-match at the tick the room
  // is on, and one whose laptop was shut re-derives its position instead of
  // finishing the cup ten minutes after everybody else. See `driveLive`.
  //
  // So each beat below only draws itself. Nothing in this group starts a
  // timer, reads the clock, or moves the reveal position on its own.

  /** The fixture the bar names, which every beat of a match shares. */
  function showFixture(match, index) {
    // Out of the whole competition, not out of the part of it this page has
    // been told about: a live cup's bracket arrives a round at a time, and
    // "one of ten" during the first round of a thirty-eight match cup is a
    // number that would change under the reader twice an hour.
    const total = (live && broadcast && broadcast.matches_total)
      || bracket.matches_total || state.total;
    fixtureEl.textContent =
      `${cupTeamLabel(match.teams[0])} v ${cupTeamLabel(match.teams[1])}`;
    countEl.textContent =
      `${match.label.toLowerCase()} · ${index + 1} of ${total}`;
  }

  /** Who this match knocked out of the competition. */
  function goneAt(index) {
    const before = cupStateAfter(bracket, index);
    const after = cupStateAfter(bracket, index + 1);
    return [...after.out].filter((slug) => !before.out.has(slug));
  }

  /** The sign-off: the winners, or a cup that is still being played. */
  function renderEnd() {
    stage.innerHTML = "";
    togglePanel(false);
    state.onDeck = state.playing = false;
    const shown = cupStateAfter(bracket, state.revealed);
    if (shown.champion) {
      const entry = cupEntry(bracket, shown.champion);
      const record = cupRecord(bracket, shown.champion, state.revealed);
      showSlate(
        "full-time", "That is the cup",
        `<img class="cup-slate-badge" src="assets/badge-weekly-cup-champion.png" alt="">
         <span class="ft-teams">Cup winners</span>
         <span class="ft-score">${escapeHtml(cupTeamLabel(entry))}</span>`,
        `Seeded ${entry.seed} · ${record.won} won, ${record.lost} lost across `
        + `${record.played} matches`,
      );
    } else {
      // The cup's own art rather than the Spotlight's idle photo: this is a
      // competition waiting on itself, not a channel with nothing on.
      showSlate("cup-countdown", "Up to date", "The cup is still being played",
        "Every round that has finished is on the bracket.");
    }
    fixtureEl.textContent = "";
    countEl.textContent = "";
    drawPanel();
  }

  /** The on-deck slate: two names, their seeds, and who won the toss. */
  function renderDeck(match, index) {
    stage.innerHTML = "";
    // The bracket panel is left open by the movement beats, and this is where
    // the broadcast cuts away from it — in both drivers, so that a live viewer
    // and a scripted one leave the bracket at the same beat.
    togglePanel(false);
    state.onDeck = true;
    state.playing = false;
    showFixture(match, index);
    const left = cupTeamLabel(match.teams[0]);
    const right = cupTeamLabel(match.teams[1]);
    showSlate(
      "", match.label,
      `<span class="ft-teams">${escapeHtml(left)}</span>
       <span class="ft-score" style="font-size:.5em">v</span>
       <span class="ft-teams">${escapeHtml(right)}</span>`,
      `Seeds ${match.teams[0].seed} and ${match.teams[1].seed} · `
      + `${cupTeamLabel(match.teams[match.kickoff])} won the toss and kicks off`,
    );
    drawPanel();
  }

  /**
   * The match itself.
   *
   * `atTick` is where in the replay to come in, which is 0 for a broadcast
   * watching a match from its kickoff and anything at all for one joining a
   * match already being played. The viewer is asked to start playing there
   * rather than to sit on that frame — see `?at=` in viewer.html, which is
   * that one difference from the `?frame=` a link to an incident uses.
   */
  function renderMatch(match, index, atTick) {
    state.onDeck = false;
    state.playing = true;
    showFixture(match, index);
    drawPanel();
    if (!match.replay) {
      // A walkover, or a cup played before replays were kept. Nothing to
      // watch: the scripted driver goes straight to the result, and the
      // rundown gives the match no time at all, so this is only reachable if
      // a bracket and a rundown disagree.
      stage.innerHTML = "";
      return false;
    }
    const name = `${data.run.run_id}/${match.replay}`;
    const seek = atTick > 0 ? `&at=${encodeURIComponent(atTick.toFixed(2))}` : "";
    stage.innerHTML =
      `<iframe title="match viewer" src="viewer.html?replay=${encodeURIComponent(name)}&speed=1&chrome=off${seek}"></iframe>`;
    const iframe = stage.querySelector("iframe");
    iframe.addEventListener("load", () => {
      // The slate lifts only once the replay is loaded, so every match opens
      // on its own kickoff rather than on a black frame.
      if (cupCast && stage.querySelector("iframe") === iframe) hideSlate();
    });
    return true;
  }

  /**
   * Full time: the result, said in words as well as drawn on the bracket.
   *
   * Where each team goes next is the point of the whole beat, and it should
   * not be readable *only* off a box the viewer may have to find: a sentence
   * costs nothing and cannot be scrolled off or clipped.
   */
  function renderResult(index) {
    stage.innerHTML = "";
    const match = matches[index];
    const gone = goneAt(index);
    state.playing = false;
    state.onDeck = false;
    showFixture(match, index);
    const left = cupTeamLabel(match.teams[0]);
    const right = cupTeamLabel(match.teams[1]);
    const winner = cupEntry(bracket, match.winner);
    const loser = cupEntry(bracket, match.loser);
    const outcome = match.bracket === "final"
      ? `${cupTeamLabel(winner)} win the cup · ${cupTeamLabel(loser)} finish runners-up`
      : match.bracket === "upper"
        ? `${cupTeamLabel(winner)} stay unbeaten · `
          + `${cupTeamLabel(loser)} drop into the lower bracket`
        : `${cupTeamLabel(winner)} survive · ${cupTeamLabel(loser)} are knocked out`;
    const how = match.error
      ? `Walkover — ${outcome}`
      : match.decided_by && match.decided_by !== "goals"
        ? `Level after ninety, decided on ${match.decided_by} — ${outcome}`
        : outcome;
    showSlate(
      "full-time", `${match.label} · full time`,
      `<span class="ft-teams">${escapeHtml(left)} v ${escapeHtml(right)}</span>`
      + (match.score
        ? `<span class="ft-score">${match.score[0]} — ${match.score[1]}</span>`
        : `<span class="ft-score">walkover</span>`),
      how,
      // A team that has gone out gets its whole cup on screen: a knockout exit
      // is the last anybody hears of a team, so it is worth the room.
      gone.map((slug) => cupEliminationHtml(bracket, slug, state.revealed)).join(""),
    );
    drawPanel();
  }

  /**
   * The bracket beat after a match: what the result did to the draw.
   *
   * Three movements, one at a time and in the order that makes sense of them —
   * the winner going through, then the loser dropping into the lower bracket
   * or leaving the board, then the bracket redrawn plain with the next fixture
   * marked on deck. Both movements at once is a bracket flickering in two
   * places and no story; one after the other is a result being applied.
   *
   * After every match, not only at the end of a round: this is the moment the
   * result means something, and cutting to the bracket is what a broadcast
   * does with it.
   */
  function renderMove(index, phase) {
    const match = matches[index];
    if (!match) return;
    togglePanel(true);
    if (phase === "won") {
      drawPanel({ slug: match.winner, kind: "won", from: match.match_id });
      return;
    }
    if (phase === "lost") {
      drawPanel({
        slug: match.loser,
        kind: goneAt(index).indexOf(match.loser) >= 0 ? "out" : "dropped",
        from: match.match_id,
      });
      return;
    }
    // Redrawn plain, which is also when a round that has just finished is
    // allowed to arrive on the board. Then a beat to take the new shape in
    // before the broadcast cuts away — landing on a result and cutting in the
    // same instant gives nobody time to read it.
    //
    // And the view comes back to the fixture that is next. The two movement
    // beats leave it wherever the loser dropped to, which for an
    // upper-bracket match is the far side of the lower one; cutting to the
    // next game from there gives no sense of where that game is. Marking it
    // on deck both highlights it and is what the scroll follows.
    state.onDeck = state.revealed < state.total;
    drawPanel();
  }

  /**
   * A live broadcast whose next result is not on disk yet.
   *
   * Only reachable if the playout catches up with the competition, which takes
   * a machine playing matches slower than people watch them. Saying so is
   * better than the alternatives: a finished-cup slate would be a lie, and
   * winding the clock back to wait would put this screen out of step with
   * every other one, which is the single thing a synchronised broadcast is
   * for.
   */
  function renderWaiting(phase) {
    stage.innerHTML = "";
    togglePanel(false);
    state.onDeck = state.playing = false;
    fixtureEl.textContent = "";
    countEl.textContent = "";
    if (phase === "pending") {
      showSlate("cup-countdown", "Cup", "Kickoff is not far away",
        "The draw is being played out; the broadcast starts on the first match.");
    } else {
      showSlate("cup-countdown", "Cup", "Waiting for the next result",
        "The competition is still being played. The broadcast picks up the "
        + "moment the next match is in.");
    }
    drawPanel();
  }

  // -- the scripted driver -------------------------------------------------
  //
  // A cup being reviewed. Every beat schedules the next one, and the timers
  // are pausable, so a hidden tab holds the broadcast where it was rather than
  // playing a competition to nobody.

  function next() {
    if (!cupCast) return;
    cancelTimer(cupCast.timer);
    cancelTimer(cupCast.holdTimer);
    if (state.revealed >= state.total) {
      renderEnd();
      cupCast.holdTimer = pausableTimeout(finishCast, CUP_ELIMINATION_MS);
      return;
    }
    const index = state.revealed;
    // Before the render, because the render draws the bracket and the bracket
    // is what reads it.
    cupCast.deckAt = cupNow();
    renderDeck(matches[index], index);
    cupCast.holdTimer = pausableTimeout(() => kick(matches[index], index), CUP_DECK_MS);
  }

  function kick(match, index) {
    if (!cupCast) return;
    if (!renderMatch(match, index, 0)) {
      finish();
      return;
    }
    // The same backstop the spotlight has, for a replay that fails to load or
    // stalls. Full time normally arrives as a message from the viewer.
    cupCast.timer = pausableTimeout(finish, CUP_MAX_SECONDS * 1000);
  }

  // The one moment that matters: the replay has reached full time, so now — and
  // not before — the result is allowed onto the bracket.
  function finish() {
    if (!cupCast) return;
    cancelTimer(cupCast.timer);
    cancelTimer(cupCast.holdTimer);
    cancelTimer(cupCast.goalTimer);
    hideGoal();
    const index = state.revealed;
    const match = matches[index];
    if (!match) { next(); return; }
    state.revealed = index + 1;
    const gone = goneAt(index);
    renderResult(index);

    const nextUp = matches[state.revealed];
    const roundDone = !!nextUp
      && roundIndexOf.get(nextUp.match_id) !== roundIndexOf.get(match.match_id);
    const after = cupStateAfter(bracket, state.revealed);
    const wait = gone.length || after.champion ? CUP_ELIMINATION_MS : CUP_RESULT_MS;
    cupCast.holdTimer = pausableTimeout(() => moveOn(index, roundDone), wait);
  }

  function moveOn(index, roundDone) {
    if (!cupCast) return;
    renderMove(index, "won");
    cupCast.holdTimer = pausableTimeout(() => {
      if (!cupCast) return;
      renderMove(index, "lost");
      cupCast.holdTimer = pausableTimeout(() => {
        if (!cupCast) return;
        renderMove(index, "settled");
        cupCast.holdTimer = pausableTimeout(() => {
          if (!cupCast) return;
          next();
        }, roundDone ? CUP_ROUND_MS : CUP_SETTLE_MS);
      }, CUP_MOVE_MS);
    }, CUP_MOVE_MS);
  }

  // -- the live driver -----------------------------------------------------
  //
  // A cup on air. Nothing is scheduled: every quarter second the clock is
  // asked which beat the current moment falls in, and the page renders that
  // beat if it is not the one already on screen. The reveal position comes
  // from the rundown rather than from a counter this page keeps, so it cannot
  // drift from anybody else's — and a beat that was missed entirely, because
  // the tab was in the background, is simply a beat this screen did not see.

  /** How far a match may drift from the broadcast before it is pulled back. */
  const CUP_DRIFT_TICKS = 24;   // a little over a second at 20 Hz
  /** How often a playing match is told where it should be. */
  const CUP_NUDGE_MS = 2000;

  function liveBeat(position) {
    return position.segment
      ? `${position.segment.kind}:${position.segment.match_index}`
      : position.phase;
  }

  /**
   * Tells the replay where the broadcast is, so it can pull itself back.
   *
   * A browser that throttled its animation frames — a background tab, a busy
   * machine, a laptop that slept — comes back behind, and a replay left to run
   * from where it was would finish late by however long it lost. The viewer
   * snaps only when the gap is worth snapping, so this is cheap to send often
   * and invisible when nothing is wrong. See `cup-sync` in viewer.html.
   */
  function nudge(tick) {
    const iframe = stage.querySelector("iframe");
    if (!iframe || !iframe.contentWindow) return;
    try {
      iframe.contentWindow.postMessage(
        { type: "cup-sync", tick, drift: CUP_DRIFT_TICKS }, "*");
    } catch (_) { /* not loaded yet; the next nudge will find it */ }
  }

  function driveLive() {
    if (!cupCast || !broadcast) return;
    const position = cupBroadcastAt(broadcast, cupNow());
    if (!position) return;
    const segment = position.segment;
    const index = segment ? segment.match_index : -1;
    const match = index >= 0 && index < matches.length ? matches[index] : null;
    state.revealed = Math.min(position.revealed, state.total);
    const beat = liveBeat(position);
    if (cupCast.panel && Date.now() - cupCast.retimedAt > 500) {
      cupCast.retimedAt = Date.now();
      cupRetime(treeEl);
    }
    if (beat === cupCast.beat) {
      // Still the beat on screen. A match is the only one that keeps moving
      // while it is held, so it is the only one with anything to correct.
      if (segment && segment.kind === "match" && match
          && Date.now() - cupCast.nudgedAt > CUP_NUDGE_MS) {
        cupCast.nudgedAt = Date.now();
        nudge(cupBroadcastTick(broadcast, position.offsetMs));
      }
      return;
    }
    cupCast.beat = beat;
    cupCast.nudgedAt = Date.now();
    if (!segment) {
      if (position.phase === "done") renderEnd();
      else renderWaiting(position.phase);
      return;
    }
    if (!match) {
      // The clock is inside a match this page's copy of the bracket does not
      // have. That is a page holding a stale bracket, not a broken timeline,
      // so it says so and asks for a fresh one — at most every few seconds,
      // because this runs four times a second and the beat it cannot draw
      // will still be undrawable on the next tick.
      renderWaiting("waiting");
      cupCast.stalled = true;
      if (Date.now() - cupCast.askedAt > 5000) {
        cupCast.askedAt = Date.now();
        refresh();
      }
      return;
    }
    if (segment.kind === "deck") renderDeck(match, index);
    else if (segment.kind === "match") {
      renderMatch(match, index, cupBroadcastTick(broadcast, position.offsetMs));
    } else if (segment.kind === "result") renderResult(index);
    else if (segment.kind === "move-won") renderMove(index, "won");
    else if (segment.kind === "move-lost") renderMove(index, "lost");
    else if (segment.kind === "settle") renderMove(index, "settled");
    else renderEnd();
  }

  /**
   * A fresh bracket and a fresh rundown, mid-broadcast.
   *
   * A live cup grows: the rounds it has not played are not on disk, so the
   * page that started watching at kickoff knows only the first round and has
   * to be told the rest. Re-reading also re-measures the clock, which is what
   * keeps an hour and a half of broadcast from drifting.
   *
   * Everything already elapsed keeps the offset it had — the server builds the
   * rundown so that it does — so this can never move the beat on screen.
   */
  async function refresh() {
    if (!cupCast || !live) return;
    const sentAt = Date.now();
    let fresh;
    try {
      fresh = await api(
        "api/cup", { run: data.run.run_id },
        cupAccess() === "locked" ? { [CUP_PASSWORD_HEADER]: cupPassword() } : null,
      );
    } catch (_) {
      // A cup mid-broadcast is not worth abandoning over one failed poll: the
      // timeline on hand is still right for everything it covers.
      return;
    }
    if (!cupCast || !fresh || !fresh.bracket) return;
    cupNoteServerClock(fresh, sentAt);
    data = fresh;
    bracket = fresh.bracket;
    matches = cupMatches(bracket);
    broadcast = fresh.broadcast;
    live = !!(broadcast && broadcast.live);
    state.total = broadcast ? broadcast.matches : matches.length;
    state.finished = !!bracket.finished;
    indexRounds();
    if (cupCast.stalled) {
      // The beat on screen is a hold, not the beat the clock is on. Forgetting
      // what is rendered is what lets the driver draw the real one now that it
      // has the match — and it is deliberately *only* done here, because
      // forgetting it mid-match would reload the replay every time this
      // polled.
      cupCast.stalled = false;
      cupCast.beat = null;
    }
    if (!live) {
      // The broadcast ended while it was being watched. What is on screen is
      // the last beat of it, which is where the scripted path would have
      // stopped too, so it simply stays there.
      clearInterval(cupCast.sync);
      clearInterval(cupCast.poll);
    }
  }

  cupCast.onMessage = (event) => {
    const iframe = stage.querySelector("iframe");
    if (!iframe || event.source !== iframe.contentWindow || !event.data) return;
    // Full time ends the match for a scripted cup. On air it does not: the
    // rundown already says how long the match runs, and a replay that reached
    // its end early — because it was seeked, or because the tab was throttled
    // and the viewer snapped forward — must not take the rest of the
    // broadcast with it.
    if (event.data.type === "replay-ended") { if (!live) finish(); }
    else if (event.data.type === "replay-goal") celebrateGoal(event.data);
  };
  cupCast.onKey = (event) => {
    if (event.key === "Escape") {
      if (cupCast && cupCast.panel) togglePanel(false);
      else finishCast();
    } else if (event.key === "b") {
      togglePanel();
    } else if (/^[1-9]$/.test(event.key)) {
      // The bar without reaching for the mouse, which is what a room watching
      // a wall screen actually does.
      if (cupCast && cupCast.room) cupCast.room.sendAt(Number(event.key) - 1);
    } else if (!live && (event.key === "ArrowRight" || event.key === "n")) {
      // Skipping a match is a thing you can do to a recording. There is no
      // skipping a live broadcast: it is the same competition everybody else
      // is watching, and a screen that jumped a match would be showing a
      // result the rest of them have not seen.
      finish();
    }
  };
  window.addEventListener("message", cupCast.onMessage);
  window.addEventListener("keydown", cupCast.onKey);
  document.getElementById("cc-exit").onclick = finishCast;
  document.getElementById("cc-toggle").onclick = () => togglePanel();
  document.getElementById("cc-close").onclick = () => togglePanel(false);

  // Everybody watching this cup, on the bar and up the edges of the frame.
  // Cleared by `stopCup` with the rest of the broadcast's timers.
  cupCast.room = cupRoom({
    run: data.run ? data.run.run_id : "",
    crowdEl: document.getElementById("cc-crowd"),
    reactEl: document.getElementById("cc-react"),
    countEl: document.getElementById("cc-watching"),
    roster: data.emoticons || [],
    cooldownMs: 3000,
    intervalMs: CUP_ROOM_POLL_MS,
  });

  if (live) {
    document.getElementById("cc-tag").className = "tag on-air";
    document.getElementById("cc-tag").textContent = "Live";
    driveLive();
    cupCast.sync = setInterval(driveLive, 250);
    // Long enough that an hour and a half of cup is a few dozen requests, and
    // short enough that a round finishing is on the board within a beat of
    // the match that finished it.
    cupCast.poll = setInterval(refresh, 15000);
  } else {
    next();
    // Slow on purpose: a reviewed cup's estimates are said in minutes, so
    // this is not a counter ticking but a guard against a bracket opened in
    // the middle of a two-minute match still showing the waits as they stood
    // when the beat began. See `cupRetime`.
    cupCast.sync = setInterval(() => {
      if (cupCast && cupCast.panel) cupRetime(treeEl);
    }, 1000);
  }
}

function cupEliminationHtml(bracket, slug, revealed) {
  const entry = cupEntry(bracket, slug);
  const record = cupRecord(bracket, slug, revealed);
  const cell = (label, value) =>
    `<div><dt>${label}</dt><dd>${escapeHtml(String(value))}</dd></div>`;
  return `<div class="cup-out-card">
    <div class="cup-out-head">Knocked out · ${escapeHtml(cupTeamLabel(entry))}
      <span class="muted">seeded ${entry.seed}</span></div>
    <dl class="cup-out-grid">
      ${cell("Matches", record.played)}
      ${cell("Won", record.won)}
      ${cell("Lost", record.lost)}
      ${cell("Scored", record.for)}
      ${cell("Conceded", record.against)}
      ${cell("Out in", record.out_in || "—")}
    </dl>
  </div>`;
}

// ---------------------------------------------------------------------------
// Spotlight
//
// A full-screen, unattended cycle of recorded matches for a screen on the lab
// wall. It reuses the same viewer the Watch tab embeds; the only addition on
// that side is a "replay-ended" message the viewer posts to its host when a
// replay reaches its last tick, which is what tells this page to move on.
// ---------------------------------------------------------------------------

// Fixed to a run when the tab is opened; the queue is a shuffled copy of that
// run's watchable fixtures, replayed indefinitely and reshuffled each lap.
let spotlight = null;

// Seconds to sit on one match before giving up on the viewer's end signal and
// moving on regardless. A 2,400-tick match at 20 Hz runs 120 s at 1x, so this
// only ever catches a replay that fails to load or stalls.
const SPOTLIGHT_MAX_SECONDS = 200;
const SPOTLIGHT_INTERSTITIAL_MS = 2200;
const SPOTLIGHT_RESULT_MS = 3600;
const SPOTLIGHT_GOAL_MS = 2400;
// How long the team-sheet slate holds before kick-off: long enough to read
// both records and every badge, and to build anticipation for the match.
const SPOTLIGHT_PREGAME_MS = 15000;

function stopSpotlight() {
  document.body.classList.remove("spotlight-on");
  if (!spotlight) return;
  cancelTimer(spotlight.timer);
  cancelTimer(spotlight.transitionTimer);
  cancelTimer(spotlight.goalTimer);
  cancelTimer(spotlight.pregameTimer);
  window.removeEventListener("message", spotlight.onMessage);
  window.removeEventListener("keydown", spotlight.onKey);
  spotlight = null;
}

function shuffled(items) {
  const copy = items.slice();
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

async function showSpotlight() {
  const runId = currentRun || (site.latest || "");
  const [data, table] = await Promise.all([
    api("api/matches", { run: runId, slug: "", limit: "2000" }),
    api("api/table", { run: runId }).catch(() => ({ standings: [] })),
  ]);
  // The standings row is the pre-match team sheet: record, rate and badges.
  const standBySlug = new Map();
  const baselineSlugs = new Set();
  for (const row of table.standings || []) {
    standBySlug.set(row.slug, row);
    if (row.kind === "baseline") baselineSlugs.add(row.slug);
  }
  // A baseline against a baseline is a fixed reference result, not a showcase
  // match — never queue one.
  const pool = (data.watchable || []).filter(
    (m) => !(baselineSlugs.has(m.teams[0]) && baselineSlugs.has(m.teams[1])),
  );

  document.body.classList.add("spotlight-on");
  view.innerHTML = `
    <div class="spotlight">
      <div class="spotlight-stage" id="sl-stage"></div>
      <div class="spotlight-frame" aria-hidden="true"></div>
      <img class="spotlight-lockup" src="assets/spotlight-lockup.png" alt="">
      <div class="spotlight-goal" id="sl-goal" aria-live="polite">
        <img class="goal-art" src="assets/spotlight-goal-burst.png" alt="">
        <img class="goal-art own" src="assets/spotlight-own-goal-burst.png" alt="">
        <div class="spotlight-goal-copy">
          <strong id="sl-goal-headline">Goal</strong>
          <span id="sl-goal-team"></span>
        </div>
      </div>
      <div class="spotlight-interstitial on" id="sl-interstitial" aria-live="polite">
        <div class="spotlight-slate-copy">
          <img class="spotlight-slate-lockup" src="assets/spotlight-lockup.png"
            alt="Soccer Agent Spotlight">
          <div class="spotlight-slate-kicker" id="sl-kicker">Spotlight</div>
          <h2 class="spotlight-slate-title" id="sl-title">Preparing the next match</h2>
          <p class="spotlight-slate-meta" id="sl-meta"></p>
        </div>
      </div>
      <div class="spotlight-pregame" id="sl-pregame" aria-live="polite">
        <div class="spotlight-pregame-inner">
          <div class="spotlight-slate-kicker">Kick-off</div>
          <h2 class="spotlight-pregame-fixture" id="sl-pg-fixture">—</h2>
          <p class="spotlight-slate-meta" id="sl-pg-meta"></p>
          <div class="spotlight-pregame-teams" id="sl-pg-teams"></div>
        </div>
      </div>
      <div class="spotlight-bar">
        <span class="tag">Spotlight</span>
        <span class="fixture" id="sl-fixture">—</span>
        <span class="count" id="sl-count"></span>
        <button class="exit" id="sl-exit">Exit</button>
      </div>
    </div>`;

  const fixtureEl = document.getElementById("sl-fixture");
  const countEl = document.getElementById("sl-count");
  const stage = document.getElementById("sl-stage");
  const interstitialEl = document.getElementById("sl-interstitial");
  const kickerEl = document.getElementById("sl-kicker");
  const titleEl = document.getElementById("sl-title");
  const metaEl = document.getElementById("sl-meta");
  const goalEl = document.getElementById("sl-goal");
  const goalHeadlineEl = document.getElementById("sl-goal-headline");
  const goalTeamEl = document.getElementById("sl-goal-team");
  const pregameEl = document.getElementById("sl-pregame");
  const pgFixtureEl = document.getElementById("sl-pg-fixture");
  const pgMetaEl = document.getElementById("sl-pg-meta");
  const pgTeamsEl = document.getElementById("sl-pg-teams");

  document.getElementById("sl-exit").onclick = () => go("#/home");

  if (!pool.length) {
    fixtureEl.textContent = "";
    interstitialEl.className = "spotlight-interstitial on idle";
    kickerEl.textContent = "Spotlight idle";
    titleEl.textContent = data.run
      ? "This run has no watchable matches yet."
      : "No evaluation has been published yet.";
    metaEl.textContent = "Recorded matches will appear here automatically.";
    spotlight = {
      onMessage() {},
      onKey(event) { if (event.key === "Escape") go("#/home"); },
      timer: 0,
      transitionTimer: 0,
      goalTimer: 0,
      pregameTimer: 0,
    };
    window.addEventListener("keydown", spotlight.onKey);
    return;
  }

  spotlight = {
    runId: data.run ? data.run.run_id : runId,
    queue: shuffled(pool),
    at: -1,
    total: pool.length,
    timer: 0,
    transitionTimer: 0,
    goalTimer: 0,
    pregameTimer: 0,
    current: null,
    onMessage: null,
    onKey: null,
  };

  // ``titleHtml`` rather than text: the full-time slate sets the two teams and
  // the scoreline as separate lines, and every caller escapes its own names.
  function showSlate(kind, kicker, titleHtml, meta) {
    interstitialEl.className = `spotlight-interstitial on${kind ? ` ${kind}` : ""}`;
    kickerEl.textContent = kicker;
    titleEl.innerHTML = titleHtml;
    metaEl.textContent = meta;
  }

  function hideSlate() {
    interstitialEl.classList.remove("on");
  }

  function hideGoal() {
    goalEl.classList.remove("show");
  }

  function hidePregame() {
    pregameEl.classList.remove("on");
  }

  // One team's pre-match sheet: their league record and every badge they have
  // earned in this run. A team with no row (should not happen for a watchable
  // fixture) still gets a card, just without the numbers.
  function teamSheet(slug, label) {
    const row = standBySlug.get(slug);
    const name = label || watchTeamLabel(row ? row.name : slug);
    const kindLabel = !row ? ""
      : row.kind === "baseline" ? "reference"
      : row.kind === "lecturer" ? "lecturer" : "entrant";
    if (!row) {
      return `<div class="pg-team"><div class="pg-name">${escapeHtml(name)}</div>
        <p class="pg-none">No league record in this run.</p></div>`;
    }
    const stat = (label, value) =>
      `<div class="pg-stat"><dt>${label}</dt><dd>${escapeHtml(String(value))}</dd></div>`;
    const stats = [
      stat("Rank", `#${row.rank}`),
      // A reference or a lecturer's team is deliberately left out of the
      // banding, so the row says which kind of team it is rather than going
      // missing and leaving the two sheets a stat out of step with each other.
      stat("Division", row.division != null ? `#${row.division}`
        : kindLabel === "reference" ? "Reference"
        : kindLabel === "lecturer" ? "Lecturer" : "—"),
      stat("W–D–L", `${row.wins}–${row.draws}–${row.losses}`),
      stat("Goals for / against", `${row.goals_for} / ${row.goals_against}`),
      stat("Win rate", `${Math.round((row.win_rate ?? 0) * 100)}%`),
      row.territory != null
        ? stat("Territory", `${row.territory.toFixed(1)}%`) : "",
      stat("Fouls / game", (row.fouls_per_match ?? 0).toFixed(1)),
      row.decision_mean_ms != null
        ? stat("Decision", `${row.decision_mean_ms.toFixed(1)} ms`) : "",
    ].join("");
    const badges = row.badges && row.badges.length
      ? `<div class="pg-badges">${badgeRow(row.badges, 0)}</div>`
      : `<p class="pg-none">No badges earned yet.</p>`;
    return `<div class="pg-team">
      <div class="pg-name">${escapeHtml(name)}</div>
      ${kindLabel ? `<div class="pg-kind">${kindLabel}</div>` : ""}
      <dl class="pg-stats">${stats}</dl>
      ${badges}
    </div>`;
  }

  function showPregame(match, left, right, meta) {
    hideSlate();
    pgFixtureEl.textContent = `${left} v ${right}`;
    pgMetaEl.textContent = meta;
    pgTeamsEl.innerHTML =
      teamSheet(match.teams[0], left) + teamSheet(match.teams[1], right);
    // Restart the fade even when two matches queue back to back.
    pregameEl.classList.remove("on");
    void pregameEl.offsetWidth;
    pregameEl.classList.add("on");
  }

  // Load the match the team sheet has been previewing and, once the viewer has
  // it, lift the sheet to reveal a replay that starts from its first tick.
  function kickOff(match) {
    if (!spotlight || spotlight.current !== match) return;
    const name = `${spotlight.runId}/${match.replay}`;
    stage.innerHTML =
      `<iframe title="match viewer" src="viewer.html?replay=${encodeURIComponent(name)}&speed=1&chrome=off"></iframe>`;
    const iframe = stage.querySelector("iframe");
    const revealAfter = performance.now() + SPOTLIGHT_INTERSTITIAL_MS;
    iframe.addEventListener("load", () => {
      if (!spotlight || stage.querySelector("iframe") !== iframe) return;
      // Whatever is left of the slate's minimum, or the whole of it if the
      // page was hidden while the replay loaded: the point of the wait is to
      // be seen, and time spent on a tab nobody was looking at was not.
      const wait = pageHidden()
        ? SPOTLIGHT_INTERSTITIAL_MS
        : Math.max(0, revealAfter - performance.now());
      spotlight.transitionTimer = pausableTimeout(hidePregame, wait);
    });
    spotlight.timer = pausableTimeout(advance, SPOTLIGHT_MAX_SECONDS * 1000);
  }

  function advance() {
    if (!spotlight) return;
    cancelTimer(spotlight.timer);
    cancelTimer(spotlight.transitionTimer);
    cancelTimer(spotlight.goalTimer);
    cancelTimer(spotlight.pregameTimer);
    hideGoal();
    // Nothing plays behind the team sheet: the match is loaded only when the
    // sheet's time is up, so every replay opens on its kickoff.
    stage.innerHTML = "";
    spotlight.at += 1;
    if (spotlight.at >= spotlight.queue.length) {
      spotlight.queue = shuffled(pool);
      spotlight.at = 0;
    }
    const match = spotlight.queue[spotlight.at];
    spotlight.current = match;
    const left = watchTeamLabel(match.teams[0]);
    const right = watchTeamLabel(match.teams[1]);
    const matchMeta = `Seed ${match.seed}${match.round ? ` · round ${match.round}` : ""}`;
    fixtureEl.textContent = `${left} v ${right}`;
    countEl.textContent = matchMeta.toLowerCase();
    showPregame(match, left, right, matchMeta);
    spotlight.pregameTimer = pausableTimeout(() => kickOff(match), SPOTLIGHT_PREGAME_MS);
  }

  function celebrateGoal(message) {
    const team = message.teamName ? watchTeamLabel(message.teamName) : "";
    // One class does the whole switch — see the cup's `celebrateGoal`.
    goalEl.classList.toggle("own-goal", !!message.ownGoal);
    goalHeadlineEl.textContent = message.ownGoal ? "Own goal" : "Goal";
    goalTeamEl.textContent = team;
    cancelTimer(spotlight.goalTimer);
    hideGoal();
    // Restart the animation even when goals arrive close together.
    void goalEl.offsetWidth;
    goalEl.classList.add("show");
    spotlight.goalTimer = pausableTimeout(hideGoal, SPOTLIGHT_GOAL_MS);
  }

  function finishMatch(message) {
    const match = spotlight.current;
    if (!match) { advance(); return; }
    cancelTimer(spotlight.timer);
    cancelTimer(spotlight.goalTimer);
    cancelTimer(spotlight.pregameTimer);
    hideGoal();
    hidePregame();
    const left = watchTeamLabel(match.teams[0]);
    const right = watchTeamLabel(match.teams[1]);
    // The replay reports its final score in its own team order, which the
    // engine may have swapped against the fixture; line the two up by slug so
    // the number on each side belongs to the team named on that side.
    let score = Array.isArray(message.score) ? message.score.slice() : null;
    if (score && Array.isArray(message.teams) && message.teams[0] === match.teams[1]) {
      score.reverse();
    }
    // Two lines rather than one: the names take whatever width they need and
    // the scoreline sits under them, so a fixture between two long team names
    // no longer pushes the numbers apart or wraps between them.
    const result = `<span class="ft-teams">${escapeHtml(left)} v ${escapeHtml(right)}</span>`
      + (score ? `<span class="ft-score">${score[0]} — ${score[1]}</span>` : "");
    showSlate("full-time", "Full time", result, "The next recorded match is coming up.");
    spotlight.transitionTimer = pausableTimeout(advance, SPOTLIGHT_RESULT_MS);
  }

  spotlight.onMessage = (event) => {
    const iframe = stage.querySelector("iframe");
    if (!iframe || event.source !== iframe.contentWindow || !event.data) return;
    if (event.data.type === "replay-ended") finishMatch(event.data);
    else if (event.data.type === "replay-goal") celebrateGoal(event.data);
  };
  spotlight.onKey = (event) => {
    if (event.key === "Escape") go("#/home");
    else if (event.key === "ArrowRight" || event.key === "n") advance();
  };
  window.addEventListener("message", spotlight.onMessage);
  window.addEventListener("keydown", spotlight.onKey);

  advance();
}

function showHelp() {
  const faq = [
    ["My team works locally but was not entered.",
     `Open the run's <a href="#/standings">standings</a> and look at "Not entered": the
      reason is recorded there. It is almost always a second <code>.py</code> file, a
      file that is not called <code>team.py</code>, or a decision over the 20 ms
      deadline.`],
    ["How is the table decided?",
     `Every pairing plays the whole seed set from both ends of the pitch with alternating
      kickoff. Points are per match — three for a win, one for a draw — then goal
      difference, then goals scored. A Swiss run ranks on points per match and then on the
      strength of the opponents you were given.`],
    ["What is a division, and why am I below a team on fewer points?",
     `A round robin's table is cut into <strong>divisions of twenty</strong> on points, top
      down. Which division you are in is decided by points alone. Inside a division you are
      ordered on <strong>mean decision time</strong>, least first — everyone in the band
      wins about as often, so what separates you is what the football cost to compute. A
      team a point behind you can therefore finish above you, but never in a better
      division. Reference teams are not placed in a division: they are compiled into the
      engine and decide in microseconds, which no Python team can be asked to match.`],
    ["Why did I lose 0-3 without playing?",
     `That is a forfeit: your team raised too many times in a row, or a fixture never
      finished. Both are reported on your team's page. A team that hangs is stopped and
      loses; the run continues.`],
    ["Can I use numpy, torch, or anything else?",
     `Only the standard library and the <code>soccer</code> SDK. Nothing else is installed
      on the marking machine, and an import it cannot satisfy fails your submission at
      load time.`],
    ["Can I read files, or keep state between matches?",
     `Keep state inside your controller for one match; <code>reset()</code> is called
      before each. Every match reloads your file, so nothing survives between matches, and
      nothing outside your folder should be read or written.`],
    ["I think a result is wrong.",
     `Every row carries the seed, the sides, the kickoff, the engine version and the
      configuration hash. Ask for the row and the match can be replayed exactly as it was
      played. That is the point of recording them.`],
  ];

  view.innerHTML = `
    <h2 class="section">Help</h2>
    <p class="lede">The questions that actually get asked.</p>
    ${faq.map(([question, answer]) => `
      <div class="card">
        <h3>${escapeHtml(question)}</h3>
        <p class="small" style="margin:0">${answer}</p>
      </div>`).join("")}
    <div class="card">
      <h3>Still stuck</h3>
      <p class="small muted" style="margin:0">
        Run <code>./start.sh check</code> in your download and bring its output. It runs
        the same checks in the same order as the server, so its complaint is the server's
        complaint.
      </p>
    </div>`;
}

(async function start() {
  try {
    site = await api("api/site");
  } catch (error) {
    fail(new Error(`the server is not answering: ${error.message}`));
    return;
  }
  document.getElementById("course").textContent = site.course;
  document.title = site.course;
  document.getElementById("facts").innerHTML = `
    <span>engine ${escapeHtml(site.engine.version)}</span>
    <span>${plural((site.runs || []).length, "run")}</span>
    <span>${site.uploads ? "uploads open" : "uploads closed"}</span>`;
  document.getElementById("nav").innerHTML = TABS
    .filter(([tab]) => published(tab))
    .map(([tab, label]) => `
    <button data-tab="${tab}">${label}</button>`).join("");
  for (const button of document.querySelectorAll("nav button")) {
    button.onclick = () => go(`#/${button.dataset.tab}`);
  }
  watchCupLive();
  window.addEventListener("hashchange", route);
  route();
})();
</script>
</body>
</html>
