  }
  .empty { color: var(--muted); padding: 30px 0; text-align: center; }
  .err { color: var(--bad); }
</style>
</head>
<body>

<header class="top">
  <div class="bar">
    <div class="brand">
      <h1><span class="ball">●</span> <span id="course">Soccer Agent Challenge</span></h1>
      <span class="muted small" id="tagline">five-a-side, written in Python, played by the thousand</span>
      <div class="facts" id="facts"></div>
    </div>
    <nav id="nav"></nav>
  </div>
</header>

<main id="view"><div class="empty">Loading…</div></main>
<div id="badge-tooltip" class="badge-tooltip" role="tooltip" hidden></div>

<script>
"use strict";

// ---------------------------------------------------------------------------
// State. The site is a reader: everything it shows comes from the run
// directories the server was pointed at, fetched on demand and never cached
// here, so a page refresh during a tournament shows the table as it stands.
// ---------------------------------------------------------------------------

let site = null;
let currentRun = "";          // "" means the newest complete run
let statisticsCarouselTimer = null;
const view = document.getElementById("view");

const PODIUM_AVATARS = {
  1: "assets/podium-gold.jpg",
  2: "assets/podium-silver.jpg",
  3: "assets/podium-bronze.jpg",
};

const TABS = [
  ["home", "Home"],
  ["docs", "Docs"],
  ["downloads", "Downloads"],
  ["submit", "Submit"],
  ["standings", "Standings"],
  ["watch", "Watch"],
  ["cup", "Cup"],
  ["spotlight", "Spotlight"],
  ["help", "Help"],
];

// The public site publishes the student guide alone; the other three are the
// course team's own notes and appear only when the server is run with
// --staff-docs. Their titles stay here so that site reads properly.
const DOC_TITLES = {
  "student-guide": "Student guide",
  "readme": "Platform overview",
  "evaluation": "How you are evaluated",
  "platform": "Platform internals",
};

const DOWNLOAD_NOTES = {
  "simple_team.py": "The starting point: a working team in about forty lines.",
  "annotated_team.py": "The same idea with every part of the API explained.",
  "example-chaser.zip": "A complete worked team, ready to drop into your download.",
  "example-passer.zip": "A second worked team, for something to play against.",
};

// ---------------------------------------------------------------------------
// Plumbing
// ---------------------------------------------------------------------------

async function api(path, params, headers) {
  const query = new URLSearchParams(params || {});
  for (const [key, value] of [...query]) if (!value) query.delete(key);
  const url = query.toString() ? `${path}?${query}` : path;
  const response = await fetch(url, headers ? { headers } : undefined);
  const data = await response.json().catch(() => ({ error: "the server sent nothing readable" }));
  if (data && data.error) {
    const error = new Error(data.error);
    // Carried through so a caller can tell "wrong password" from any other
    // refusal without matching on the message text.
    error.locked = !!data.locked;
    throw error;
  }
  return data;
}

/**
 * Posts JSON and reads JSON back.
 *
 * Unlike `api`, a refusal is not an exception: the one thing this sends is a
 * reaction, and "you are still on cooldown" or "the room is at its limit" are
 * ordinary answers about a button, not failures. The caller reads `ok`.
 */
async function postJson(path, body, headers) {
  const response = await fetch(path, {
    method: "POST",
    headers: { "Content-Type": "application/json", ...(headers || {}) },
    body: JSON.stringify(body || {}),
  });
  return response.json().catch(() => ({ ok: false, error: "the server sent nothing readable" }));
}

const escapeHtml = (text) => String(text ?? "").replace(/[&<>"']/g, (c) => (
  { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
));

function titleWord(word) {
  if (!word) return "";
  return word.charAt(0).toUpperCase() + word.slice(1).toLowerCase();
}

function watchTeamLabel(name) {
  const raw = String(name || "").trim();
  const parts = raw.split("-").filter(Boolean);
  if (parts.length >= 3 && /^[0-9]+$/.test(parts[0])) {
    return parts.slice(1).map(titleWord).join(" ");
  }
  return raw;
}

const displayTeamName = watchTeamLabel;

const plural = (n, one, many) => `${n} ${n === 1 ? one : (many || one + "s")}`;

// A row of earned badge icons, wherever a name is shown. `max` caps how many
// are drawn before folding the rest into a "+N" pill — the standings table
// has one line to work with; a team's own page has room to show every one.
// Each icon carries its own badge data in a data-attribute rather than in a
// per-icon tooltip node, so hovering it can show one shared full-size popup
// (see showBadgeTooltip) instead of duplicating a description card 40 times
// down a long standings table.
function badgeRow(badges, max, compact = false) {
  if (!badges || !badges.length) return "";
  const shown = max ? badges.slice(0, max) : badges;
  const hidden = max ? badges.length - shown.length : 0;
  const icons = shown.map((badge) => badgeIcon(badge, compact)).join("");
  const more = hidden > 0
    ? `<span class="badge-more" title="${escapeHtml(badges.slice(shown.length).map((b) => b.name).join(", "))}">+${hidden}</span>`
    : "";
  return `<span class="badges">${icons}${more}</span>`;
}

function badgeIcon(badge, compact = false) {
  const tierClass = badge.tier ? ` tier-${escapeHtml(badge.tier)}` : "";
  const payload = escapeHtml(encodeURIComponent(JSON.stringify(badge)));
  const icon = compact ? (badge.smallIcon || badge.icon) : badge.icon;
  return `<span class="badge${tierClass}" tabindex="0" data-badge="${payload}">
    <img class="badge-icon" src="assets/${encodeURIComponent(icon)}"
      alt="${escapeHtml(badge.name)}" loading="lazy">
  </span>`;
}

// The one badge popup on the page: filled in and moved to wherever the
// pointer or keyboard focus currently is, so it always renders at full size
// with the badge's own description — a tiny inline icon never has room for
// either. Fixed positioning (not absolute inside the row) means it is never
// clipped by the standings table's horizontally-scrolling card.
const badgeTooltip = document.getElementById("badge-tooltip");

function showBadgeTooltip(anchor) {
  let badge;
  try {
    badge = JSON.parse(decodeURIComponent(anchor.dataset.badge || ""));
  } catch {
    return;
  }
  badgeTooltip.className = `badge-tooltip${badge.tier ? ` tier-${badge.tier}` : ""}`;
  badgeTooltip.innerHTML = `
    <img src="assets/${encodeURIComponent(badge.icon)}" alt="">
    <strong>${escapeHtml(badge.name)}</strong>
    <p>${escapeHtml(badge.description || "")}</p>
    ${badge.condition ? `<p class="condition">${escapeHtml(badge.condition)}</p>` : ""}
  `;
  badgeTooltip.hidden = false;
  positionBadgeTooltip(anchor);
}

function positionBadgeTooltip(anchor) {
  const spot = anchor.getBoundingClientRect();
  const box = badgeTooltip.getBoundingClientRect();
  const margin = 8;
  let left = spot.left + spot.width / 2 - box.width / 2;
  left = Math.max(margin, Math.min(left, window.innerWidth - box.width - margin));
  let top = spot.bottom + margin;
  if (top + box.height > window.innerHeight - margin) {
    top = spot.top - box.height - margin;
  }
  badgeTooltip.style.left = `${left}px`;
  badgeTooltip.style.top = `${Math.max(margin, top)}px`;
}

function hideBadgeTooltip() {
  badgeTooltip.hidden = true;
}

// Delegated on document, once, rather than bound per icon: the standings
// table and every team page replace #view's whole subtree on navigation, so
// per-element listeners would need rebinding on every render. Delegation
// keeps working across all of that for free.
document.addEventListener("mouseover", (event) => {
  const anchor = event.target.closest(".badge");
  if (anchor) showBadgeTooltip(anchor);
});
document.addEventListener("mouseout", (event) => {
  const anchor = event.target.closest(".badge");
  if (anchor && !anchor.contains(event.relatedTarget)) hideBadgeTooltip();
});
document.addEventListener("focusin", (event) => {
  const anchor = event.target.closest(".badge");
  if (anchor) showBadgeTooltip(anchor);
});
document.addEventListener("focusout", (event) => {
  if (event.target.closest(".badge")) hideBadgeTooltip();
});
window.addEventListener("scroll", hideBadgeTooltip, true);

function when(iso) {
  if (!iso) return "—";
  const date = new Date(iso);
  return isNaN(date) ? iso : date.toLocaleString();
}

function runLabel(run) {
  const status = run.status === "complete"
    ? '<span class="pill done">complete</span>'
    : `<span class="pill live">${escapeHtml(run.status)}</span>`;
  return `${escapeHtml(run.run_id)} ${status}`;
}

function runPicker(runs, selected) {
  if (!runs.length) return "";
  const options = runs.map((run) => `
    <option value="${escapeHtml(run.run_id)}" ${run.run_id === selected ? "selected" : ""}>
      ${escapeHtml(run.run_id)} · ${escapeHtml(run.mode)} · ${run.teams} teams
    </option>`).join("");
  return `
    <label for="run-pick">Evaluation run</label>
    <select id="run-pick" style="max-width:520px">
      <option value="">the current ladder</option>${options}
    </select>`;
}

function bindRunPicker(rerender) {
  const picker = document.getElementById("run-pick");
  if (!picker) return;
  picker.onchange = () => { currentRun = picker.value; rerender(); };
}

// ---------------------------------------------------------------------------
// Timers that stop when nobody is watching
//
// A broadcast — the Cup tab or the Spotlight — is a sequence of holds: a slate
// for four seconds, a movement beat for two, a backstop for however long a
// match ought to take. Every one of those is wall-clock time, and a hidden tab
// does not stop wall-clock time. It does stop the football: the viewer's
// playback is driven only by `requestAnimationFrame`, and browsers do not run
// animation frames for a document that is not visible.
//
// So a tab left in the background used to pause the match and let the clock
// waiting on it keep running. The backstop that exists for a replay which
// never loads then fired for a replay that was merely paused — revealing a
// result the match had not reached, which is the one thing the Cup tab is
// built not to do. The beat timers had a milder version of the same fault:
// they ran while nobody could see them, so coming back landed you halfway
// through an animation instead of at the start of one.
//
// These hold their *remaining* time instead. Hidden, they stop. Visible, they
// carry on from where they stopped. Which also means a broadcast left in a
// background tab is exactly where it was when you come back to it.
//
// Note that focus and visibility are different things: a window that is
// unfocused but still on screen is visible, and keeps playing. Only genuinely
// hidden — another tab, or minimised — pauses anything.
// ---------------------------------------------------------------------------

const pausableTimers = new Set();

function pageHidden() {
  try {
    return !!document.hidden;
  } catch (_) {
    return false;   // a browser without the API is treated as always visible
  }
}

function pausableTimeout(fn, ms) {
  const timer = {
    left: Math.max(ms, 0),
    startedAt: 0,
    id: 0,
    resume() {
      if (timer.id) return;
      timer.startedAt = Date.now();
      timer.id = setTimeout(() => {
        timer.id = 0;
        pausableTimers.delete(timer);
        fn();
      }, timer.left);
    },
    pause() {
      if (!timer.id) return;
      clearTimeout(timer.id);
      timer.id = 0;
      timer.left = Math.max(timer.left - (Date.now() - timer.startedAt), 0);
    },
    cancel() {
      clearTimeout(timer.id);
      timer.id = 0;
      pausableTimers.delete(timer);
    },
  };
  pausableTimers.add(timer);
  // Created while hidden, it simply does not start until the page is looked at.
  if (!pageHidden()) timer.resume();
  return timer;
}

/** Cancels a pausable timer, or a plain `setTimeout` id, or nothing at all. */
function cancelTimer(timer) {
  if (!timer) return;
  if (typeof timer === "number") clearTimeout(timer);
  else if (typeof timer.cancel === "function") timer.cancel();
}

document.addEventListener("visibilitychange", () => {
  const hidden = pageHidden();
  // A copy, because a timer firing on resume removes itself from the set.
  for (const timer of [...pausableTimers]) {
    if (hidden) timer.pause();
    else timer.resume();
  }
});

function fail(error) {
  view.innerHTML = `<div class="card"><span class="err">${escapeHtml(error.message || error)}</span></div>`;
}

// ---------------------------------------------------------------------------
// Routing
// ---------------------------------------------------------------------------

const routes = {
  home: showHome,
  docs: showDocs,
  downloads: showDownloads,
  submit: showSubmit,
  standings: showStandings,
  team: showTeam,
  watch: showWatch,
  cup: showCup,
  spotlight: showSpotlight,
  help: showHelp,
};

// The header the cup's password travels in — a header rather than a query
// parameter because the server logs every request path. Must agree with
// `server.CUP_PASSWORD_HEADER`.
const CUP_PASSWORD_HEADER = "X-Cup-Password";

// How the server publishes the cup: "open", "locked" or "off". See
// `Arena.cup_access`.
function cupAccess() {
  return (site && site.cup) || "off";
}

// How often the nav asks whether a cup has come on air. A minute: the news is
// "a competition is being broadcast", which stays true for an hour and a half,
// so nothing is gained by asking more often and this runs in every tab
// anybody has left open.
const CUP_LIVE_POLL_MS = 60000;

/**
 * Lights the Cup tab while a cup is being broadcast.
 *
 * The nav is the only place this news reaches somebody who is not already
 * looking at the cup — and a tab opened on Sunday afternoon has to learn it
 * without being reloaded, which is why this polls rather than reading the
 * boot payload once. `api/cup-status` is the thin endpoint for exactly this:
 * one bit, no bracket.
 *
 * Only for a published cup. A hidden one has no nav entry to light and the
 * server tells this nothing about it either — see `Arena.cup_status`.
 */
function watchCupLive() {
  if (cupAccess() !== "open") return;
  const button = document.querySelector('nav button[data-tab="cup"]');
  if (!button) return;
  const ask = async () => {
    let status;
    try {
      status = await api("api/cup-status");
    } catch (_) {
      // A failed poll is not worth reporting anywhere: the nav simply keeps
      // saying whatever it last knew, and the next poll is a minute away.
      return;
    }
    const live = !!(status && status.live);
    button.classList.toggle("live", live);
    // Colour and a pulsing dot are not the whole message. Said in words too,
    // so it survives a reader who cannot see either.
    if (live) {
      button.title = "The cup is on air now";
      button.setAttribute("aria-label", "Cup — on air now");
    } else {
      button.removeAttribute("title");
      button.removeAttribute("aria-label");
    }
  };
  ask();
  setInterval(ask, CUP_LIVE_POLL_MS);
}

// Whether a tab gets a nav entry. The cup is the only one that does not always:
// it is built, re-drawn and re-played while a class is reading the rest of the
// site, so it stays off the nav until it is fully published. While it is
// "locked" it is reachable at its own URL by anybody who knows the password,
// and deliberately not advertised — being off the nav is the point.
function published(tab) {
  return tab !== "cup" || cupAccess() === "open";
}

// Whether a route resolves at all. Wider than `published`: a locked cup has no
// nav entry but its URL still works, which is the whole arrangement.
function routable(tab) {
  return tab !== "cup" || cupAccess() !== "off";
}

function route() {
  stopStatisticsCarousel();
  stopSpotlight();
  stopCup();
  stopQueue();
  const parts = (location.hash.replace(/^#\/?/, "") || "home").split("/");
  const tab = routes[parts[0]] && routable(parts[0]) ? parts[0] : "home";
  for (const button of document.querySelectorAll("nav button")) {
    const target = button.dataset.tab;
    button.classList.toggle("on", target === tab || (tab === "team" && target === "standings"));
  }
  view.innerHTML = '<div class="empty">Loading…</div>';
  Promise.resolve(routes[tab](parts.slice(1))).catch(fail);
}

function go(hash) { location.hash = hash; }

// ---------------------------------------------------------------------------
// Home
// ---------------------------------------------------------------------------

async function showHome() {
  const runs = site.runs || [];
  let table = "";
  if (runs.length) {
    try {
      const data = await api("api/table", { run: currentRun });
      const top = data.standings.slice(0, 5);
      table = `
        <div class="card">
          <h3>Leading teams · ${escapeHtml(data.run.mode)} · ${escapeHtml(data.run.run_id)}</h3>
          ${standingsTable(top, data.run.mode)}
          <p class="small muted" style="margin:12px 0 0">
            <a href="#/standings">The whole table →</a>
          </p>
        </div>`;
    } catch (error) {
      table = `<div class="card"><span class="muted">${escapeHtml(error.message)}</span></div>`;
    }
  } else {
    table = `<div class="card illustrated-empty">
      <img src="assets/empty-pitch.jpg" alt="" loading="lazy">
      <div class="empty-copy">
        <h3>The pitch is ready</h3>
        <p class="muted">No evaluation has been published yet. Your first table
          appears here once the course runs one.</p>
      </div>
    </div>`;
  }

  view.innerHTML = `
    <section class="hero" aria-labelledby="hero-title">
      <div class="hero-copy">
        <div class="eyebrow">Code the team · trust the result</div>
        <h2 id="hero-title">Build the system. Watch it play.</h2>
        <p>You submit one Python file. The platform plays it against every other team
          over fixed seeds, from both ends of the pitch, and publishes the table here.</p>
        <div class="hero-actions">
          <a class="action-link" href="#/docs/student-guide">Start building</a>
          <a class="ghost-link" href="#/watch">Watch a match</a>
        </div>
      </div>
    </section>

    <div class="cols">
      <div class="card">
        <h3>Getting started</h3>
        <ol class="steps">
          <li>Read the <a href="#/docs/student-guide">student guide</a> — the whole API is one page.</li>
          <li><a href="#/downloads">Download</a> the platform and unzip it. The engine is
              already built; you need nothing but Python.</li>
          <li>Write your tactics in <code>my-team/team.py</code>. That one file is your team.</li>
          <li>Check it yourself: <code>./start.sh check</code>, then
              <code>./start.sh tournament my-team --against balanced</code>.</li>
          <li><a href="#/submit">Hand in</a> <code>team.py</code> on Moodle, then
              <a href="#/watch">watch</a> it play.</li>
        </ol>
      </div>
      <div class="card">
        <h3>What a submission is</h3>
        <pre><code>${escapeHtml(site.submission.team_module)}     your team, all of it, one file</code></pre>
        <p class="small muted">
          One file, that exact name, handed in on Moodle. Code up to
          ${site.submission.code_limit_kb} KB. A second <code>.py</code> file is
          rejected — the server loads <code>team.py</code> on its own, so another
          module would not import.
        </p>
      </div>
    </div>

    ${table}

    <div class="cols-3">
      <div class="card">
        <h3>Reference opponents</h3>
        <p class="small muted">Beat these before worrying about the table. They run inside the
        engine, so you can play them any number of times locally.</p>
        <p class="small mono">${(site.engine.baselines || []).map(escapeHtml).join(" · ")}</p>
      </div>
      <div class="card">
        <h3>Same rules for everyone</h3>
        <p class="small muted">Every graded match is played under one configuration, identified
        by a hash that is recorded with every result.</p>

function stopStatisticsCarousel() {
  if (statisticsCarouselTimer !== null) clearInterval(statisticsCarouselTimer);
  statisticsCarouselTimer = null;
}

function statisticValue(slide, value) {
  const number = Number(value) || 0;
  if (slide.format === "percentage") return `${number.toFixed(1)}%`;
  if (slide.format === "distance") return `${number.toFixed(1)} units / match`;
  return `${number.toFixed(2)} / match`;
}

// The same number without the trailing "/ match", for a tile that says so once
// in its own caption rather than thirteen times down a column.
function statisticNumber(metric, value) {
  const number = Number(value) || 0;
  if (metric.format === "percentage") return `${number.toFixed(1)}%`;
  if (metric.format === "distance") return number.toFixed(1);
  return number.toFixed(2);
}

const STATISTIC_UNITS = {
  "percentage": "share of played ticks",
  "distance": "pitch units per match",
  "per-match": "per match",
};

function podiumEntry(slide, leader, rank) {
  const memberNames = (leader.members || []).map((member) => member.name).filter(Boolean);
  const people = memberNames.length ? memberNames.join(" · ") : "Reference opponent";
  const places = ["", "Gold", "Silver", "Bronze"];
  return `
    <article class="podium-entry place-${rank}">
      <div class="podium-person">
        <img class="podium-avatar" src="${PODIUM_AVATARS[rank]}" alt="">
        <span class="podium-medal" aria-label="${places[rank]} medal, place ${rank}">${rank}</span>
        <a class="podium-team" href="#/team/${encodeURIComponent(leader.slug)}"
          title="${escapeHtml(displayTeamName(leader.name))}">${escapeHtml(displayTeamName(leader.name))}</a>
        <div class="podium-members">${escapeHtml(people)}</div>
        <div class="podium-value">${statisticValue(slide, leader.value)}</div>
      </div>
      <div class="podium-step" aria-hidden="true">${rank}</div>
    </article>`;
}

function statisticSlide(slide, index, total) {
  const leaders = slide.leaders || [];
  const order = [1, 0, 2].filter((leaderIndex) => leaders[leaderIndex]);
  return `
    <div class="stat-slide" role="group" aria-roledescription="slide"
      aria-label="${index + 1} of ${total}: ${escapeHtml(slide.title)}">
      <div class="stat-title">
        <div class="eyebrow">League leaders · played fixtures only</div>
        <h4>${escapeHtml(slide.title)}</h4>
        <p>${escapeHtml(slide.description)}</p>
      </div>
      <div class="podium">
        ${order.map((leaderIndex) => podiumEntry(
          slide, leaders[leaderIndex], leaderIndex + 1
        )).join("")}
      </div>
    </div>`;
}

function statisticsCarousel(statistics) {
  const slides = (statistics || {}).slides || [];
  if (!slides.length) return `
    <div class="card">
      <h3>Match statistics</h3>
      <p class="small muted" style="margin:0">No played fixtures have statistics yet.</p>
    </div>`;
  return `
    <section class="card stats-showcase" id="stats-showcase"
      aria-label="League statistics leaders">
      <div class="stats-heading">
        <div>
          <h3>Match statistics podium</h3>
          <p class="small">Top teams across the run, averaged fairly per played match.</p>
        </div>
        <span class="pill stats-count">${plural(statistics.matches_counted, "fixture")} counted</span>
      </div>
      <div class="stats-carousel" id="stats-carousel" tabindex="0"
        role="region" aria-roledescription="carousel">
        <div class="stats-stage" id="stats-stage" aria-live="polite"></div>
      </div>
      <div class="stats-controls">
        <button class="carousel-arrow" id="stats-prev" aria-label="Previous statistic">‹</button>
        <div class="stats-dots" id="stats-dots">
          ${slides.map((slide, index) => `
            <button class="stats-dot${index === 0 ? " on" : ""}" data-stat-slide="${index}"
              aria-label="Show ${escapeHtml(slide.title)}"></button>`).join("")}
        </div>
        <span class="stats-position" id="stats-position"></span>
        <button class="carousel-arrow" id="stats-next" aria-label="Next statistic">›</button>
      </div>
    </section>`;
}

function bindStatisticsCarousel(statistics) {
  const slides = (statistics || {}).slides || [];
  const shell = document.getElementById("stats-showcase");
  const stage = document.getElementById("stats-stage");
  if (!shell || !stage || !slides.length) return;

  let index = 0;
  const dots = [...shell.querySelectorAll("[data-stat-slide]")];
  const position = document.getElementById("stats-position");

  function draw(next) {
    index = (next + slides.length) % slides.length;
    stage.innerHTML = statisticSlide(slides[index], index, slides.length);
    dots.forEach((dot, dotIndex) => {
      dot.classList.toggle("on", dotIndex === index);
      dot.setAttribute("aria-current", dotIndex === index ? "true" : "false");
    });
    position.textContent = `${index + 1} / ${slides.length}`;
  }

  function start() {
    stopStatisticsCarousel();
    if (slides.length < 2 || window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    statisticsCarouselTimer = setInterval(() => draw(index + 1), 6500);
  }

  document.getElementById("stats-prev").onclick = () => draw(index - 1);
  document.getElementById("stats-next").onclick = () => draw(index + 1);
  dots.forEach((dot) => {
    dot.onclick = () => draw(Number(dot.dataset.statSlide));
  });
  shell.onmouseenter = stopStatisticsCarousel;
  shell.onmouseleave = start;
  shell.onfocusin = stopStatisticsCarousel;
  shell.onfocusout = (event) => {
    if (!shell.contains(event.relatedTarget)) start();
  };
  shell.onkeydown = (event) => {
    if (event.key === "ArrowLeft") { event.preventDefault(); draw(index - 1); }
    if (event.key === "ArrowRight") { event.preventDefault(); draw(index + 1); }
  };

  draw(0);
  start();
}

// A dash rather than a zero where nothing was measured — a team that forfeited
// every fixture before reaching a decision. 0.000 would read as the fastest
// team on the table, which is also why a real time under a microsecond is
// shown as "<0.001" rather than rounded down to a zero it did not record.
function decisionTime(value) {
  if (value === null || value === undefined) return "—";
  if (value > 0 && value < 0.001) return "<0.001";
  return value.toFixed(3);
}

// Crashes and missed deadlines, per match played. A rate rather than a raw
// count so it is comparable down the whole table; smaller is better.
function reliabilityRate(row) {
  const failures = (row.policy_errors || 0) + (row.policy_timeouts || 0);
  if (!row.played) return { text: failures ? String(failures) : "—", bad: failures > 0 };
  return { text: (failures / row.played).toFixed(2), bad: failures > 0 };
}

function standingsTable(rows, mode, emptyMessage) {
  if (!rows.length) return `<p class="muted">${escapeHtml(emptyMessage || "No results yet.")}</p>`;
  const swiss = mode === "swiss";
  // Only a round robin has divisions, and the column is only worth its width
  // where there is something in it.
  const divided = rows.some((row) => row.division);
  const head = `
    <tr>
      <th class="n">#</th>
      ${divided ? '<th class="n" title="Bands of twenty, cut on points">Div</th>' : ""}
      <th>Team</th>
      <th class="n">Pts</th>
      <th class="n" title="Mean time one decision took. Inside a division, less is better.">Dec ms</th>
      ${swiss ? '<th class="n">Pts/M</th><th class="n">Bch</th>' : ""}
      <th class="n">P</th><th class="n">W</th><th class="n">D</th><th class="n">L</th>
      <th class="n">GF</th><th class="n">GA</th><th class="n">GD</th>
      <th class="n" title="Kickoff encroachments per game">Fouls</th>
      <th class="n" title="Policy crashes and missed deadlines per game. Smaller is better.">Reliability</th>
      <th title="When this entrant's own team.py was last changed">Last updated</th>
    </tr>`;
  let previousDivision = null;
  const body = rows.map((row) => {
    // A rule above the first row of each division, so the bands read as bands
    // rather than as a column of repeated numbers.
    const opens = divided && row.division && row.division !== previousDivision;
    if (row.division) previousDivision = row.division;
    return `
    <tr class="clickable${opens ? " division-start" : ""}" data-slug="${escapeHtml(row.slug)}">
      <td class="rank">${row.rank}</td>
      ${divided ? `<td class="n muted">${row.division || "—"}</td>` : ""}
      <td class="${row.kind !== "submission" ? "base" : ""}">
        ${escapeHtml(displayTeamName(row.name))}${row.kind === "baseline" ? " · reference" : ""}${row.kind === "lecturer" ? " · lecturer" : ""}
        ${badgeRow(row.badges, 6, true)}
        ${row.forfeits ? `<span class="pill" style="color:var(--bad)">${plural(row.forfeits, "forfeit")}</span>` : ""}
      </td>
      <td class="n"><strong>${row.points}</strong></td>
      <td class="n ${row.decision_mean_ms === null || row.decision_mean_ms === undefined ? "muted" : ""}">${decisionTime(row.decision_mean_ms)}</td>
      ${swiss ? `<td class="n">${row.points_per_match.toFixed(2)}</td><td class="n">${row.buchholz}</td>` : ""}
      <td class="n">${row.played}</td><td class="n">${row.wins}</td>
      <td class="n">${row.draws}</td><td class="n">${row.losses}</td>
      <td class="n">${row.goals_for}</td><td class="n">${row.goals_against}</td>
      <td class="n">${row.goal_difference > 0 ? "+" : ""}${row.goal_difference}</td>
      <td class="n ${row.fouls ? "" : "muted"}">${(row.fouls_per_match ?? 0).toFixed(2)}</td>
      ${(() => { const r = reliabilityRate(row); return `<td class="n ${r.bad ? "warn" : "muted"}">${r.text}</td>`; })()}
      <td class="small muted">${row.last_updated ? when(row.last_updated) : "—"}</td>
    </tr>`;
  }).join("");
  return `<div class="scroll"><table><thead>${head}</thead><tbody>${body}</tbody></table></div>`;
}

// Find a team, or read one division on its own. Both narrow the same table
// rather than reordering or renumbering it: a filtered row keeps the rank it
// holds in the whole league, because a view that renumbered from 1 would read
// as a placing nobody earned.
function standingsControls(rows) {
  const divisions = [...new Set(rows.map((row) => row.division).filter(Boolean))]
    .sort((a, b) => a - b);
  return `
    <div class="table-controls">
      <input id="team-search" type="search" placeholder="Search for a team"
             aria-label="Search for a team" autocomplete="off">
      ${divisions.length > 1 ? `
        <select id="division-filter" aria-label="Show one division">
          <option value="">All divisions</option>
          ${divisions.map((number) => `
            <option value="${number}">Division ${number}</option>`).join("")}
        </select>` : ""}
      <span class="small muted count" id="standings-count"></span>
    </div>`;
}

function bindStandingsFilters(rows, mode) {
  const host = document.getElementById("standings-table");
  if (!host) return;
  const search = document.getElementById("team-search");
  const division = document.getElementById("division-filter");
  const count = document.getElementById("standings-count");

  function apply() {
    const needle = (search.value || "").trim().toLowerCase();
    const band = division && division.value ? Number(division.value) : null;
    const shown = rows.filter((row) => {
      if (band !== null && row.division !== band) return false;
      if (!needle) return true;
      return row.name.toLowerCase().includes(needle)
        || row.slug.toLowerCase().includes(needle);
    });
    host.innerHTML = standingsTable(shown, mode,
      needle ? `No team matches "${needle}".` : "No teams in that division.");
    count.textContent = shown.length === rows.length
      ? plural(rows.length, "team")
      : `${shown.length} of ${rows.length} teams`;
    // The rows are new elements, so their click handlers are too.
    bindTeamRows();
  }

  search.oninput = apply;
  if (division) division.onchange = apply;
  apply();
}

// Every standings row, wherever it was rendered, opens that team's page.
function bindTeamRows() {
  for (const row of view.querySelectorAll("tr[data-slug]")) {
    row.onclick = () => go(`#/team/${row.dataset.slug}`);
  }
}

// ---------------------------------------------------------------------------
// The evaluation queue
//
// The rest of the site is fetched on demand and never polled: a run directory
// only changes when somebody submits, and a refresh is the honest way to see
// that. The queue is the exception, because it is a picture of something in
// flight and a student watching it wants to know their turn has come without
// reloading. So this one panel refreshes itself, and only while it is on
// screen - stopQueue() runs on every route change, the way the statistics
// carousel's timer does.

let queueTimer = null;

const QUEUE_POLL_MS = 5000;

function stopQueue() {
  if (queueTimer !== null) {
    clearInterval(queueTimer);
    queueTimer = null;
  }
}

function queueAge(seconds) {
  const value = Math.max(0, Math.round(seconds || 0));
  if (value < 60) return `${value}s`;
  const minutes = Math.floor(value / 60);
  if (minutes < 60) return `${minutes}m ${value % 60}s`;
  return `${Math.floor(minutes / 60)}h ${minutes % 60}m`;
}

function queuePanel(state) {
  if (!state) return "";
  const running = state.running;
  const waiting = state.waiting || [];
  const recent = (state.recent || [])[0];

  // Before the idle shortcut below: a pause with an empty queue is exactly
  // when the notice matters most, and that is the branch that would hide it.
  const paused = state.maintenance
    ? `<div class="queue-paused">
         <strong>Paused</strong>
         <span class="small">${escapeHtml(state.maintenance)}</span>
       </div>`
    : "";

  if (!running && !waiting.length) {
    const idle = recent
      ? `Nothing being evaluated. Last was ${escapeHtml(recent.team)},
         ${escapeHtml(when(recent.finished_at))}, and took
         ${escapeHtml(queueAge(recent.wall_time_s))}.`
      : "Nothing being evaluated.";
    return `<div class="card">${paused}
      <p class="small muted" style="margin:0">${idle}</p></div>`;
  }

  const now = running ? `
    <div class="queue-now">
      <span class="queue-dot" aria-hidden="true"></span>
      <span>Evaluating <strong>${escapeHtml(running.team)}</strong></span>
      <span class="small muted">${escapeHtml(queueAge(running.elapsed_s))}</span>
    </div>` : "";

  const queued = waiting.length ? `
    <div class="queue-waiting">
      ${waiting.map((entry) => `
        <span class="pill" title="waiting ${escapeHtml(queueAge(entry.waiting_s))}">
          <span>${entry.position}.</span> ${escapeHtml(entry.team)}
        </span>`).join("")}
    </div>` : "";

  const summary = waiting.length
    ? `${plural(waiting.length, "team")} waiting`
    : "none waiting";

  return `
    <div class="card">
      ${paused}
      <div class="queue">
        ${now}
        ${queued}
      </div>
      <p class="small muted" style="margin:10px 0 0">
        Submissions are evaluated one at a time, in the order they arrive · ${summary}.
        ${state.maintenance
          ? "Nothing new starts until the pause ends; the queue is keeping its order."
          : "The table below updates when each finishes."}
      </p>
    </div>`;
}

async function refreshQueue() {
  const slot = document.getElementById("queue-panel");
  if (!slot) {
    stopQueue();
    return;
  }
  try {
    slot.innerHTML = queuePanel(await api("api/queue"));
  } catch (error) {
    // A queue that cannot be read is not worth breaking the standings over.
    slot.innerHTML = "";
  }
}

function bindQueue() {
  stopQueue();
  refreshQueue();
  queueTimer = setInterval(refreshQueue, QUEUE_POLL_MS);
}

async function showStandings() {
  const data = await api("api/table", { run: currentRun });
  const run = data.run;
  const options = data.options || {};
  // Two tables rather than one, and both above the standings rather than under
  // them: they are the answer to "why am I not in this table", and a student
  // asking it should not have to scroll past the whole league to find it. A
  // team that never got in has no effect on the league; a team that was in and
  // had to be withdrawn changed everybody else's games-played count on the way
  // out, which is worth saying separately.
  const withdrawn = outOfTheLeague(
    data.rejected.filter((entry) => entry.withdrawn),
    "Withdrawn from the league",
    `These teams were entered and can no longer play: every fixture they were given ended
     in a forfeit, so nothing was decided. Their results have been retired and their
     opponents' games played put back, which is why they are not in the table below.
     Each stays here until its own team.py changes and passes the check — uploading the
     same file again, or somebody else uploading, does not put a team back.`,
  );
  const rejected = outOfTheLeague(
    data.rejected.filter((entry) => !entry.withdrawn),
    "Not entered",
    `These submissions could not be played at all, so they are not in the table below. The
     reason is recorded with the run, and the fix is always on the student's side.`,
  );

  const rounds = (data.rounds.rounds || []);
  const roundBlock = rounds.length ? `
    <div class="card">
      <h3>Rounds</h3>
      <div class="scroll"><table>
        <thead><tr><th class="n">Round</th><th>Pairings</th><th>Bye</th></tr></thead>
        <tbody>${rounds.map((entry) => `
          <tr>
            <td class="n">${entry.round}</td>
            <td class="small">${entry.pairings.map((pair) =>
              `${escapeHtml(pair[0])} v ${escapeHtml(pair[1])}`).join(" · ")}</td>
            <td class="small muted">${entry.bye ? escapeHtml(entry.bye) : "—"}</td>
          </tr>`).join("")}
        </tbody>
      </table></div>
    </div>` : "";

  view.innerHTML = `
    <h2 class="section">Standings</h2>
    <p class="lede">
      ${escapeHtml(run.mode)} · ${plural(run.teams, "team")} ·
      ${plural(run.matches, "match", "matches")} ·
      ${plural((options.seeds || []).length, "seed")} per pairing, both sides.
      Three points a win, one a draw, counted per match.
      ${data.standings.some((row) => row.division)
        ? `Points cut the field into divisions of twenty; inside a division the order is
           mean decision time, least first.`
        : ""}
      Click a team for their results.
    </p>
    <div class="card">
      ${runPicker(site.runs, currentRun)}
      <p class="small muted" style="margin:10px 0 0">
        ${runLabel(run)} · started ${escapeHtml(when(run.started_at))} ·
        engine ${escapeHtml(run.engine_version || "?")} · config
        <span class="mono">${escapeHtml(run.config_hash || "?")}</span>
      </p>
    </div>
    <div id="queue-panel"></div>
    ${withdrawn}
    ${rejected}
    <div class="card">
      ${standingsControls(data.standings)}
      <div id="standings-table">${standingsTable(data.standings, run.mode)}</div>
    </div>
    ${statisticsCarousel(data.statistics)}
    ${roundBlock}`;

  bindRunPicker(showStandings);
  bindStandingsFilters(data.standings, run.mode);
  bindStatisticsCarousel(data.statistics);
  // Only the live ladder has a queue; a finished snapshot is not being added to.
  if (run.mode === "ladder") bindQueue();
}

// A team and the one line explaining why the league is not counting it. Empty
// where nobody is in that state, so a clean run shows neither card.
function outOfTheLeague(entries, heading, explanation) {
  if (!entries.length) return "";
  return `
    <div class="card">
      <h3>${escapeHtml(heading)}</h3>
      <p class="small muted">${escapeHtml(explanation)}</p>
      <div class="scroll"><table><tbody>${entries.map((entry) => `
        <tr><td class="mono">${escapeHtml(displayTeamName(entry.slug))}</td>
            <td class="small muted">${escapeHtml((entry.errors || [""])[0].split("\n")[0])}</td></tr>`).join("")}
      </tbody></table></div>
    </div>`;
}

// ---------------------------------------------------------------------------
// One team
// ---------------------------------------------------------------------------

// A team's own averages, over every match they played in the run. The metrics
// are the ones the league podium ranks, reported here whether or not the team
// leads any of them: a team page answers "how did we play", not "did we win
// this one".
function teamStatistics(statistics) {
  const metrics = (statistics || {}).metrics || [];
  if (!metrics.length) return `
    <div class="card">
      <h3>Full statistics</h3>
      <p class="small muted" style="margin:0">
        No played fixture in this run recorded match statistics for this team.
      </p>
    </div>`;

  const clamp = (value) => Math.max(0, Math.min(1, value));
  const tiles = metrics.map((metric) => {
    // Scaled between the league's worst and best on this metric, so a full bar
    // always means "best in the league" whether the metric counts up or down.
    const span = metric.best - metric.worst;
    const share = span ? clamp((metric.value - metric.worst) / span) : 1;
    const mean = span ? clamp((metric.league_mean - metric.worst) / span) : 1;
    const leads = metric.rank === 1;
    return `
      <article class="stat-tile">
        <div class="stat-tile-head">
          <span class="stat-tile-label" title="${escapeHtml(metric.description)}"
            >${escapeHtml(metric.label)}</span>
          <span class="pill${leads ? " leader" : ""}">#${metric.rank} of ${metric.teams}</span>
        </div>
        <div class="stat-tile-value">${statisticNumber(metric, metric.value)}</div>
        <div class="stat-tile-unit">${escapeHtml(STATISTIC_UNITS[metric.format] || "")}</div>
        <div class="stat-meter" role="img" aria-label="${
          escapeHtml(`${statisticNumber(metric, metric.value)}, against a league mean of `
            + `${statisticNumber(metric, metric.league_mean)} and a league best of `
            + `${statisticNumber(metric, metric.best)}`)}">
          <div class="stat-meter-fill${leads ? " leader" : ""}" style="width:${(share * 100).toFixed(1)}%"></div>
          <div class="stat-meter-mean" style="left:${(mean * 100).toFixed(1)}%"></div>
        </div>
        <div class="stat-tile-foot">
          <span>league ${statisticNumber(metric, metric.league_mean)}</span>
          <span>best ${statisticNumber(metric, metric.best)}</span>
        </div>
      </article>`;
  }).join("");

  return `
    <div class="card">
      <h3>Full statistics</h3>
      <p class="small muted" style="margin:-4px 0 14px">
        Averaged over the ${plural(statistics.matches_counted, "match", "matches")} this team
        played. Forfeits and void fixtures are left out, and shares are of the ticks actually
        played, so a team that played fewer matches is neither flattered nor punished.
        The mark on each bar is the league mean.
      </p>
      <div class="stat-grid">${tiles}</div>
    </div>`;
}

async function showTeam(parts) {
  const slug = parts[0];
  if (!slug) { go("#/standings"); return; }
  const data = await api("api/team", { run: currentRun, slug });
  const standing = data.standing;
  const entrant = data.entrant;

  // Worst result first, best last: a lost pairing with a heavy goal
  // difference sorts before a narrow loss, which sorts before a draw, which
  // sorts before a win — mean goal difference alone orders all of that.
  const sortedTies = [...data.ties].sort(
    (a, b) => a.mean_goal_difference - b.mean_goal_difference
  );

  view.innerHTML = `
    <p class="small"><a href="#/standings">← all teams</a></p>
    <h2 class="section">${escapeHtml(displayTeamName(entrant.name))}
      <span class="pill">${escapeHtml(entrant.kind)}</span>${badgeRow(data.badges)}</h2>
    <p class="lede">
      ${entrant.members.length
        ? escapeHtml(entrant.members.map((m) => m.name).filter(Boolean).join(", "))
        : "A reference team, run inside the engine."}
    </p>
    <div class="cols-3">
      <div class="card">
        <h3>Placing</h3>
        <p style="font-size:26px;margin:0">#${standing.rank}
          <span class="muted" style="font-size:15px">of ${data.run.teams}</span></p>
        <p class="small muted">${standing.points} points from
          ${plural(standing.played, "match", "matches")}
          (${standing.wins}W ${standing.draws}D ${standing.losses}L)${standing.division
            ? ` · division ${standing.division}, ${decisionTime(standing.decision_mean_ms)} ms a decision`
            : ""}</p>
      </div>
      <div class="card">
        <h3>Goals</h3>
        <p style="font-size:26px;margin:0">${standing.goals_for} – ${standing.goals_against}</p>
        <p class="small muted">goal difference
          ${standing.goal_difference > 0 ? "+" : ""}${standing.goal_difference} ·
          win rate ${(standing.win_rate * 100).toFixed(0)}%</p>
      </div>
      <div class="card">
        <h3>Reliability</h3>
        <p style="font-size:26px;margin:0" class="${standing.policy_errors || standing.forfeits ? "warn" : "good"}">
          ${standing.policy_errors + standing.policy_timeouts}</p>
        <p class="small muted">exceptions and missed deadlines ·
          ${plural(standing.forfeits, "forfeit")} ·
          ${plural(standing.voided, "void fixture")}</p>
      </div>
    </div>
    ${teamStatistics(data.statistics)}
    <div class="card">
      <h3>Pairings</h3>
      <p class="small muted" style="margin:0 0 10px">Sorted worst result to best.</p>
      ${pagedControls("ties", "Search for a pairing", sortedTies.length)}
      <div id="ties-table"></div>
      <div id="ties-pager"></div>
    </div>
    <div class="card">
      <h3>Every match</h3>
      ${pagedControls("matches", "Search for an opponent", data.matches.length)}
      <div id="matches-table"></div>
      <div id="matches-pager"></div>
    </div>`;

  bindTiePages(sortedTies, data.run.mode);
  bindMatchPages(data.matches, data.run.run_id);
}

// One page of pairings. Each one carries its own statistics panel in a second,
// hidden row underneath it — a dozen more cells per pairing — which is why a
// page of twenty is rendered rather than the whole set.
function tiesTable(rows, mode, emptyMessage) {
  if (!rows.length) {
    return `<p class="muted">${escapeHtml(emptyMessage || "No pairings recorded.")}</p>`;
  }
  const columns = mode === "swiss" ? 7 : 6;
  const body = rows.map((tie) => {
    const stats = tie.statistics || [];
    // Keyed on the opponent rather than a row number, so the panel a reader
    // opened keeps its identity when the page or the search changes under it.
    const rowId = `tie-stats-${tie.opponent}`;
    const statsGrid = stats.length ? `
      <div class="tie-stats-grid">
        ${stats.map((stat) => `
          <div class="tie-stats-item">
            <span class="tie-stats-label">${escapeHtml(stat.label)}</span>
            <span>${statisticNumber(stat, stat.value)}
              <span class="muted">± ${statisticNumber(stat, stat.ci95)}</span></span>
          </div>`).join("")}
      </div>` : "";
    return `
    <tr class="tie-row${stats.length ? " has-stats" : ""}">
      ${mode === "swiss" ? `<td class="n">${tie.round}</td>` : ""}
      <td><a href="#/team/${escapeHtml(tie.opponent)}">${escapeHtml(displayTeamName(tie.opponent))}</a></td>
      <td class="n">${tie.goals[0]} – ${tie.goals[1]}</td>
      <td class="n small muted">${tie.record.join("-")}</td>
      <td class="n">${tie.won ? '<span class="good">won</span>'
        : tie.drawn ? '<span class="muted">drawn</span>' : '<span class="bad">lost</span>'}</td>
      <td class="n small muted">${tie.mean_goal_difference.toFixed(2)}
        <span class="muted">± ${tie.mean_goal_difference_ci95.toFixed(2)}</span></td>
      <td class="n">${stats.length
        ? `<button type="button" class="tie-stats-toggle" data-target="${escapeHtml(rowId)}"
             aria-expanded="false">stats ▸</button>`
        : ""}</td>
    </tr>
    ${statsGrid ? `<tr class="tie-stats-row" id="${escapeHtml(rowId)}" hidden>
        <td colspan="${columns}">${statsGrid}</td>
      </tr>` : ""}`;
  }).join("");
  return `<div class="scroll"><table>
    <thead><tr>
      ${mode === "swiss" ? '<th class="n">Round</th>' : ""}
      <th>Opponent</th><th class="n">Goals</th><th class="n">W-D-L</th>
      <th class="n">Tie</th>
      <th class="n" title="Mean goal difference over this pairing's fixtures, ± a 95% confidence interval">Mean GD</th>
      <th></th>
    </tr></thead>
    <tbody>${body}</tbody>
  </table></div>`;
}

function bindTiePages(rows, mode) {
  bindPagedTable({
    id: "ties",
    rows,
    unit: "pairing",
    matches: (tie, needle) => opponentMatches(tie.opponent, needle),
    render: (page, needle) => tiesTable(page, mode,
      needle ? `No pairing against an opponent matching "${needle}".`
             : "No pairings recorded."),
    // The toggles live inside the markup this rebuilt, so they are rewired
    // every time a page is drawn rather than once when the team page opens.
    afterRender: bindTieStatsToggles,
  });
}

function bindMatchPages(rows, runId) {
  bindPagedTable({
    id: "matches",
    rows,
    unit: "match",
    units: "matches",
    matches: (match, needle) => opponentMatches(match.teams[1], needle),
    render: (page, needle) => matchesTable(page, runId,
      needle ? `No match against an opponent matching "${needle}".`
             : "No matches recorded."),
  });
}

// A search box on a team page always searches for the other team, by slug or
// by the name the site shows, so "Smith" finds a pairing the table labels with
// a name the slug does not contain.
function opponentMatches(opponent, needle) {
  const slug = opponent || "";
  return slug.toLowerCase().includes(needle)
    || displayTeamName(slug).toLowerCase().includes(needle);
}

// One page of the match log, filtered to one opponent when the search box is
// used. A team in a full round robin has played several hundred fixtures, so
// the page is what is rendered and the pager is how the rest is reached.
function matchesTable(rows, runId, emptyMessage) {
  if (!rows.length) return `<p class="muted">${escapeHtml(emptyMessage || "No matches recorded.")}</p>`;
  const body = rows.map((match) => `
    <tr>
      <td class="small mono">${escapeHtml(displayTeamName(match.teams[1]))}</td>
      <td class="n">${match.score[0]} – ${match.score[1]}</td>
      <td class="n small muted">${match.seed}</td>
      <td class="small muted">${match.sides_swapped ? "away" : "home"}</td>
      <td class="small">${match.forfeit_by
        ? `<span class="bad">forfeit by ${escapeHtml(match.forfeit_by)}</span>`
        : match.voided ? '<span class="warn">void</span>' : ""}</td>
      <td class="n">${match.replay
        ? `<a href="#/watch/${encodeURIComponent(runId + "/" + match.replay)}">watch</a>`
        : ""}</td>
    </tr>`).join("");
  return `<div class="scroll"><table>
    <thead><tr><th>Opponent</th><th class="n">Score</th><th class="n">Seed</th>
      <th>Side</th><th></th><th></th></tr></thead>
    <tbody>${body}</tbody>
  </table></div>`;
}

// ---------------------------------------------------------------------------
// Paged tables
//
// Both tables on a team page grow with the field. A complete round robin over
// ten seeds is one pairing per opponent and ten fixtures inside each of them,
// so a team page was building a couple of hundred rows — every pairing's
// statistics panel among them — before it could show anything. A page of rows
// is rendered instead, and the rest is reached by the pager or, for a
// particular opponent, by the search box above it.
//
// A page is a pairing's worth of fixtures, so paging through a team's history
// steps one opponent at a time rather than cutting across two.
// ---------------------------------------------------------------------------

const PAGE_SIZE = 10;

// The search box and the count, above the table they act on. Both are omitted
// for an empty set: there is nothing to search and nothing to count.
function pagedControls(id, placeholder, total) {
  if (!total) return "";
  return `
    <div class="table-controls">
      <input id="${id}-search" type="search" placeholder="${escapeHtml(placeholder)}"
             aria-label="${escapeHtml(placeholder)}" autocomplete="off">
      <span class="small muted count" id="${id}-count"></span>
    </div>`;
}

// Previous, where the reader is, next. Deliberately not a numbered list of
// every page: thirty-odd pages of fixtures would be more buttons than the card
// has room for, and the search box is the way to reach a known opponent.
//
// Written once per table and then updated in place by ``bindPagedTable``, so
// paging does not replace the button under a keyboard user's focus.
const PAGER = `
  <div class="pager" hidden>
    <button type="button" class="ghost" data-step="-1">‹ Previous</button>
    <span class="small muted"></span>
    <button type="button" class="ghost" data-step="1">Next ›</button>
  </div>`;

// Wires one search box, one table host and one pager together, by the shared
// ``id`` their three element ids are built from. ``matches`` decides whether a
// row survives the search, ``render`` is handed just that page's rows, and
// ``afterRender`` rewires anything inside the markup it produced.
//
// Searching returns to the first page: what somebody searched for is on page
// one of the result, not on whichever page they happened to be reading.
function bindPagedTable({ id, rows, matches, render, unit, units, afterRender }) {
  const host = document.getElementById(`${id}-table`);
  if (!host) return;
  const search = document.getElementById(`${id}-search`);
  const count = document.getElementById(`${id}-count`);
  const pagerHost = document.getElementById(`${id}-pager`);
  let page = 1;

  if (pagerHost) {
    pagerHost.innerHTML = PAGER;
    for (const button of pagerHost.querySelectorAll("button[data-step]")) {
      button.onclick = () => { page += Number(button.dataset.step); draw(); };
    }
  }

  function draw() {
    const needle = ((search && search.value) || "").trim().toLowerCase();
    const shown = needle ? rows.filter((row) => matches(row, needle)) : rows;
    const pages = Math.max(1, Math.ceil(shown.length / PAGE_SIZE));
    page = Math.min(Math.max(page, 1), pages);
    const from = (page - 1) * PAGE_SIZE;
    host.innerHTML = render(shown.slice(from, from + PAGE_SIZE), needle);
    if (afterRender) afterRender();

    if (pagerHost) {
      const bar = pagerHost.firstElementChild;
      const [previous, next] = bar.querySelectorAll("button");
      bar.hidden = pages <= 1;
      bar.querySelector("span").textContent = `Page ${page} of ${pages}`;
      previous.disabled = page <= 1;
      next.disabled = page >= pages;
      // A disabled button cannot hold focus, so hand it to its opposite number
      // rather than dropping the reader back to the top of the document.
      if (previous.disabled && document.activeElement === previous) next.focus();
      if (next.disabled && document.activeElement === next) previous.focus();
    }
    if (count) {
      // What is on screen, out of what the search left, out of what the team
      // has. The first part drops away when one page holds the lot.
      const onScreen = shown.length > PAGE_SIZE
        ? `${from + 1}–${Math.min(from + PAGE_SIZE, shown.length)} of ` : "";
      count.textContent = shown.length === rows.length
        ? `${onScreen}${plural(rows.length, unit, units)}`
        : `${onScreen}${shown.length} of ${plural(rows.length, unit, units)}`;
    }
  }

  if (search) {
    search.oninput = () => { page = 1; draw(); };
  }
  draw();
}

// Each pairing's full-statistics panel is a second <tr>, hidden until its
// button - which sits in the pairing's own row - is clicked. A plain toggle
// rather than <details>/<summary> because a table row cannot be the child of
// a <details> element without a browser silently relocating it out of the
// table.
function bindTieStatsToggles() {
  view.querySelectorAll(".tie-stats-toggle").forEach((button) => {
    const target = document.getElementById(button.dataset.target);
    if (!target) return;
    button.onclick = () => {
      const opening = target.hasAttribute("hidden");
      target.toggleAttribute("hidden", !opening);
      button.setAttribute("aria-expanded", String(opening));
      button.textContent = opening ? "stats ▾" : "stats ▸";
    };
  });
}

// ---------------------------------------------------------------------------
// Watch
// ---------------------------------------------------------------------------

// What is typed into the two filter boxes, remembered outside the DOM.
// Clicking a match navigates to #/watch/<run>/<replay>, and the router answers
// a hash change by emptying the view and re-entering this function from
// scratch — so a filter held only in its <input> is gone the moment a game is
// opened, which is the one time you most want it back. Keyed by run: a term
// that names exactly one team in one run means nothing in another.
let watchFilters = { run: null, team: "", against: "" };

async function showWatch(parts) {
  const selected = parts.length ? decodeURIComponent(parts.join("/")) : "";
  const runFromSelection = selected.includes("/") ? selected.split("/")[0] : "";
  const runId = runFromSelection || currentRun;

  // The full entrant list, so a search box that names exactly one team can be
  // resolved to its slug and answered with that team's whole match list —
  // fetched from the server the same way the team page does — rather than
  // whatever of it happens to survive inside one capped page of the whole
  // tournament's fixtures. That capped page is still what an unresolved
  // (empty or ambiguous) search browses.
  const table = await api("api/table", { run: runId });
  const teams = table.standings.map((row) => ({ slug: row.slug, name: row.name }));

  // A different run is a different field, so nothing typed for the old one is
  // carried over. The same run — which is every navigation within the tab,
  // including opening a match — keeps both boxes as they were.
  //
  // Keyed on the run the server *resolved*, not on ``runId``. Empty means
  // "the current ladder" and a match's own URL names that run outright,
  // so opening a match from the default view moves ``runId`` from "" to
  // "ladder" without the run having changed at all — which would clear the
  // boxes on exactly the click this exists to survive.
  const resolvedRun = (table.run || {}).run_id || runId;
  if (watchFilters.run !== resolvedRun) {
    watchFilters = { run: resolvedRun, team: "", against: "" };
  }

  function resolve(term) {
    const needle = (term || "").trim().toLowerCase();
    if (!needle) return null;
    const hits = teams.filter((team) =>
      team.slug.toLowerCase().includes(needle)
      || watchTeamLabel(team.name).toLowerCase().includes(needle));
    return hits.length === 1 ? hits[0].slug : null;
  }

  view.innerHTML = `
    <h2 class="section">Watch</h2>
    <p class="lede">
      Recorded matches from the evaluation, drawn by the same viewer the platform uses
      locally. One fixture per pairing is recorded by default; pause, step and scrub as
      you like.
    </p>
    <div class="card">
      ${runPicker(site.runs, runId)}
      <label for="filter">Filter by team</label>
      <input id="filter" placeholder="type a team's name" autocomplete="off" style="max-width:520px"
             value="${escapeHtml(watchFilters.team)}">
      <label for="filter2">Head-to-head against</label>
      <input id="filter2" placeholder="a second team, to see only their meetings"
             autocomplete="off" style="max-width:520px"
             value="${escapeHtml(watchFilters.against)}">
    </div>
    <div class="watch-grid">
      <div>
        <div class="card">
          <h3><span id="count">…</span> recorded matches</h3>
          <div class="match-list" id="list"></div>
        </div>
      </div>
      <div id="stage"></div>
    </div>`;

  bindRunPicker(() => showWatch([]));

  const list = document.getElementById("list");
  const stage = document.getElementById("stage");
  const filter = document.getElementById("filter");
  const filter2 = document.getElementById("filter2");

  function open(name) {
    stage.innerHTML = `
      <iframe class="viewer" src="viewer.html?replay=${encodeURIComponent(name)}&speed=4"
              title="match viewer"></iframe>
      <p class="small muted" style="margin-top:8px">
        <span class="mono">${escapeHtml(name.split("/").pop())}</span> ·
        space pauses, arrow keys step a tick at a time, and clicking a player opens a
        panel that follows them.
      </p>`;
    for (const node of list.querySelectorAll(".match")) {
      node.classList.toggle("on", node.dataset.name === name);
    }
  }

  function matchesNeedle(match, needle) {
    return !needle || match.teams.some((team) => {
      const raw = team.toLowerCase();
      const pretty = watchTeamLabel(team).toLowerCase();
      return raw.includes(needle) || pretty.includes(needle);
    });
  }

  // A box that names exactly one team is matched by slug, against the whole
  // list fetched for that team — exact, and complete. A box that does not
  // (empty, or still ambiguous while typing) falls back to a loose substring
  // match against whatever page is currently loaded.
  function passes(match, term) {
    const resolved = resolve(term);
    if (resolved) return match.teams.includes(resolved);
    return matchesNeedle(match, (term || "").trim().toLowerCase());
  }

  let runSummary = null;
  let dataset = [];
  let loadedSlug = undefined;

  async function ensureLoaded(slug) {
    if (slug === loadedSlug) return;
    const data = await api("api/matches", {
      run: runId,
      slug: slug || "",
      // A team's own full history can run into the hundreds; the unscoped
      // browse page stays at the old, lighter cap.
      limit: slug ? "2000" : "400",
    });
    runSummary = data.run;
    dataset = data.watchable;
    loadedSlug = slug;
  }

  function render() {
    const shown = dataset.filter((match) =>
      passes(match, filter.value) && passes(match, filter2.value));
    document.getElementById("count").textContent = shown.length;
    list.innerHTML = shown.map((match) => {
      const name = `${runSummary.run_id}/${match.replay}`;
      return `
        <div class="match" data-name="${escapeHtml(name)}">
          <span class="score">${match.score[0]} – ${match.score[1]}</span>
          ${escapeHtml(watchTeamLabel(match.teams[0]))} <span class="muted">v</span> ${escapeHtml(watchTeamLabel(match.teams[1]))}
          <div class="small muted">seed ${match.seed}${match.round ? ` · round ${match.round}` : ""}</div>
        </div>`;
    }).join("") || '<p class="muted small">Nothing recorded matches that.</p>';
    for (const node of list.querySelectorAll(".match")) {
      node.onclick = () => go(`#/watch/${encodeURIComponent(node.dataset.name)}`);
    }
  }

  async function refresh() {
    await ensureLoaded(resolve(filter.value) || resolve(filter2.value) || null);
    render();
  }

  filter.oninput = () => { watchFilters.team = filter.value; refresh(); };
  filter2.oninput = () => { watchFilters.against = filter2.value; refresh(); };
  await refresh();

  if (selected) open(selected);
  else if (dataset.length) {
    stage.innerHTML = `<div class="card"><p class="muted">
      Pick a match on the left.</p></div>`;
  } else {
    stage.innerHTML = `<div class="card illustrated-empty">
      <img src="assets/empty-pitch.jpg" alt="" loading="lazy">
      <div class="empty-copy">
        <h3>Nothing on the replay desk</h3>
        <p class="muted">This run has no recorded matches. A run records them when
          asked to; <code>--replays first</code> keeps one per pairing.</p>
      </div>
    </div>`;
  }
}

// ---------------------------------------------------------------------------
// Cup
//
// The knockout: Division One, double elimination, one match a tie. Three
// things on one page, because they are the same competition at three
// distances.
//
// The **front page** is what a cup is between Sundays: who won the last one,
// how long until the next, and a way into any cup already played.
//
// The **bracket** is the record — a drawn tree rather than a list of rounds,
// because the question anybody actually asks of a bracket is "where did this
// team come from and where do they go", and that is a question about lines.
// See `cupLayout`.
//
// The **broadcast** is the bracket played back as television, in the same
// full-screen shell the Spotlight tab uses. It steps through the matches in
// the order they were played: marks the next one, plays its replay at real
// speed, and — only when the replay actually reaches full time — reveals the
// score, fills the result into the bracket, and moves the winner on and the
// loser down or out with their cup record beside them.
//
// That gate is the point of the whole tab. Every result is already on disk
// before the broadcast starts, so it would be far easier to draw the finished
// bracket and let the replays play under it. But then the bracket is a
// spoiler: the box two columns along already names the winner of the match
// being watched. So the page holds a *reveal position* and draws the bracket
// as it stood at that point, and nothing past it exists yet.
// ---------------------------------------------------------------------------

// How long the on-deck slate holds before the replay loads: long enough to
// read the two names, their seeds and who won the toss.
const CUP_DECK_MS = 6000;
// How long a result stands before the next match is picked, and the longer
// hold when that result knocked somebody out and their record is on screen.
const CUP_RESULT_MS = 5000;
const CUP_ELIMINATION_MS = 8000;
// A goal burst, matched to the Spotlight tab's so the two read as one channel.
const CUP_GOAL_MS = 2400;
// How long the bracket is held up after a round finishes, on top of the two
// movement beats: long enough to watch the new round arrive and find the next
// fixture on it.
const CUP_ROUND_MS = 4200;
// One movement beat — the winner going through, then the loser dropping. Long
// enough for the spark to run the length of a wire and be followed.
const CUP_MOVE_MS = 2400;
// And a beat on the settled bracket before cutting to the next match.
const CUP_SETTLE_MS = 1600;
// The same backstop the spotlight has, for a replay that fails to load or
// stalls: a cup match is a whole 2,400 ticks at 1x, so this only ever fires
// when nothing is coming.
const CUP_MAX_SECONDS = 220;

let cupCast = null;

function stopCup() {
  document.body.classList.remove("spotlight-on");
  if (!cupCast) return;
  cancelTimer(cupCast.timer);
  cancelTimer(cupCast.holdTimer);
  cancelTimer(cupCast.goalTimer);
  clearInterval(cupCast.clock);
  clearInterval(cupCast.sync);
  clearInterval(cupCast.poll);
  // Leaving the page is how a viewer stops being counted: nothing is sent to
  // say so, the asking simply stops. See `cupRoom`.
  if (cupCast.room) cupCast.room.stop();
  window.removeEventListener("message", cupCast.onMessage);
  window.removeEventListener("keydown", cupCast.onKey);
  cupCast = null;
}

// ---------------------------------------------------------------------------
// The broadcast clock
// ---------------------------------------------------------------------------
//
// A live cup is not played at the pace of whoever is watching it. Every result
// is on disk within seconds of kickoff and the playout takes an hour and a
// half, so where the broadcast has got to is a question about the time of day —
// and the server answers it the same way for the wall screen in the room and
// for somebody watching from home. See `Arena.broadcast`.
//
// Two things are needed to read that timeline. One is the server's clock:
// browsers are wrong by seconds and occasionally by minutes, and a broadcast
// synchronised against a wrong clock is a broadcast out of step by exactly
// that much. The other is which segment of the rundown the current moment
// falls in, which is the whole of the state a live cast keeps — there is no
// position to lose, so a reload, a throttled background tab or a closed laptop
// costs nothing but the frames that were missed.

// How far this browser's clock is behind the server's, in milliseconds.
let cupSkewMs = 0;
let cupSkewKnown = false;

/**
 * Re-estimates the clock offset from a response that carried `server_now_ms`.
 *
 * `sentAt` is when the request went out, so half the round trip can be added
 * back: the stamp describes the server midway through a journey we know the
 * length of. Half of a symmetric trip is exactly right and half of a lopsided
 * one is wrong by the difference, which on a course network is a few
 * milliseconds and never the seconds that matter here.
 */
function cupNoteServerClock(data, sentAt) {
  if (!data || typeof data.server_now_ms !== "number") return;
  const now = Date.now();
  const offset = data.server_now_ms + Math.max(now - sentAt, 0) / 2 - now;
  // A first reading is taken as it comes; later ones are eased in, so one slow
  // response cannot jerk the broadcast sideways.
  cupSkewMs = cupSkewKnown ? cupSkewMs + (offset - cupSkewMs) * 0.4 : offset;
  cupSkewKnown = true;
}

/** Now, on the server's clock. */
function cupNow() {
  return Date.now() + cupSkewMs;
}

/**
 * Where a rundown has got to at `nowMs`, or null if it has no anchor.
 *
 * `revealed` is the reveal position that beat is entitled to: a match's result
 * is on the bracket from its own result slate onwards and not one beat before,
 * which is the same gate the scripted path holds and the reason the box two
 * columns along is not a spoiler.
 *
 * Past the end of the rundown there are two different answers. A cup that has
 * been won is over — that is the sign-off. A cup that has not is one whose
 * later rounds are not on disk yet, and the honest thing to show is that we
 * are waiting for a result rather than that the competition has finished.
 */
function cupBroadcastAt(broadcast, nowMs) {
  if (!broadcast || typeof broadcast.anchor_ms !== "number") return null;
  const segments = broadcast.segments || [];
  const elapsed = nowMs - broadcast.anchor_ms;
  if (elapsed < 0) {
    return { elapsed, phase: "pending", segment: null, offsetMs: 0, revealed: 0 };
  }
  for (let index = segments.length - 1; index >= 0; index -= 1) {
    const segment = segments[index];
    if (segment.ms <= 0 || elapsed < segment.at_ms) continue;
    if (elapsed >= segment.at_ms + segment.ms) break;
    const done = segment.kind !== "deck" && segment.kind !== "match";
    return {
      elapsed,
      phase: "on-air",
      segment,
      index,
      offsetMs: elapsed - segment.at_ms,
      revealed: segment.kind === "champion"
        ? broadcast.matches
        : segment.match_index + (done ? 1 : 0),
    };
  }
  const complete = segments.length
    && segments[segments.length - 1].kind === "champion";
  return {
    elapsed,
    phase: elapsed >= broadcast.total_ms && !complete ? "waiting" : "done",
    segment: null,
    offsetMs: 0,
    revealed: broadcast.matches,
  };
}

/**
 * When each match of a live cup comes on, as a wall-clock time.
 *
 * Keyed to the *deck* beat rather than to the kickoff six seconds after it,
 * because that is the moment the broadcast turns to the match — and it means a
 * box's countdown reaching zero is the same instant the box starts pulsing as
 * the one on deck, rather than six seconds before it.
 *
 * `null` when there is no timeline to read, which is every cup that is not on
 * air: a cup being reviewed is played at whatever pace the viewer watches it
 * at, so "in twelve minutes" would be a promise nothing is keeping.
 */
function cupKickoffs(broadcast) {
  if (!broadcast || !broadcast.live || typeof broadcast.anchor_ms !== "number") {
    return null;
  }
  const at = new Map();
  for (const segment of broadcast.segments || []) {
    if (segment.kind === "deck") {
      at.set(segment.match_id, broadcast.anchor_ms + segment.at_ms);
    }
  }
  return at;
}

/** How long until a match on the bracket, said the way a bracket has room for. */
function cupUntil(atMs, nowMs) {
  return atMs - nowMs <= 0 ? "kicking off" : `in ${cupCountdown(atMs, nowMs)}`;
}

//: How long a match takes to watch, in milliseconds. Must agree with
//: `cup.match_broadcast_ms` and `cup.BROADCAST_DEFAULT_TICKS`: a cup being
//: reviewed is paced by this page rather than by a rundown, and a page that
//: guessed a different length would count down to a kickoff of its own.
const CUP_DEFAULT_TICKS = 2400;

function cupMatchMs(ticks, beats) {
  const hz = Number((beats || {}).tick_hz) || 20;
  const speed = Number((beats || {}).speed) || 1;
  const count = Number(ticks) || CUP_DEFAULT_TICKS;
  return Math.max(count, 0) * 1000 / (hz * speed);
}

/**
 * One match's whole cycle of the scripted driver, deck beat to deck beat.
 *
 * The same shape `cup.rundown` gives a broadcast, computed here from the
 * constants this page's own timers use — because for a cup being reviewed
 * those timers are the schedule, and there is no rundown to read. The two are
 * checked against each other by
 * `tests/test_broadcast_page.py::test_a_reviewed_cup_projects_the_same_pace_the_rundown_times`.
 *
 * Round boundaries come off each match's own `round_index` rather than off a
 * lookup, so this is a pure function of the flat list of matches and can be
 * lifted out and run on its own.
 */
function cupCycleMs(matches, index, beats) {
  const match = matches[index];
  const nextUp = matches[index + 1];
  const roundDone = !!nextUp && nextUp.round_index !== match.round_index;
  // A walkover has no replay to watch. The beats around it still run, so it is
  // announced and applied to the bracket at the pace a result would be.
  const watching = match.replay ? cupMatchMs(match.ticks, beats) : 0;
  // A loss anywhere but the upper bracket ends a cup, and that result is held
  // longer because the beaten team's whole record goes on screen with it. The
  // same rule `finish` applies, and the one `cup.rundown` times.
  const held = match.bracket === "upper" ? CUP_RESULT_MS : CUP_ELIMINATION_MS;
  return CUP_DECK_MS + watching + held + CUP_MOVE_MS * 2
    + (roundDone ? CUP_ROUND_MS : CUP_SETTLE_MS);
}

/**
 * A wait that is a projection rather than a promise, said as one.
 *
 * A reviewed cup is played by local timers that a hidden tab pauses, so the
 * arithmetic behind these is exact and the answer is still only an estimate:
 * anybody who switches tabs for a minute has moved it by a minute. Rounded to
 * the minute for that reason — a seconds counter claims a precision this does
 * not have, and it would also rewrite a digit every second in a panel nobody
 * has open. Under a minute it stops guessing and says what is true instead.
 */
function cupRoughly(atMs, nowMs) {
  const left = Math.max(0, atMs - nowMs);
  if (left < 45000) return "up next";
  const minutes = Math.round(left / 60000);
  if (minutes < 60) return `about ${plural(minutes, "min", "min")}`;
  const hours = Math.floor(minutes / 60);
  return `about ${hours}h ${String(minutes % 60).padStart(2, "0")}m`;
}

/**
 * Re-reads every countdown under `root` against the clock.
 *
 * In place, and deliberately not by redrawing the bracket: a redraw every
 * second would restart the arrival and movement animations and throw away the
 * hover trace somebody is holding a name to read. So the countdown boxes carry
 * the time they are counting to, and this only rewrites their text.
 *
 * `data-cup-about` marks the ones that are a reviewed cup's own projection
 * rather than a broadcast's rundown, and so are said more coarsely. Which of
 * the two a box carries is decided where it is drawn; this only has to keep
 * saying it the same way.
 */
function cupRetime(root) {
  if (!root) return;
  const now = cupNow();
  for (const node of root.querySelectorAll("[data-cup-at]")) {
    const at = Number(node.dataset.cupAt);
    node.textContent = node.hasAttribute("data-cup-about")
      ? cupRoughly(at, now) : cupUntil(at, now);
  }
}

/** Which tick of a match the broadcast is on, `offsetMs` into it. */
function cupBroadcastTick(broadcast, offsetMs) {
  const beats = (broadcast && broadcast.beats) || {};
  const hz = Number(beats.tick_hz) || 20;
  const speed = Number(beats.speed) || 1;
  return Math.max(offsetMs, 0) / 1000 * hz * speed;
}

// ---------------------------------------------------------------------------
// Reading a bracket
// ---------------------------------------------------------------------------

function cupMatches(bracket) {
  return (bracket.rounds || []).flatMap((round) => round.matches || []);
}

function cupTeamLabel(entry) {
  return watchTeamLabel(entry.name || entry.slug);
}

function cupEntry(bracket, slug) {
  return (bracket.entries || []).find((entry) => entry.slug === slug)
    || { slug, seed: "?", name: slug };
}

// The bracket as it stood after `revealed` matches — which teams were still
// unbeaten, who had one loss, and who had gone.
//
// Recomputed from the matches rather than read off the file's own `upper` and
// `lower` lists, because those describe the cup *now* and the broadcast needs
// them as they were at an earlier point. The two agree at the end, which is
// what makes this safe to use for a finished cup as well.
function cupStateAfter(bracket, revealed) {
  const matches = cupMatches(bracket);
  const upper = new Set((bracket.entries || []).map((entry) => entry.slug));
  const lower = new Set();
  const out = new Set();
  let champion = null;
  for (const match of matches.slice(0, revealed)) {
    if (!match.winner) continue;
    if (match.bracket === "final") {
      // Both finalists leave the two pools: one has won it and the other is
      // out. Left in, they would be counted twice and the header would report
      // twenty-two teams in a field of twenty.
      champion = match.winner;
      upper.delete(match.winner);
      upper.delete(match.loser);
      lower.delete(match.winner);
      lower.delete(match.loser);
      out.add(match.loser);
      continue;
    }
    if (match.bracket === "upper") {
      upper.delete(match.loser);
      lower.add(match.loser);
    } else {
      lower.delete(match.loser);
      out.add(match.loser);
    }
  }
  return { upper, lower, out, champion };
}

// One team's record in the cup, from the matches revealed so far. Computed
// here rather than read from standings.json because that file is written when
// the cup finishes and this has to be right in the middle of it — which is
// exactly when it is shown, on the slate for a team that has just gone out.
function cupRecord(bracket, slug, revealed) {
  const record = { played: 0, won: 0, lost: 0, for: 0, against: 0, out_in: "" };
  for (const match of cupMatches(bracket).slice(0, revealed)) {
    if (!match.winner) continue;
    const side = match.teams.findIndex((team) => team.slug === slug);
    if (side < 0) continue;
    record.played += 1;
    if (match.score) {
      record.for += match.score[side];
      record.against += match.score[1 - side];
    }
    if (match.winner === slug) {
      record.won += 1;
    } else {
      record.lost += 1;
      // Only a loss that ends the team's cup names the round they went out in.
      // An upper-bracket loss drops them to the lower bracket and they carry
