<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soccer Agent Challenge</title>
<!-- An inline icon, so the browser does not ask for /favicon.ico and log a 404
     on every visit. A ball, drawn small enough to read in a tab. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23e6eaf0'/%3E%3Cpath d='M16 6l5 3.6-1.9 5.9h-6.2L11 9.6zM8 14l3 1.5 1.4 4.4-2.6 2.4-3.3-3zm16 0l1.5 5.3-3.3 3-2.6-2.4L21 15.5zM12.6 22.4h6.8l1.2 3.8a12 12 0 01-9.2 0z' fill='%231c5c2e'/%3E%3C/svg%3E">
<style>
  :root {
    --pitch: #1c5c2e;
    --team-a: #3884ff;
    --team-b: #f05448;
    --bg: #12151a;
    --panel: #1a1f27;
    --panel-2: #222833;
    --edge: #2e3644;
    --text: #e6eaf0;
    --muted: #8d97a8;
    --good: #7ce0a0;
    --bad: #ff8a7a;
    --warn: #ffd640;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  a { color: var(--team-a); text-decoration: none; }
  a:hover { text-decoration: underline; }
  code, pre, .mono { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; }
  code { background: var(--panel-2); padding: 1px 5px; border-radius: 4px; font-size: 13px; }
  pre {
    background: #0e1116; border: 1px solid var(--edge); border-radius: 8px;
    padding: 13px 15px; overflow-x: auto; font-size: 13px; line-height: 1.5;
  }
  pre code { background: none; padding: 0; font-size: inherit; }
  hr { border: none; border-top: 1px solid var(--edge); margin: 26px 0; }

  /* ---------------------------------------------------------------- shell */
  header.top {
    border-bottom: 1px solid var(--edge); background: linear-gradient(180deg, #171c24, #12151a);
  }
  .bar { width: 100%; max-width: 1440px; margin: 0 auto; padding: 16px 20px 0; }
  .brand { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .brand h1 { font-size: 19px; margin: 0; letter-spacing: -0.01em; }
  .brand .ball { color: var(--good); }
  .facts { margin-left: auto; display: flex; gap: 14px; font-size: 12px; color: var(--muted); }
  nav { display: flex; gap: 2px; margin-top: 14px; flex-wrap: wrap; }
  nav button {
    background: none; border: none; border-bottom: 2px solid transparent;
    color: var(--muted); font: inherit; font-size: 14px; padding: 9px 14px;
    cursor: pointer; border-radius: 6px 6px 0 0;
  }
  nav button:hover { color: var(--text); background: #1b212a; }
  nav button.on { color: var(--text); border-bottom-color: var(--team-a); }
  /* On air. The same red and the same pulsing dot the broadcast's own bar
     uses, because it is saying the same thing in a smaller space — and it has
     to say it from the nav of whatever page somebody happens to be on, which
     is the only place the news reaches a reader who is not already looking at
     the cup. See `.spotlight-bar .tag.on-air`. */
  nav button.live {
    color: #ff8a84; background: rgba(255, 95, 87, .10);
    box-shadow: 0 0 0 1px rgba(255, 95, 87, .35), 0 0 14px rgba(255, 95, 87, .25);
    animation: nav-live 2.4s ease-in-out infinite;
  }
  nav button.live:hover { color: #fff; background: rgba(255, 95, 87, .18); }
  nav button.live.on { border-bottom-color: #ff5f57; color: #fff; }
  nav button.live::before {
    content: ""; display: inline-block; width: 7px; height: 7px;
    border-radius: 50%; background: #ff5f57; margin-right: 7px;
    vertical-align: 1px; animation: on-air-pulse 2s ease-in-out infinite;
  }
  @keyframes nav-live {
    0%, 100% { box-shadow: 0 0 0 1px rgba(255, 95, 87, .35), 0 0 10px rgba(255, 95, 87, .18); }
    50% { box-shadow: 0 0 0 1px rgba(255, 95, 87, .55), 0 0 20px rgba(255, 95, 87, .38); }
  }
  /* The dot alone carries it where motion is off: a glow that does not pulse
     is still a glow, and the thing being said is "now", not "look at me". */
  @media (prefers-reduced-motion: reduce) {
    nav button.live, nav button.live::before { animation: none; }
  }
  @media (max-width: 600px) {
    .brand { gap: 6px 12px; }
    .facts { width: 100%; margin-left: 0; flex-wrap: wrap; }
  }

  main { width: 100%; max-width: 1440px; margin: 0 auto; padding: 26px 20px 70px; }
  h2.section { font-size: 17px; margin: 0 0 4px; }
  p.lede { color: var(--muted); margin: 0 0 22px; max-width: 70ch; }

  /* --------------------------------------------------------------- artwork */
  .hero {
    position: relative; isolation: isolate; overflow: hidden;
    min-height: 390px; margin: -6px 0 20px; border: 1px solid var(--edge);
    border-radius: 14px; display: flex; align-items: center;
    background: #0d1116 url("assets/league-hero.jpg") center/cover no-repeat;
    box-shadow: 0 22px 60px rgba(0, 0, 0, 0.24);
  }
  .hero::before {
    content: ""; position: absolute; inset: 0; z-index: 0;
    background: linear-gradient(90deg, rgba(10, 13, 18, .99) 0%,
      rgba(10, 13, 18, .92) 31%, rgba(10, 13, 18, .30) 66%, rgba(10, 13, 18, .05) 100%);
  }
  .hero-copy { position: relative; z-index: 1; width: min(590px, 62%); padding: 42px; }
  .eyebrow {
    color: var(--good); font-size: 11px; font-weight: 700;
    letter-spacing: .13em; text-transform: uppercase; margin-bottom: 10px;
  }
  .hero h2 {
    font-size: clamp(28px, 4vw, 46px); line-height: 1.08;
    letter-spacing: -.035em; margin: 0 0 15px; max-width: 13ch;
  }
  .hero p { color: #bbc4d1; max-width: 56ch; margin: 0 0 22px; }
  .hero-actions { display: flex; gap: 9px; flex-wrap: wrap; }
  .hero-actions a { text-decoration: none; }
  .hero-actions .action-link {
    background: var(--team-a); color: #06101f; border-radius: 7px;
    font-weight: 650; padding: 9px 16px;
  }
  .hero-actions .ghost-link {
    color: var(--text); background: rgba(34, 40, 51, .86);
    border: 1px solid var(--edge); border-radius: 7px; padding: 8px 15px;
  }
  .card.illustrated-empty {
    display: grid; grid-template-columns: minmax(190px, .42fr) minmax(0, .58fr);
    gap: 20px; align-items: center; padding: 0; overflow: hidden;
  }
  .illustrated-empty img {
    display: block; width: 100%; height: 190px; object-fit: cover; background: #0d1116;
  }
  .illustrated-empty .empty-copy { padding: 20px 22px 20px 0; }
  .illustrated-empty .empty-copy p { margin: 0; }
  /* The distribution is the download; everything else on that tab is a file to
     put inside it, so it is given a card of its own above the table. */
  .card.download-hero { border-color: #2b4d3a; background: linear-gradient(
    180deg, rgba(38, 78, 56, .32) 0%, var(--card) 78%); }
  .download-hero h3 { margin-top: 0; }
  .download-hero .get {
    display: inline-block; text-decoration: none; margin-top: 4px;
    background: var(--team-a); color: #06101f; border-radius: 7px;
    font-weight: 650; padding: 10px 18px;
  }
  .download-hero .build { margin-top: 10px; }
  @media (max-width: 760px) {
    .hero { min-height: 440px; align-items: flex-end; background-position: 62% center; }
    .hero::before {
      background: linear-gradient(0deg, rgba(10,13,18,.99) 0%,
        rgba(10,13,18,.93) 52%, rgba(10,13,18,.15) 100%);
    }
    .hero-copy { width: 100%; padding: 28px 24px; }
    .hero h2 { font-size: 31px; }
    .card.illustrated-empty { grid-template-columns: 1fr; }
    .illustrated-empty img { height: 220px; }
    .illustrated-empty .empty-copy { padding: 0 20px 20px; }
  }

  .card {
    background: var(--panel); border: 1px solid var(--edge); border-radius: 10px;
    min-width: 0; padding: 18px 20px; margin-bottom: 16px;
  }
  .card h3 {
    font-size: 12px; text-transform: uppercase; letter-spacing: 0.09em;
    color: var(--muted); margin: 0 0 12px; font-weight: 600;
  }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .cols-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  @media (max-width: 860px) {
    .cols, .cols-3 { grid-template-columns: minmax(0, 1fr); }
  }

  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  .good { color: var(--good); }
  .bad { color: var(--bad); }
  .warn { color: var(--warn); }
  .pill {
    display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11.5px;
    border: 1px solid var(--edge); color: var(--muted); background: var(--panel-2);
  }
  .pill.live { color: var(--warn); border-color: #5a4a12; }
  .pill.done { color: var(--good); border-color: #24503a; }

  /* The evaluation queue, above the standings table. */
  .queue { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 14px; }
  .queue-now { display: flex; align-items: baseline; gap: 8px; }
  .queue-dot {
    width: 7px; height: 7px; border-radius: 50%; background: var(--warn);
    display: inline-block; flex: none; animation: queue-pulse 1.6s ease-in-out infinite;
  }
  @keyframes queue-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
  @media (prefers-reduced-motion: reduce) {
    .queue-dot { animation: none; }
  }
  .queue-waiting { display: flex; flex-wrap: wrap; gap: 6px; }
  /* The pause notice. Deliberately the loudest thing on the standings page:
     a student whose hand-in is sitting still needs to know why before they
     conclude the site has broken and hand in again. */
  .queue-paused {
    display: flex; align-items: baseline; gap: 10px;
    padding: 10px 12px; margin: 0 0 10px;
    border: 1px solid var(--warn-border, #c98a1b);
    background: var(--warn-bg, rgba(201, 138, 27, 0.12));
    border-radius: 8px;
  }
  .queue-paused strong { flex: none; }
  .queue-waiting .pill { color: var(--text); }
  .queue-waiting .pill span { color: var(--muted); }

  .badges {
    display: inline-flex; align-items: center; gap: 4px; flex-wrap: wrap;
    vertical-align: middle;
  }
  .badge { display: inline-flex; border-radius: 50%; cursor: default; }
  .badge:focus-visible { outline: 2px solid var(--team-a); outline-offset: 2px; }
  .badge-icon {
    display: block; width: 20px; height: 20px; border-radius: 50%;
    vertical-align: middle; background: var(--panel-2);
  }
  /* A gold badge earns a little shine of its own, wherever it is drawn. */
  .badge.tier-gold .badge-icon { filter: drop-shadow(0 0 4px rgba(255, 214, 64, .7)); }
  .badges .badge-more {
    display: inline-block; font-size: 11px; color: var(--muted);
    background: var(--panel-2); border: 1px solid var(--edge); border-radius: 999px;
    padding: 1px 6px; line-height: 18px;
  }
  h2.section .badges { margin-left: 10px; }
  h2.section .badges .badge-icon { width: 60px; height: 60px; }

  /* One shared tooltip, positioned by JS and filled in on hover/focus — see
     showBadgeTooltip(). Living outside #view means a route re-render never
     tears it down mid-hover. */
  .badge-tooltip {
    position: fixed; z-index: 200; width: 230px; padding: 12px 14px;
    text-align: center; background: var(--panel); border: 1px solid var(--edge);
    border-radius: 10px; box-shadow: 0 10px 30px rgba(0, 0, 0, .5);
    pointer-events: none;
  }
  .badge-tooltip img {
    display: block; width: 72px; height: 72px; border-radius: 50%;
    background: var(--panel-2); margin: 0 auto 8px;
  }
  .badge-tooltip.tier-gold img { filter: drop-shadow(0 0 6px rgba(255, 214, 64, .75)); }
  .badge-tooltip strong { display: block; font-size: 13.5px; margin-bottom: 4px; }
  .badge-tooltip p { margin: 0; font-size: 12px; color: var(--muted); line-height: 1.45; }
  .badge-tooltip p.condition { margin-top: 6px; color: var(--text); font-style: italic; }

  button.action {
    background: var(--team-a); color: #06101f; border: none; border-radius: 7px;
    font: inherit; font-weight: 600; padding: 9px 16px; cursor: pointer;
  }
  button.action:hover { filter: brightness(1.08); }
  button.ghost {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--edge);
    border-radius: 7px; font: inherit; padding: 8px 14px; cursor: pointer;
  }
  button.ghost:hover { border-color: var(--muted); }
  select, input, textarea {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--edge);
    border-radius: 6px; font: inherit; padding: 8px 10px; width: 100%;
  }
  textarea { min-height: 150px; resize: vertical; }
  label { display: block; font-size: 12.5px; color: var(--muted); margin: 14px 0 5px; }

  /* --------------------------------------------------------------- tables */
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--edge); }
  th {
    font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.07em;
    color: var(--muted); font-weight: 600; white-space: nowrap;
  }
  td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
  tbody tr:hover { background: #1d2430; }
  tr.clickable { cursor: pointer; }
  .scroll { overflow-x: auto; }
  /* Under a paged table: previous, which page of how many, next. Centred so
     the reader's eye lands on the page number rather than on either button. */
  .pager {
    display: flex; gap: 12px; align-items: center; justify-content: center;
    margin: 14px 0 0;
  }
  /* .pager sets display, so the attribute needs saying again to win. */
  .pager[hidden] { display: none; }
  .pager button { padding: 6px 12px; }
  .pager button:disabled { opacity: .45; cursor: default; }
  .pager button:disabled:hover { border-color: var(--edge); }
  .pager span { white-space: nowrap; font-variant-numeric: tabular-nums; }
  .rank { color: var(--muted); font-variant-numeric: tabular-nums; }
  .base { color: var(--muted); font-style: italic; }
  /* The cut between two divisions. Heavier than a row border and lighter than
     a heading: the table is still one table. */
  tr.division-start > td { border-top: 2px solid var(--muted); }
  tr.division-start:first-child > td { border-top: none; }

  /* Search and division filter, above the table they act on. */
  .table-controls {
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    margin: 0 0 15px;
  }
  .table-controls input[type="search"] { width: 240px; }
  .table-controls select { width: auto; min-width: 150px; }
  .table-controls .count { margin-left: auto; white-space: nowrap; }

  /* --------------------------------------------------------- statistics */
  .card.stats-showcase {
    padding: 0; overflow: hidden;
    background:
      radial-gradient(circle at 50% 18%, rgba(28, 92, 46, .20), transparent 42%),
      linear-gradient(180deg, #181e26, #12161c);
  }
  .stats-heading {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 18px; padding: 20px 22px 0;
  }
  .stats-heading h3 { color: var(--text); font-size: 15px; margin: 0 0 4px; }
  .stats-heading p { margin: 0; color: var(--muted); }
  .stats-count { white-space: nowrap; padding-top: 2px; }
  .stats-carousel { outline: none; }
  .stats-stage { min-height: 486px; }
  .stat-slide { padding: 22px 26px 0; animation: stat-enter .32s ease-out; }
  @keyframes stat-enter {
    from { opacity: 0; transform: translateX(10px); }
    to { opacity: 1; transform: translateX(0); }
  }
  .stat-title { text-align: center; margin-bottom: 18px; }
  .stat-title .eyebrow { margin-bottom: 6px; }
  .stat-title h4 { font-size: 25px; letter-spacing: -.02em; margin: 0 0 5px; }
  .stat-title p { color: var(--muted); margin: 0 auto; max-width: 64ch; }
  .podium {
    display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
    align-items: end; gap: 12px; max-width: 890px; margin: 0 auto;
  }
  .podium-entry { min-width: 0; text-align: center; }
  .podium-person {
    position: relative; padding: 12px 10px 14px; border: 1px solid var(--edge);
    border-radius: 12px 12px 5px 5px; background: rgba(26, 31, 39, .92);
  }
  .podium-entry.place-1 .podium-person {
    padding-top: 15px; border-color: #6b5720;
    box-shadow: 0 0 28px rgba(245, 200, 76, .09);
  }
  .podium-avatar {
    display: block; width: 82px; height: 82px; object-fit: cover;
    border-radius: 50%; margin: 0 auto 10px; border: 3px solid var(--edge);
    background: #0d1116;
  }
  .place-1 .podium-avatar { width: 98px; height: 98px; border-color: #f5c84c; }
  .place-2 .podium-avatar { border-color: #c8d0da; }
  .place-3 .podium-avatar { border-color: #c98245; }
  .podium-medal {
    position: absolute; top: 9px; right: calc(50% - 51px);
    display: grid; place-items: center; width: 27px; height: 27px;
    border-radius: 50%; color: #11151a; font-size: 12px; font-weight: 800;
    border: 2px solid rgba(255,255,255,.38); box-shadow: 0 3px 10px rgba(0,0,0,.35);
  }
  .place-1 .podium-medal { right: calc(50% - 59px); background: #f5c84c; }
  .place-2 .podium-medal { background: #c8d0da; }
  .place-3 .podium-medal { background: #c98245; }
  .podium-team {
    display: block; color: var(--text); font-weight: 700; font-size: 15px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .podium-members {
    min-height: 38px; color: var(--muted); font-size: 12px; line-height: 1.35;
    margin: 4px 0 9px; overflow-wrap: anywhere;
  }
  .podium-value {
    color: var(--good); font: 700 18px/1.2 ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  .podium-step {
    display: grid; place-items: center; min-height: 66px;
    border: 1px solid var(--edge); border-top: none; border-radius: 0 0 8px 8px;
    color: rgba(255,255,255,.72); font-size: 30px; font-weight: 800;
    background: linear-gradient(180deg, #252d38, #1a1f27);
  }
  .place-1 .podium-step {
    min-height: 112px; color: #f5c84c;
    background: linear-gradient(180deg, #4a4023, #211f1a);
  }
  .place-2 .podium-step { min-height: 82px; color: #c8d0da; }
  .place-3 .podium-step {
    min-height: 62px; color: #d79a65;
    background: linear-gradient(180deg, #3b2b22, #201b19);
  }
  .stats-controls {
    display: flex; align-items: center; justify-content: center; gap: 13px;
    min-height: 60px; padding: 10px 18px 14px; border-top: 1px solid var(--edge);
    background: rgba(10, 13, 18, .46);
  }
  .carousel-arrow {
    width: 34px; height: 34px; padding: 0; border-radius: 50%;
    background: var(--panel-2); color: var(--text); border: 1px solid var(--edge);
    cursor: pointer; font-size: 19px; line-height: 1;
  }
  .carousel-arrow:hover { border-color: var(--team-a); }
  .stats-dots { display: flex; align-items: center; gap: 7px; }
  .stats-dot {
    width: 8px; height: 8px; padding: 0; border: none; border-radius: 50%;
    background: #475162; cursor: pointer;
  }
  .stats-dot.on { width: 22px; border-radius: 999px; background: var(--team-a); }
  .stats-position { min-width: 42px; color: var(--muted); font-size: 12px; text-align: center; }
  @media (max-width: 700px) {
    .stats-heading { display: block; }
    .stats-count { display: inline-block; margin-top: 8px; }
    .stats-stage { min-height: 0; }
    .stat-slide { padding: 20px 16px 0; }
    .stat-title h4 { font-size: 21px; }
    .podium { grid-template-columns: minmax(0, 1fr); align-items: stretch; }
    .podium-entry.place-1 { order: 1; }
    .podium-entry.place-2 { order: 2; }
    .podium-entry.place-3 { order: 3; }
    .podium-person {
      display: grid; grid-template-columns: 72px minmax(0, 1fr) auto;
      grid-template-rows: auto auto; align-items: center; gap: 3px 12px;
      text-align: left; border-radius: 10px 10px 0 0; padding: 11px 14px;
    }
    .place-1 .podium-person { padding-top: 11px; }
    .podium-avatar, .place-1 .podium-avatar {
      grid-row: 1 / 3; width: 62px; height: 62px; margin: 0;
    }
    .podium-medal, .place-1 .podium-medal { top: 6px; left: 58px; right: auto; }
    .podium-team { align-self: end; }
    .podium-members { min-height: 0; margin: 1px 0 0; }
    .podium-value { grid-column: 3; grid-row: 1 / 3; white-space: nowrap; }
    .podium-step, .place-1 .podium-step, .place-2 .podium-step, .place-3 .podium-step {
      min-height: 34px; font-size: 16px;
    }
    .stats-controls { gap: 10px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .stat-slide { animation: none; }
  }

  /* One team's full averages: a tile per metric, each carrying the number, the
     placing it earned, and where it sits between the worst and best in the
     league so a figure alone is never left without a scale. */
  .stat-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(212px, 1fr)); gap: 12px;
  }
  .stat-tile {
    border: 1px solid var(--edge); border-radius: 9px; padding: 12px 13px 11px;
    background: var(--panel-2); min-width: 0;
  }
  .stat-tile-head {
    display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
  }
  .stat-tile-label {
    font-size: 12.5px; color: var(--muted); overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap;
  }
  .stat-tile .pill { flex: none; font-size: 11px; }
  .stat-tile .pill.leader { color: var(--warn); border-color: #5a4a12; }
  .stat-tile-value {
    font: 700 23px/1.25 ui-monospace, "Cascadia Mono", Consolas, monospace;
    letter-spacing: -.02em; margin-top: 3px;
  }
  .stat-tile-unit { font-size: 11.5px; color: var(--muted); }
  .stat-meter {
    position: relative; height: 5px; border-radius: 999px;
    background: #313a48; margin: 10px 0 7px; overflow: hidden;
  }
  .stat-meter-fill {
    position: absolute; inset: 0 auto 0 0; border-radius: 999px; background: var(--team-a);
  }
  .stat-meter-fill.leader { background: var(--good); }
  .stat-meter-mean { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--text); }
  .stat-tile-foot {
    display: flex; justify-content: space-between; gap: 8px;
    font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums;
  }

  /* One pairing's own statistics, tucked under its row in the ties table: a
     mean and a 95% confidence interval for each, over that pairing's own
     fixtures alone rather than the whole season. Collapsed by default since
     thirteen figures a row would drown the table it sits in. The toggle sits
     in the pairing's own row; the row it opens is a second <tr>, since a
     table cell cannot hold a grid this wide without breaking the columns
     above it. */
  tr.tie-row.has-stats > td { border-bottom: none; }
  tr.tie-stats-row > td { border-top: none; padding-top: 0; padding-bottom: 12px; }
  .tie-stats-toggle {
    background: none; border: none; padding: 0; margin: 0; font: inherit;
    font-size: 12px; color: var(--muted); cursor: pointer;
  }
  .tie-stats-toggle:hover { color: var(--text); }
  .tie-stats-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 6px 16px; margin-top: 10px;
  }
  .tie-stats-item {
    display: flex; justify-content: space-between; gap: 10px;
    font-size: 12px; font-variant-numeric: tabular-nums;
  }
  .tie-stats-label { color: var(--muted); }

  /* ---------------------------------------------------------------- watch */
  .watch-grid { display: grid; grid-template-columns: 320px 1fr; gap: 16px; }
  @media (max-width: 940px) { .watch-grid { grid-template-columns: 1fr; } }
  .match-list { max-height: 620px; overflow-y: auto; }
  .match {
    padding: 9px 11px; border: 1px solid var(--edge); border-radius: 8px;
    margin-bottom: 7px; cursor: pointer; background: var(--panel-2); font-size: 13.5px;
  }
  .match:hover { border-color: var(--team-a); }
  .match.on { border-color: var(--team-a); background: #1e2a3d; }
  .match .score { float: right; font-variant-numeric: tabular-nums; color: var(--muted); }
  iframe.viewer {
    width: 100%; height: 860px; border: 1px solid var(--edge); border-radius: 10px;
    background: #0e1116;
  }
  @media (max-width: 1040px) { iframe.viewer { height: 940px; } }

  /* ------------------------------------------------------------------ cup */
  /* A drawn bracket rather than a list of rounds. The boxes are placed
     absolutely from `cupLayout` and the lines are SVG paths underneath them,
     because the thing a bracket is for is showing where a team came from and
     where they go next — and that is a statement about lines. */
  .cup-scroll { overflow-x: auto; padding-bottom: 8px; }
  /* The size is set inline from what is drawn, and transitioned — so a round
     being reached makes the tree visibly open out rather than snap. */
  .cup-tree {
    position: relative;
    transition: width .55s cubic-bezier(.22, .68, .3, 1),
                height .55s cubic-bezier(.22, .68, .3, 1);
  }
  .cup-wires { position: absolute; inset: 0; overflow: visible; }
  .cup-wire { fill: none; stroke-width: 1.5; }
  .cup-wire.won { stroke: var(--team-a); }
  .cup-wire.dropped { stroke: var(--team-b); stroke-dasharray: 4 4; }
  /* A line into a box whose teams are still unknown must not read as a
     result, so an unplayed edge is drawn as the shape it is and no more. */
  .cup-wire.pending { stroke: var(--edge); stroke-dasharray: 2 5; }
  .cup-boxes { position: absolute; left: 0; right: 0; }
  .cup-section-label {
    position: absolute; height: 22px; line-height: 22px; font-size: 11.5px;
    letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted);
    white-space: nowrap;
  }
  .cup-section-label.upper { color: var(--team-a); }
  .cup-section-label.lower { color: var(--team-b); }
  .cup-section-label.final { color: var(--warn); }
  /* Fixed geometry, and it has to stay in step with the constants in the
     script: CUP_BOX_W, CUP_BOX_H, and CUP_ROW_1 / CUP_ROW_2 for where the two
     team lines sit. The layout spaces boxes by those numbers, and the wires
     are drawn to them, so a box that grew with its content would sit over the
     box beneath it and every line into it would point at the wrong row.
     64 = 1 + 3 + 20 + 20 + 16 + 3 + 1: border, padding, two team rows, the
     note row, padding, border. */
  .cup-match {
    position: absolute; width: 210px; height: 64px; box-sizing: border-box;
    border: 1px solid var(--edge); border-radius: 7px; background: var(--panel-2);
    padding: 3px 8px; font-size: 12.5px; overflow: hidden;
  }
  .cup-side {
    display: flex; justify-content: space-between; gap: 8px; align-items: center;
    height: 20px; line-height: 20px;
  }
  .cup-side .who {
    min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .cup-side .seed { color: var(--muted); font-size: 10.5px; margin-right: 5px; }
  .cup-side .goals { font-variant-numeric: tabular-nums; color: var(--muted); }
  .cup-side.won { font-weight: 650; }
  .cup-side.won .goals { color: var(--text); }
  .cup-side.lost .who, .cup-side.lost .seed { color: var(--muted); }
  /* A seat whose feeder match has not been played. */
  .cup-side.vacant .who, .cup-side.vacant .goals { color: #55606f; }
  .cup-side.kicks .who::after {
    content: " ●"; color: var(--warn); font-size: 8px; vertical-align: 2px;
  }
  /* Always present, even with nothing in it — see the note on .cup-match. */
  .cup-note {
    height: 16px; line-height: 16px; color: var(--muted); font-size: 9.5px;
    letter-spacing: .04em; text-transform: uppercase; overflow: hidden;
  }
  .cup-note.bad { color: var(--bad); }
  /* A match still to come, counting down. Tabular figures because the line is
     rewritten every second and proportional digits would shuffle it sideways
     as the numbers changed; the same reason the scoreline on the full-time
     slate is tabular. */
  .cup-note.when {
    color: var(--muted); opacity: .9;
    font-variant-numeric: tabular-nums; letter-spacing: .05em;
  }
  .cup-bye {
    position: absolute; height: 18px; line-height: 16px; font-size: 10.5px;
    color: var(--muted); border: 1px dashed var(--edge); border-radius: 6px;
    padding: 0 7px; white-space: nowrap; box-sizing: border-box;
  }
  /* Teams in a bracket that has no box for them yet — see `waiting` in
     `cupBracketHtml`. A row of chips in the section's own band, laid out at
     the column their next round will occupy, so the queue for a draw sits
     where the draw will appear.

     Deliberately not called `empty`: the site has a global `.empty` rule that
     pads an empty-state block by 30px, and anything inside the bracket that
     borrows it is 30px taller than the layout spaced it for. */
  .cup-waiting {
    position: absolute; height: 18px; display: flex; gap: 5px;
    align-items: center; white-space: nowrap;
  }
  .cup-wait {
    height: 18px; line-height: 16px; font-size: 10.5px; box-sizing: border-box;
    color: var(--team-b); border: 1px dashed var(--team-b); border-radius: 6px;
    padding: 0 7px; background: rgba(240, 84, 72, .08);
  }
  .cup-waiting.upper .cup-wait {
    color: var(--team-a); border-color: var(--team-a);
    background: rgba(96, 165, 250, .08);
  }
  .cup-wait .seed { opacity: .75; margin-right: 5px; }
  .cup-wait .said {
    color: var(--muted); border: 0; padding-left: 2px; font-style: italic;
  }
  /* The team the movement beat is about, held in the same gold the arriving
     row in a box is held in: a drop into a queue is still a drop, and it has
     to be findable on a board of twenty names. */
  .cup-wait.moving {
    color: var(--warn); border-color: var(--warn); font-weight: 700;
    background: rgba(255, 214, 64, .22);
    box-shadow: 0 0 0 1px rgba(255, 214, 64, .45);
    animation: cup-move-in 1.1s ease-out infinite;
  }
  .cup-waiting.upper .cup-wait.moving { color: var(--warn); border-color: var(--warn); }
  /* The match the broadcast is about to play. Named on deck rather than
     "current" because it is marked before it is played, which is the whole
     point: the bracket says what is coming next. */
  .cup-match.on-deck {
    border-color: var(--warn); background: #2b2a17; z-index: 2;
    animation: cup-deck 1.1s ease-in-out infinite;
  }
  @keyframes cup-deck {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255, 214, 64, 0.42); }
    50% { box-shadow: 0 0 0 5px rgba(255, 214, 64, 0); }
  }
  .cup-match.playing { border-color: var(--warn); background: #24272f; z-index: 2; }

  .cup-match.champion {
    border-color: var(--warn); z-index: 2;
    background: linear-gradient(180deg, #33301b, #24272f);
  }

  /* A round arriving on the board. The boxes come in from the left, staggered
     from an inline animation-delay so a round of ten reads as a run rather
     than as ten things appearing at once; the wires draw themselves along
     their own length, which `pathLength="1"` makes one rule for every path
     however long it is.

     No fill-mode on the wires: when the animation ends the static .settled /
     .pending rules have to take the dash pattern back. */
  .cup-match.fresh { animation: cup-pop .5s cubic-bezier(.2, .9, .3, 1) both; }
  @keyframes cup-pop {
    from { opacity: 0; transform: translateX(-22px) scale(.94); }
    to { opacity: 1; transform: none; }
  }
  .cup-wire.fresh { animation: cup-draw .75s ease-out .1s; }
  @keyframes cup-draw {
    from { stroke-dasharray: 1; stroke-dashoffset: 1; opacity: 0; }
    30% { opacity: 1; }
    to { stroke-dasharray: 1; stroke-dashoffset: 0; opacity: 1; }
  }
  .cup-bye.fresh, .cup-section-label.fresh {
    animation: cup-pop .5s cubic-bezier(.2, .9, .3, 1) both;
  }
  /* Nobody should be made ill by a bracket. */
  @media (prefers-reduced-motion: reduce) {
    .cup-tree { transition: none; }
    .cup-match.fresh, .cup-wire.fresh,
    .cup-bye.fresh, .cup-section-label.fresh { animation: none; }
    .cup-wait.moving { animation: none; }
    .cup-match.on-deck { animation: none; }

    /* The movement beats keep their end states — the point of them is which
       team went where, and that must survive the motion being turned off. */
    .cup-spark { display: none; }
    .cup-match.receiving { animation: none; }
    .cup-side.moving { animation: none; }
    .cup-side.leaving { animation: none; opacity: .3; }
  }

  /* Tracing one team's run. The whole tree dims and their boxes and wires
     stay lit, which is the only practical way to follow a team through a
     twenty-team double-elimination draw. Transitions on opacity rather than a
     class swap on every node, so moving along a column does not flicker. */
  .cup-match, .cup-wire { transition: opacity .16s ease; }
  .cup-tree.tracing .cup-match { opacity: .26; }
  .cup-tree.tracing .cup-wait { opacity: .26; }
  .cup-tree.tracing .cup-wait.traced { opacity: 1; border-color: var(--warn); }
  .cup-tree.tracing .cup-wire { opacity: .1; }
  .cup-tree.tracing .cup-match.traced { opacity: 1; border-color: var(--warn); z-index: 3; }
  .cup-tree.tracing .cup-wire.traced {
    opacity: 1; stroke: var(--warn); stroke-width: 2.4; stroke-dasharray: none;
  }
  /* Within a traced box, the traced team's own row is the one being followed. */
  .cup-tree.tracing .cup-match.traced .cup-side { opacity: .45; }
  .cup-tree.tracing .cup-match.traced .cup-side.traced { opacity: 1; font-weight: 650; }
  .cup-side { transition: opacity .16s ease; }

  /* One tie's numbers, on hover. Positioned from the box's own coordinates,
     so it lands correctly however the bracket is scrolled. */
  .cup-tip {
    position: absolute; z-index: 12; width: 320px; pointer-events: none;
    background: #0e1116; border: 1px solid var(--warn); border-radius: 9px;
    padding: 10px 13px; font-size: 12px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, .6);
  }
  .cup-tip-round {
    font-size: 10px; letter-spacing: .07em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 5px;
  }
  /* A row per team, so a name of any length has the whole width to itself —
     see the note in `cupStatsHtml`. Same order, top to bottom, as the match
     box and as the left-to-right columns of the statistics below. */
  .cup-tip-seat {
    display: flex; justify-content: space-between; gap: 10px; align-items: baseline;
    font-size: 12.5px; line-height: 1.35; padding: 1px 0;
  }
  .cup-tip-seat .who { min-width: 0; overflow-wrap: anywhere; }
  .cup-tip-seat .seed { color: var(--muted); font-size: 10.5px; margin-right: 5px; }
  .cup-tip-seat .goals {
    color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .cup-tip-seat.won { font-weight: 700; }
  .cup-tip-seat.won .goals { color: var(--warn); }
  .cup-tip-note {
    color: var(--muted); font-size: 11px; margin-top: 5px; line-height: 1.4;
  }
  .cup-tip-note.bad { color: var(--bad); }
  .cup-tip-stats { width: 100%; margin-top: 7px; font-size: 11.5px; }
  .cup-tip-stats th, .cup-tip-stats td {
    padding: 2px 4px; border-bottom: 1px solid var(--edge); text-align: center;
  }
  .cup-tip-stats th {
    color: var(--muted); font-weight: 400; font-size: 10px; text-transform: none;
    letter-spacing: 0; white-space: nowrap;
  }
  .cup-tip-stats td { font-variant-numeric: tabular-nums; width: 30%; }
  .cup-tip-stats td.lead { color: var(--warn); font-weight: 650; }

  /* The broadcast's movement beats: a team going through, then a team
     dropping. The spark is a short dash running the length of the wire the
     team travelled along — the movement itself, rather than a box lighting up
     at the far end and leaving the reader to infer it. */
  .cup-spark {
    fill: none; stroke: var(--warn); stroke-width: 3.4; stroke-linecap: round;
    stroke-dasharray: .14 1; pointer-events: none;
    filter: drop-shadow(0 0 6px rgba(255, 214, 64, .85));
    animation: cup-spark 1.2s cubic-bezier(.4, .05, .5, .95) both;
  }
  @keyframes cup-spark {
    from { stroke-dashoffset: .14; opacity: 0; }
    12% { opacity: 1; }
    88% { opacity: 1; }
    to { stroke-dashoffset: -1; opacity: 0; }
  }
  .cup-wire.moving { stroke-width: 2.6; opacity: 1; stroke-dasharray: none; }
  /* Likewise the box: lit for the whole beat by the class, with the ring as
     decoration. It used to be only a ring animation with a delay, so for the
     first half-second the box receiving a team looked like every other box. */
  .cup-match.receiving {
    border-color: var(--warn); z-index: 3; background: #2b2a17;
    animation: cup-receive 1.6s ease-out infinite;
  }
  @keyframes cup-receive {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255, 214, 64, .1); }
    40% { box-shadow: 0 0 0 7px rgba(255, 214, 64, .30); }
  }
  /* The arriving name.
     Three attempts at this animation each hid it in a different way — a fade
     with a delay, then a shorter fade, then a slide. The slide was the last
     one: `.cup-match` is `overflow: hidden`, so a row translated 26px left has
     its name clipped off the edge of its own box for the first part of the
     beat.
     So the highlight is now *state*, not motion. Gold, bold, on a gold wash,
     applied for as long as the class is on the element — no opacity, no
     transform, nothing time-dependent, nothing that can be clipped. The wash
     pulses, and that is decoration on top of something already visible. */
  .cup-side.moving {
    color: var(--warn); font-weight: 700;
    background: rgba(255, 214, 64, .22); border-radius: 4px;
    box-shadow: 0 0 0 1px rgba(255, 214, 64, .45);
    animation: cup-move-in 1.1s ease-out infinite;
  }
  .cup-side.moving .seed, .cup-side.moving .goals { color: var(--warn); }
  @keyframes cup-move-in {
    0%, 100% { background: rgba(255, 214, 64, .22); }
    50% { background: rgba(255, 214, 64, .40); }
  }
  /* A team whose cup has ended, on the board for the last time. */
  .cup-side.leaving { animation: cup-leave 1.7s ease-in-out .4s both; }
  @keyframes cup-leave {
    0% { opacity: 1; }
    45% { opacity: .35; color: var(--bad); }
    100% { opacity: .2; filter: grayscale(1); }
  }

  /* The front page: who holds the cup, and how long until the next one. */
  .cup-hero {
    display: grid;
    grid-template-columns: minmax(220px, .85fr) minmax(300px, 1.15fr) minmax(100px, .65fr);
    gap: 16px; min-height: 360px; margin-bottom: 16px; padding: 18px;
    align-items: center; overflow: hidden;
    border: 1px solid #35402f; border-radius: 12px;
    background:
      linear-gradient(90deg, rgba(5, 8, 12, .18), rgba(5, 8, 12, .02) 50%, rgba(5, 8, 12, .18)),
      url("assets/cup-countdown.jpg") center / cover no-repeat;
    box-shadow: inset 0 0 48px rgba(0, 0, 0, .35);
  }
  .cup-hero-main { grid-column: 1; align-self: end; }
  .cup-hero-empty { grid-template-columns: 1fr minmax(300px, 520px) 1fr; }
  .cup-hero-empty .cup-hero-next { grid-column: 2; }
  @media (max-width: 780px) {
    .cup-hero { grid-template-columns: 1fr; min-height: 500px; background-position: center; }
    .cup-hero-main { grid-column: 1; grid-row: 2; }
    .cup-hero-next, .cup-hero-empty .cup-hero-next { grid-column: 1; grid-row: 1; }
  }
  .cup-winner {
    display: flex; gap: 16px; align-items: center;
    border: 1px solid var(--warn); border-radius: 10px; padding: 15px 18px;
    background: linear-gradient(180deg, rgba(51, 48, 27, .94), rgba(28, 31, 37, .94));
    backdrop-filter: blur(8px);
  }
  .cup-winner.pending {
    border-color: var(--edge); background: rgba(28, 31, 37, .92);
  }
  .cup-winner .trophy { width: 62px; height: 62px; object-fit: contain; flex: 0 0 auto; }
  .cup-winner.pending .trophy { opacity: .38; filter: grayscale(.35); }
  .cup-winner-copy { min-width: 0; }
  .cup-winner .who {
    font-size: 23px; font-weight: 700; letter-spacing: -.02em; line-height: 1.15;
  }
  .cup-hero-next {
    grid-column: 2;
    border: 1px solid var(--edge); border-radius: 10px; padding: 15px 18px;
    background: rgba(18, 21, 26, .84); backdrop-filter: blur(8px);
    text-align: center; box-shadow: 0 12px 40px rgba(0, 0, 0, .34);
  }
  .cup-clock {
    font-size: clamp(32px, 4.2vw, 58px); font-weight: 750; font-variant-numeric: tabular-nums;
    letter-spacing: -.02em; color: var(--warn); margin-top: 2px;
  }
  .eyebrow {
    font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--muted); font-weight: 600;
  }
  .cup-head {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px;
    margin-bottom: 12px;
  }
  .cup-past-list { display: grid; gap: 6px; }
  /* A row is two lines now - who won it, and how many watched - so the row
     itself stacks and the old single line becomes `.cup-past-head`. */
  .cup-past {
    display: grid; gap: 3px; cursor: pointer;
    border: 1px solid var(--edge); border-radius: 8px; padding: 8px 11px;
    background: var(--panel-2); font-size: 13.5px;
  }
  .cup-past-head { display: flex; gap: 12px; align-items: baseline; }
  .cup-past:hover { border-color: var(--warn); }
  .cup-past.on { border-color: var(--warn); background: #2b2a17; }
  .cup-past .when { min-width: 0; flex: 1; }
  .cup-past .who { font-weight: 600; }
  .cup-past .tagged {
    font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase;
    color: var(--warn);
  }
  /* Wraps rather than scrolls: on a phone the two readings go under each
     other, which is one line more and still legible, where a row that
     scrolled sideways would hide the second one completely. */
  .cup-past-tally {
    display: flex; flex-wrap: wrap; gap: 4px 14px;
    font-size: 11.5px; color: var(--muted);
  }
  .cup-past-tally .scope {
    display: inline-block; min-width: 46px;
    font-size: 10px; letter-spacing: .07em; text-transform: uppercase;
    opacity: .75;
  }
  .cup-past-tally .none { font-style: italic; opacity: .7; }

  /* The bracket, drawn over a broadcast in progress rather than replacing it,
     so "what does this do to the draw?" is answerable without leaving the
     match. Same layer as the slates, above the frame. */
  .cup-cast-bracket {
    position: absolute; inset: 0; z-index: 9; display: grid; place-items: center;
    padding: clamp(52px, 7vh, 96px) clamp(16px, 3vw, 48px) clamp(16px, 3vh, 40px);
    background: rgba(5, 7, 10, .93);
    opacity: 0; visibility: hidden; transition: opacity .22s ease, visibility .22s;
  }
  .cup-cast-bracket.on { opacity: 1; visibility: visible; }
  .cup-cast-bracket-inner {
    width: 100%; max-height: 100%; overflow: auto;
    background: var(--panel); border: 1px solid var(--edge); border-radius: 12px;
    padding: 14px 16px;
  }
  .cup-cast-bracket-head {
    display: flex; align-items: baseline; gap: 14px; margin-bottom: 10px;
  }
  .cup-cast-bracket-head .exit {
    margin-left: auto; cursor: pointer; border: 1px solid var(--edge);
    background: var(--panel-2); color: var(--text); border-radius: 7px;
    padding: 5px 12px; font: inherit;
  }
  .cup-cast-bracket-head .exit:hover { border-color: var(--warn); }

  /* The elimination cards on the full-time slate: a knockout exit is the last
     anybody hears of a team, so it gets its whole cup on screen. */
  .cup-out {
    display: flex; flex-wrap: wrap; gap: 12px; justify-content: center;
    margin-top: clamp(14px, 2.4vh, 26px);
  }
  .cup-out:empty { display: none; }
  .cup-out-card {
    background: rgba(10, 13, 18, .72); border: 1px solid var(--edge);
    border-radius: 12px; padding: clamp(10px, 1.4vw, 16px); text-align: left;
    backdrop-filter: blur(4px); min-width: min(520px, 92vw);
  }
  .cup-out-head {
    color: #fff; font-size: clamp(13px, 1.4vw, 18px); font-weight: 700;
    margin-bottom: 8px; line-height: 1.25; overflow-wrap: anywhere;
  }
  .cup-out-head .muted { font-weight: 400; font-size: .8em; margin-left: 6px; }
  .cup-out-grid {
    margin: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px 12px;
  }
  .cup-out-grid div {
    border: 1px solid var(--edge); border-radius: 8px; padding: 5px 8px;
    background: rgba(34, 40, 51, .6);
  }
  .cup-out-grid dt {
    font-size: 9.5px; letter-spacing: .05em; text-transform: uppercase;
    color: var(--muted);
  }
  .cup-out-grid dd {
    margin: 1px 0 0; font-size: clamp(14px, 1.4vw, 19px);
    font-variant-numeric: tabular-nums; color: #e7edf5; font-weight: 650;
  }

  /* ------------------------------------------------------------- spotlight */
  /* A full-screen, hands-off cycle of recorded matches — for a screen on the
     wall of the lab. The site chrome is folded away and #view becomes the
     whole viewport. */
  body.spotlight-on header.top { display: none; }
  body.spotlight-on { overflow: hidden; }
  body.spotlight-on main#view {
    position: fixed; inset: 0; max-width: none; margin: 0; padding: 0;
    background: #05070a; z-index: 50;
  }
  .spotlight {
    position: absolute; inset: 0; isolation: isolate; overflow: hidden;
    background: #05070a url("assets/spotlight-idle.jpg") center/cover no-repeat;
  }
  /* The width kept for the reaction column. The match is laid out *beside* it
     rather than under it — see `.spotlight-stage` — because the alternative is
     hoping there is a dark margin to sit in, and whether there is depends
     entirely on the window: the pitch is about 1.9:1, so a 1.95:1 window has
     200px of margin each side and a 16:9 one has none at all. Reserving the
     strip is the only version of "not over the field" that is true on every
     screen. The pitch loses about 4% of its width for it.

     Zero unless a broadcast says otherwise, so every other page that draws
     these overlays - the spotlight - is unaffected. The bar declares which
     width it needs by putting `data-rail` on the body: an attribute rather
     than an inline style, so the portrait rule further down can still win. */
  :root { --react-rail: 0px; --react-row: 0px; }
  body[data-rail="glyphs"] { --react-rail: 68px; }
  /* Measured rather than guessed, against the longest thing in the set: at
     96px, 11px type and 4px of button padding, "This is Soccer League!" sets
     as two lines and no word overflows — and so does "heartbreak", the longest
     of the ids the no-emoji fallback falls back to. It is the narrowest width
     that holds two lines; below it the phrase needs three, and a third line is
     more height than the 20px of pitch it would give back. */
  body[data-rail="words"] { --react-rail: 96px; }

  /* The stage runs the full width, and the bar is drawn over it rather than
     beside it. Stopping it at the rail is what put a seam down a running
     match: the pitch ended well short of the right edge with a bare strip
     after it, against a thin margin on the left, so the picture read as
     cropped rather than as a broadcast.

     The cost is deliberate and worth knowing: on a 16:9 screen the pitch is
     wide enough that the buttons sit over the far right of it, and the goal at
     that end can be partly behind them. `--react-rail` is still what
     everything a viewer has to be able to *read* keeps clear of — the crowd's
     reactions, the goal overlay, the lockup, and the copy on a slate. */
  .spotlight-stage {
    position: absolute; inset: 0 0 var(--react-row) 0; z-index: 1;
  }
  .spotlight iframe {
    position: absolute; inset: 0; width: 100%; height: 100%;
    border: 0; background: #05070a;
  }
  /* Full-bleed, for the same reason the slate is: this is the broadcast's
     furniture, not part of the match, and stopping it at the rail is what put
     a seam down the screen while a game was running — the frame's artwork
     ending in mid-air and a bare strip starting. It is stretched to its box
     (`100% 100%`), so an inset box also squashed it into a narrower frame than
     the one that was drawn.

     The stage underneath stays inset. That is the whole point of reserving the
     rail: the furniture may run under the buttons, the pitch may not. */
  .spotlight-frame {
    position: absolute; inset: 0; z-index: 3;
    pointer-events: none;
    background: url("assets/spotlight-frame.png") center/100% 100% no-repeat;
    opacity: .42; mix-blend-mode: screen;
  }
  /* Top left, directly under the bar's own line of type — the tag, the two
     sides and the fixture count — and flush with it, so the two read as one
     lockup in the corner rather than as two things that happen to be near each
     other. `left` matches the bar's inline padding; both are given back
     together in the small-screen block further down.

     It sat bottom right until the stage went full-bleed, which is a corner it
     no longer has to itself: the pitch reaches into it, and so does the
     reaction bar. The top left is the one part of the frame nothing else
     claims — the scoreboard inside the match is centred, and the bar's own
     buttons are at the far right. */
  .spotlight-lockup {
    position: absolute;
    left: 20px; top: clamp(44px, 5vh, 58px);
    z-index: 4; width: clamp(190px, 20vw, 330px); height: auto;
    opacity: .72; filter: drop-shadow(0 5px 18px rgba(0, 0, 0, .75));
    pointer-events: none;
  }
  /* Above the reaction rail (z-index 9), which reserves the full height of the
     right-hand strip: the bar runs the whole width, so its right-hand buttons
     are inside that strip. Under the rail, the rail's gradient darkened them
     and swallowed their clicks. `pointer-events: none` here means being on
     top costs the rail nothing - only the buttons take the pointer. */
  .spotlight-bar {
    position: absolute; left: 0; right: 0; top: 0; z-index: 10; overflow: hidden;
    display: flex; align-items: center; gap: 16px;
    padding: 13px 20px 32px; font-size: 15px;
    background: linear-gradient(#05070af5 0%, #05070ac7 44%, #05070a00 100%);
    pointer-events: none;
  }
  .spotlight-bar::before {
    content: ""; position: absolute; inset: 0; z-index: -1;
    background: url("assets/spotlight-tactics.png") center/256px repeat;
    opacity: .08;
  }
  .spotlight-bar .tag {
    font-weight: 700; letter-spacing: 0.14em; font-size: 12px;
    color: var(--team-a); text-transform: uppercase;
  }
  /* On air: the same tag, said in the colour a live broadcast is said in,
     with a dot that pulses so a glance at the bar answers "is this the cup
     happening now or the one from three weeks ago?". */
  .spotlight-bar .tag.on-air { color: #ff5f57; }
  .spotlight-bar .tag.on-air::before {
    content: ""; display: inline-block; width: 7px; height: 7px;
    border-radius: 50%; background: currentColor; margin-right: 6px;
    vertical-align: 1px; animation: on-air-pulse 2s ease-in-out infinite;
  }
  @keyframes on-air-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
  .spotlight-bar .fixture { font-weight: 600; }
  .spotlight-bar .count { color: var(--muted); font-variant-numeric: tabular-nums; }
  .spotlight-bar .exit {
    margin-left: auto; pointer-events: auto; cursor: pointer;
    border: 1px solid var(--edge); background: var(--panel-2); color: var(--text);
    border-radius: 7px; padding: 5px 12px; font: inherit;
  }
  .spotlight-bar .exit:hover { border-color: var(--team-a); }
  /* Two or more buttons at the right-hand end go in a group, and the group
     takes the `auto` margin. Given to each button instead, flexbox splits the
     free space *between* the two auto margins — which leaves one button
     stranded in the middle of the bar rather than beside the other. */
  .spotlight-bar .bar-actions {
    margin-left: auto; display: flex; gap: 8px; pointer-events: auto;
  }
  .spotlight-bar .bar-actions .exit { margin-left: 0; }
  .spotlight-note {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    z-index: 6; color: var(--muted); font-size: 15px;
  }
  /* Full-bleed, like `.spotlight-pregame` and unlike the stage: a slate is the
     backdrop rather than something laid over the match, so stopping it at the
     rail put a hard vertical seam down the screen exactly where the buttons
     begin — the artwork ending and a bare strip starting. The rail's own
     gradient is the scrim that keeps the buttons readable over it.

     The padding still knows about the rail, so the copy is centred in the part
     of the screen the buttons are not sitting on. Only the picture goes under
     them. */
  .spotlight-interstitial {
    position: absolute; inset: 0; z-index: 7;
    display: grid; place-items: center;
    --slate-pad: clamp(72px, 9vw, 150px);
    padding: var(--slate-pad);
    padding-right: calc(var(--slate-pad) + var(--react-rail));
    padding-bottom: calc(var(--slate-pad) + var(--react-row));
    text-align: center;
    background: #05070a url("assets/spotlight-interstitial.jpg") center/cover no-repeat;
    opacity: 0; visibility: hidden; transform: scale(1.015);
    transition: opacity .38s ease, visibility .38s, transform 1.8s ease;
    pointer-events: none;
  }
  .spotlight-interstitial::before {
    content: ""; position: absolute; inset: 0;
    background:
      radial-gradient(circle at center, rgba(5, 7, 10, .12), rgba(5, 7, 10, .52) 72%),
      linear-gradient(180deg, rgba(5, 7, 10, .20), rgba(5, 7, 10, .55));
  }
  .spotlight-interstitial.on {
    opacity: 1; visibility: visible; transform: scale(1);
  }
  .spotlight-interstitial.full-time {
    background-image: url("assets/spotlight-full-time.jpg");
  }
  .spotlight-interstitial.idle {
    background-image: url("assets/spotlight-idle.jpg");
  }
  /* The cup's own holding slate: before kickoff, between results, and when the
     competition is still being played. The countdown splash was drawn for
     exactly this — a calm centre with copy over it — and it is what makes a
     cup's holds read as the cup's rather than as the Spotlight's. */
  .spotlight-interstitial.cup-countdown {
    background-image: url("assets/cup-countdown.jpg");
  }
  /* The champion badge on the closing slate. The broadcast is the moment the
     badge is actually won, and it is the same artwork the team then carries on
     its profile — so the award and the record of it are one thing. */
  .spotlight-slate-title .cup-slate-badge {
    display: block; width: clamp(84px, 11vw, 148px); height: auto;
    margin: 0 auto .18em;
    filter: drop-shadow(0 6px 22px rgba(0, 0, 0, .55));
  }
  .spotlight-slate-copy {
    position: relative; z-index: 1; width: min(900px, 90vw);
    filter: drop-shadow(0 8px 28px rgba(0, 0, 0, .72));
  }
  .spotlight-slate-lockup {
    display: block; width: min(520px, 66vw); height: auto; margin: 0 auto 28px;
  }
  .spotlight-slate-kicker {
    color: var(--good); font-size: clamp(11px, 1vw, 15px); font-weight: 800;
    letter-spacing: .18em; text-transform: uppercase;
  }
  .spotlight-slate-title {
    margin: 10px auto 8px; color: #fff; font-size: clamp(30px, 5vw, 72px);
    line-height: 1.05; letter-spacing: -.035em; text-wrap: balance;
  }
  .spotlight-interstitial.full-time .spotlight-slate-title { color: var(--warn); }
  /* The full-time slate's two lines: who played, then what it finished. Both
     are blocks so they stack whatever the names are, and the scoreline is
     tabular so the digits do not shift as the queue moves on. */
  .spotlight-slate-title .ft-teams,
  .spotlight-slate-title .ft-score { display: block; }
  .spotlight-slate-title .ft-teams { font-size: .68em; color: #fff; }
  .spotlight-slate-title .ft-score {
    margin-top: .12em; font-variant-numeric: tabular-nums;
    letter-spacing: -.02em;
  }
  .spotlight-slate-meta {
    margin: 0; color: #c6cfdb; font-size: clamp(13px, 1.4vw, 20px);
  }

  /* The pre-match team sheet, held for SPOTLIGHT_PREGAME_MS before kick-off:
     both league records side by side with every badge each side has earned.
     Same backdrop and fade as the interstitial, and the same layer — only one
     of the two is ever shown at a time. */
  .spotlight-pregame {
    position: absolute; inset: 0; z-index: 7; display: grid; place-items: center;
    padding: clamp(40px, 6vh, 104px) clamp(28px, 6vw, 132px);
    padding-right: calc(clamp(28px, 6vw, 132px) + var(--react-rail));
    padding-bottom: calc(clamp(40px, 6vh, 104px) + var(--react-row));
    background: #05070a url("assets/spotlight-interstitial.jpg") center/cover no-repeat;
    opacity: 0; visibility: hidden; transform: scale(1.015);
    transition: opacity .38s ease, visibility .38s, transform 1.8s ease;
    pointer-events: none;
  }
  .spotlight-pregame::before {
    content: ""; position: absolute; inset: 0;
    background:
      radial-gradient(circle at center, rgba(5, 7, 10, .16), rgba(5, 7, 10, .62) 74%),
      linear-gradient(180deg, rgba(5, 7, 10, .32), rgba(5, 7, 10, .66));
  }
  .spotlight-pregame.on { opacity: 1; visibility: visible; transform: scale(1); }
  .spotlight-pregame-inner {
    position: relative; z-index: 1; width: min(1180px, 94vw); text-align: center;
    filter: drop-shadow(0 8px 28px rgba(0, 0, 0, .72));
  }
  .spotlight-pregame-fixture {
    margin: 8px auto 6px; color: #fff; font-size: clamp(24px, 4vw, 56px);
    line-height: 1.05; letter-spacing: -.03em; text-wrap: balance;
  }
  .spotlight-pregame .spotlight-slate-meta { margin-bottom: clamp(16px, 3vh, 32px); }
  .spotlight-pregame-teams {
    display: grid; grid-template-columns: 1fr 1fr; gap: clamp(14px, 3vw, 44px);
  }
  .spotlight-pregame .pg-team {
    background: rgba(10, 13, 18, .66); border: 1px solid var(--edge);
    border-radius: 14px; padding: clamp(13px, 2vw, 24px); text-align: left;
    backdrop-filter: blur(4px);
  }
  .spotlight-pregame .pg-name {
    color: #fff; font-size: clamp(16px, 2vw, 28px); font-weight: 700;
    letter-spacing: -.02em;
  }
  .spotlight-pregame .pg-kind {
    color: var(--good); font-size: clamp(9.5px, .9vw, 12.5px); font-weight: 800;
    letter-spacing: .16em; text-transform: uppercase; margin-top: 3px;
  }
  .spotlight-pregame .pg-stats {
    margin: clamp(10px, 1.6vh, 18px) 0 0; display: grid;
  }
  .spotlight-pregame .pg-stat {
    display: flex; justify-content: space-between; gap: 12px;
    font-variant-numeric: tabular-nums; font-size: clamp(11.5px, 1.15vw, 15.5px);
    padding: 4px 0; border-bottom: 1px solid rgba(255, 255, 255, .07);
  }
  .spotlight-pregame .pg-stat dt { color: var(--muted); }
  .spotlight-pregame .pg-stat dd { margin: 0; color: #e7edf5; font-weight: 650; }
  .spotlight-pregame .pg-badges {
    display: flex; flex-wrap: wrap; gap: 7px;
    margin-top: clamp(10px, 1.6vh, 16px);
  }
  .spotlight-pregame .pg-badges .badge-icon {
    width: clamp(38px, 3.2vw, 52px); height: clamp(38px, 3.2vw, 52px);
  }
  .spotlight-pregame .pg-none {
    margin: clamp(10px, 1.6vh, 16px) 0 0; color: var(--muted);
    font-size: clamp(11px, 1vw, 13.5px);
  }
  @media (max-width: 760px) {
    .spotlight-pregame-teams { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) {
    .spotlight-pregame {
      transition: opacity .15s linear, visibility .15s; transform: none;
    }
  }

  .spotlight-goal {
    position: absolute; inset: 0 var(--react-rail) var(--react-row) 0; z-index: 6;
    display: grid; place-items: center;
    opacity: 0; visibility: hidden; transform: scale(.88);
    pointer-events: none;
  }
  .spotlight-goal.show {
    visibility: visible; animation: spotlight-goal 2.4s ease both;
  }
  .spotlight-goal img {
    position: absolute; width: min(82vw, 1280px); height: auto;
    filter: drop-shadow(0 0 26px rgba(255, 214, 64, .4));
  }
  .spotlight-goal.own-goal img {
    filter: drop-shadow(0 0 26px rgba(240, 84, 72, .38));
  }
  /* Both overlays are in the page from the moment a broadcast opens, and the
     class chooses between them. The obvious alternative — one image whose
     `src` is swapped when the goal arrives — fetches the artwork on the very
     beat it is needed for, because the server sends `Cache-Control: no-store`
     on everything and so nothing fetched earlier is kept. A megabyte and a
     half arriving while the burst is meant to be on screen is a burst that
     turns up after the moment it is announcing; and since goals alternate
     between the two kinds, it would do it again on every switch. An element
     that has loaded keeps its image whatever the cache is told to do. */
  .spotlight-goal .goal-art { display: block; }
  .spotlight-goal .goal-art.own,
  .spotlight-goal.own-goal .goal-art { display: none; }
  .spotlight-goal.own-goal .goal-art.own { display: block; }
  .spotlight-goal-copy {
    position: relative; z-index: 1; margin-top: 15vh; text-align: center;
    text-shadow: 0 4px 22px #000, 0 0 24px rgba(255, 214, 64, .58);
  }
  .spotlight-goal-copy strong {
    display: block; color: #fff; font-size: clamp(38px, 7vw, 104px);
    line-height: .95; letter-spacing: -.035em; text-transform: uppercase;
  }
  .spotlight-goal-copy span {
    display: block; margin-top: 12px; color: var(--warn);
    font-size: clamp(20px, 3.4vw, 52px); font-weight: 800;
    line-height: 1.02; letter-spacing: -.02em; text-wrap: balance;
  }
  .spotlight-goal-copy span:empty { display: none; }
  .spotlight-goal.own-goal .spotlight-goal-copy {
    text-shadow: 0 4px 22px #000, 0 0 24px rgba(240, 84, 72, .52);
  }
  .spotlight-goal.own-goal .spotlight-goal-copy span { color: #ffb347; }
  @keyframes spotlight-goal {
    0% { opacity: 0; transform: scale(.84); }
    16%, 70% { opacity: 1; transform: scale(1); }
    100% { opacity: 0; transform: scale(1.05); }
  }

  /* The crowd.

     Reactions rise up the left and right edges and never cross the middle:
     the match is what people are here for, and a broadcast with emoticons
     drifting over the ball is a broadcast nobody can follow. Which edge, how
     high it starts and how far in it sits are all decided by the server (see
     `evaluator.room`), because every screen is meant to be showing the same
     competition and a burst that lands somewhere else on each of them is not
     the same broadcast. */
  .cup-crowd {
    position: absolute; inset: 0 var(--react-rail) var(--react-row) 0; z-index: 7;
    overflow: hidden; pointer-events: none;
  }
  .cup-crowd span {
    position: absolute; font-size: clamp(30px, 4vw, 54px); line-height: 1;
    font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji",
      "Twemoji Mozilla", sans-serif;
    filter: drop-shadow(0 3px 12px rgba(0, 0, 0, .6));
    animation: cup-rise 4.2s cubic-bezier(.22, .61, .36, 1) forwards;
    will-change: transform, opacity;
  }
  /* The last fallback: a machine with no emoji font at all, which is a
     perfectly ordinary Linux box and quite likely the one driving a screen at
     the front of a room. A word is not as good as a drawing, and it is much
     better than the empty rectangle a missing glyph renders as. */
  .cup-crowd span.as-text, .cup-react button.as-text {
    font-family: inherit; font-weight: 800; text-transform: uppercase;
    letter-spacing: -.01em; color: #f2f5f8;
  }
  .cup-crowd span.as-text { font-size: clamp(17px, 2.1vw, 28px); }
  /* A phrase is words by intent rather than by fallback, so it gets a box
     instead of a line: the edge a reaction rises up is a narrow strip, and
     "This is Soccer League!" set as one line would lie straight across the
     pitch it is reacting to. Wrapped and capped, it stays at the edge. */
  .cup-crowd span.as-phrase {
    font-size: clamp(14px, 1.7vw, 24px); line-height: 1.15;
    max-width: min(26vw, 230px); text-align: center; text-wrap: balance;
  }
  .cup-react button.as-text {
    font-size: 11px; padding: 8px 4px; letter-spacing: 0;
    line-height: 1.25; text-wrap: balance;
  }
  /* A phrase keeps the capitalisation it was written with. The uppercasing is
     there to make a bare id — `heartbreak`, `nice shot` — look like a decision
     rather than a variable name; a sentence that already has a capital and an
     exclamation mark does not need it, and setting one in caps costs about a
     size step of width, which is a whole extra line in a rail this narrow. */
  .cup-react button.as-phrase { text-transform: none; }
  .cup-crowd img { width: clamp(34px, 4.6vw, 62px); height: auto; display: block; }
  @keyframes cup-rise {
    0% { opacity: 0; transform: translateY(40px) scale(.55) rotate(-6deg); }
    14% { opacity: 1; transform: translateY(0) scale(1.08) rotate(2deg); }
    30% { transform: translateY(-6vh) scale(1) rotate(-2deg); }
    100% { opacity: 0; transform: translateY(-42vh) scale(.96) rotate(3deg); }
  }

  /* The bar you send one from. Bottom centre, over the match rather than
     beside it: this is the only thing on the broadcast that can be clicked,
     so it is put where a hand goes. */
  /* The strip is mostly empty - the buttons are a centred cluster - so it
     lets the pointer through and the buttons take it back. Otherwise the
     empty half of a full-height strip blocks whatever it is drawn over. */
  .cup-react {
    position: absolute; right: 0; top: 0; bottom: 0; width: var(--react-rail);
    z-index: 9; pointer-events: none; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 7px; padding: 10px 0;
    background: linear-gradient(90deg, #05070a00, #05070ab0 55%, #05070ae0 100%);
  }
  .cup-react button {
    appearance: none; pointer-events: auto; cursor: pointer;
    font-size: 22px; line-height: 1;
    font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji",
      "Twemoji Mozilla", sans-serif;
    padding: 7px 11px; border-radius: 12px;
    color: #fff; background: rgba(255, 255, 255, .07);
    border: 1px solid rgba(255, 255, 255, .16);
    transition: transform .12s ease, background .12s ease, opacity .2s ease;
  }
  .cup-react button:hover { background: rgba(255, 255, 255, .16); transform: translateY(-2px); }
  .cup-react button:active { transform: translateY(0) scale(.94); }
  .cup-react button img { width: 26px; height: 26px; display: block; }
  /* One cooldown for the whole bar, because it is one per person and not one
     per emoticon: pressing a different button is still the same person
     saying a second thing. */
  .cup-react.cooling button { opacity: .38; cursor: default; transform: none; }
  /* Under the column, and narrow: "everyone at once" has to read in 60px.
     Empty most of the time, and then it takes no room at all. */
  .cup-react .react-note {
    color: var(--muted); font-size: 10px; line-height: 1.25;
    max-width: 100%; text-align: center; text-wrap: balance;
  }
  .cup-react .react-note:empty { display: none; }
  /* Words need more room than pictures, and the rail is a reserved width, so
     it has to say which it is showing. `drawBar` sets `--react-rail` to match,
     and the stage and the vignette follow it. */
  .cup-react.as-words button { width: 100%; }
  /* How many people have this cup open. On the top bar of a broadcast and in
     the head of the cup card, from the same count. */
  .watching { color: var(--muted); font-size: 13px; white-space: nowrap; }
  .watching::before {
    content: ""; display: inline-block; width: 6px; height: 6px;
    border-radius: 50%; background: #6ee7a0; margin-right: 6px;
    vertical-align: 1px;
  }
  .watching:empty { display: none; }
  .spotlight-bar .watching { margin-left: auto; }
  @media (max-width: 700px) {
    .spotlight-frame { opacity: .25; }
    .spotlight-lockup { width: 170px; left: 12px; }
    .spotlight-bar { gap: 9px; padding-inline: 12px; font-size: 12px; }
    .spotlight-bar .tag { display: none; }
    .spotlight-slate-lockup { margin-bottom: 18px; }
    .cup-react button { font-size: 18px; padding: 6px 8px; }
  }
  /* A tall window lays the pitch out wide and short, so the room is below it
     rather than beside it, and the column becomes a row again. The reserved
     strip is given back at the same time.

     A *short* window becomes a row for the other reason: the column is as tall
     as the roster makes it — measured at 503px for these eleven, the tallest
     of them two lines — so under about that a centred column spills off both
     ends of a screen nobody can scroll. The row wraps and `fitRow` measures
     what it wraps to, which is why the height below is the only number that
     has to be kept honest as the set grows. */
  @media (orientation: portrait), (max-width: 700px), (max-height: 560px) {
    body[data-rail] { --react-rail: 0px; }
    .cup-react {
      inset: auto 0 0 0; width: auto; flex-direction: row; flex-wrap: wrap;
      gap: 6px; padding: 26px 12px 12px;
      background: linear-gradient(#05070a00, #05070ab8 62%, #05070ae8 100%);
    }
    .cup-react .react-note { font-size: 12px; max-width: 14ch; }
    /* Full width is a column rule. Left on in a row it gives one button per
       line, and eight lines of bar is taller than the margin under the pitch. */
    .cup-react.as-words button { width: auto; }
  }
  @media (prefers-reduced-motion: reduce) {
    .spotlight-interstitial { transition: opacity .15s linear, visibility .15s; transform: none; }
    .spotlight-goal.show { animation-duration: .8s; }
    .spotlight-bar .tag.on-air::before { animation: none; }
    /* Still said, and still gone a moment later: a reaction that does not
       move is a reaction, but one that stays is clutter over the match. */
    .cup-crowd span { animation: cup-hold 2.6s ease-out forwards; }
    @keyframes cup-hold {
      0% { opacity: 0; } 12%, 62% { opacity: 1; } 100% { opacity: 0; }
    }
  }
  /* The one action a live cup offers, and it says which cup it means. */
  #cup-play.on-air-join::before {
    content: ""; display: inline-block; width: 7px; height: 7px;
    border-radius: 50%; background: #ff5f57; margin-right: 7px;
    vertical-align: 1px;
  }

  /* ----------------------------------------------------------------- docs */
  .doc-grid { display: grid; grid-template-columns: 240px 1fr; gap: 22px; align-items: start; }
  @media (max-width: 940px) { .doc-grid { grid-template-columns: 1fr; } }
  .toc { position: sticky; top: 16px; font-size: 13.5px; }
  .toc a { display: block; color: var(--muted); padding: 3px 0; }
  .toc a:hover { color: var(--text); }
  .doc { width: 100%; min-width: 0; }
  .doc h1 { font-size: 22px; margin: 0 0 14px; }
  .doc h2 { font-size: 17px; margin: 30px 0 8px; padding-top: 6px; border-top: 1px solid var(--edge); }
  .doc h3 { font-size: 15px; margin: 22px 0 6px; }
  .doc-section-divider {
    position: relative; overflow: hidden; width: 100%; height: 42px;
    margin: 30px auto 16px; border: 1px solid #294537; border-radius: 999px;
    background:
      linear-gradient(90deg, rgba(10, 13, 18, .48), transparent 34% 66%, rgba(10, 13, 18, .48)),
      url("docs/images/docs-section-divider.jpg") center 51% / cover no-repeat;
    box-shadow: inset 0 0 18px rgba(0, 0, 0, .38), 0 6px 18px rgba(0, 0, 0, .14);
  }
  .doc-section-divider::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(180deg, rgba(18, 21, 26, .28), transparent 38% 68%, rgba(18, 21, 26, .34));
  }
  .doc-section-divider + h2 { margin-top: 0; padding-top: 0; border-top: 0; }
  @media (max-width: 620px) {
    .doc-section-divider { height: 34px; margin: 25px auto 14px; }
  }
  @media print { .doc-section-divider { display: none; } }
  .doc table { margin: 14px 0; }
  .doc blockquote {
    margin: 14px 0; padding: 2px 16px; border-left: 3px solid var(--edge); color: var(--muted);
  }
  .doc .path { color: var(--muted); font-family: ui-monospace, Consolas, monospace; font-size: 13px; }
  .doc li { margin: 3px 0; }
  /* Figures use the same full content column as the expanded documentation. */
  .doc img.figure {
    display: block; height: auto; margin: 18px 0;
    width: 100%;
    border: 1px solid var(--edge); border-radius: 8px; background: var(--bg);
  }

  .steps { counter-reset: step; list-style: none; padding: 0; margin: 0; }
  .steps li { counter-increment: step; position: relative; padding: 0 0 14px 34px; }
  .steps li::before {
    content: counter(step); position: absolute; left: 0; top: 0;
    width: 22px; height: 22px; border-radius: 50%; background: var(--panel-2);
    border: 1px solid var(--edge); color: var(--muted);
