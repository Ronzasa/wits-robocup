      // on, so recording it here would tell the champion — who lost once on
      // the way — that they were knocked out in round three.
      if (match.bracket !== "upper") record.out_in = match.label;
    }
  }
  return record;
}

// ---------------------------------------------------------------------------
// Drawing the bracket
//
// A bracket is a tree, and the thing it is for is showing where a team came
// from and where they go next — which is a statement about lines, not about
// columns. So the boxes are placed absolutely and the lines are drawn as SVG
// paths underneath them.
//
// This bracket is *derived* rather than drawn in advance (see
// `evaluator.cup.Bracket`), so it has no fixed slots to hang a tree off. The
// edges are recovered instead: for each team in a match, the last match they
// played before it is where they came from. That handles everything the format
// can do without special cases — a bye reaches back further than one column, a
// dropdown reaches across from the upper bracket to the lower, and the grand
// final reaches back into both.
// ---------------------------------------------------------------------------

const CUP_BOX_W = 210;
//: A box is a fixed height, and every box is the same height, because the
//: layout arithmetic below spaces them by this number. It is *three* rows —
//: the two teams and a note line — and the note line is rendered even when
//: there is nothing to put in it. A box that grew a third row only when it had
//: something to say would be taller than the layout had allowed for, and would
//: sit over the box beneath it: `.cup-match` in the stylesheet pins the same
//: height from the other side.
const CUP_BOX_H = 64;
//: The gap between columns is where the elbows turn, and every wire into a
//: column turns at its own x inside it (see `cupLayout`), so it has to be wide
//: enough to hold as many lanes as the widest round has wires arriving.
const CUP_COL_GAP = 84;
const CUP_ROW_GAP = 22;
// Between the upper bracket and the lower bracket. Generous: this is the one
// gap a reader uses to tell the two halves of the competition apart.
const CUP_SECTION_GAP = 96;
//: The band above each section, holding its name — and, under that, any team
//: given a bye in one of its rounds. Both are reserved space rather than
//: things placed over the tree and hoped for: a bye chip drawn above its
//: round's first box lands on the last box of the round above it.
const CUP_LABEL_H = 22;
const CUP_CHIP_H = 22;

/**
 * Where each team in each match came from.
 *
 * Returns `{ [match_id]: [{ from, slug, kind }] }`, where `kind` is `"won"`
 * for a team that advanced and `"dropped"` for one that lost and fell into the
 * lower bracket. The two are drawn differently: an advancement is the spine of
 * the bracket and a dropdown crosses between brackets, so telling them apart
 * is most of what makes the picture readable.
 */
function cupEdges(bracket) {
  const matches = cupMatches(bracket);
  const lastSeen = new Map();          // slug -> index of their previous match
  const edges = {};
  matches.forEach((match, index) => {
    edges[match.match_id] = [];
    match.teams.forEach((team, side) => {
      const previous = lastSeen.get(team.slug);
      if (previous !== undefined) {
        const from = matches[previous];
        edges[match.match_id].push({
          from: from.match_id,
          slug: team.slug,
          kind: from.winner === team.slug ? "won" : "dropped",
          // Which line of each box this team is on. A wire that leaves and
          // arrives on the team's own line is a wire you can follow, and two
          // wires into one box no longer land on the same point and draw over
          // each other.
          fromSide: from.teams.findIndex((other) => other.slug === team.slug),
          side,
        });
      }
      lastSeen.set(team.slug, index);
    });
  });
  return edges;
}

/**
 * Positions for every box, and the paths between them.
 *
 * Three sections stacked down the page — upper bracket, lower bracket, grand
 * final — each laid out as columns of one round. A box in a later round sits
 * at the average height of the boxes its teams came from, which is what gives
 * a bracket its shape; boxes that would then overlap are pushed apart, in
 * order, so a round never draws two boxes on top of each other.
 */
function cupLayout(bracket) {
  const matches = cupMatches(bracket);
  const byId = new Map(matches.map((match) => [match.match_id, match]));
  const edges = cupEdges(bracket);
  const pitch = CUP_BOX_W + CUP_COL_GAP;

  // Rounds grouped by the section they belong to, in the order they were
  // played. The grand final is its own section: it belongs to neither bracket.
  const sections = [
    { key: "upper", title: "Upper bracket", rounds: [] },
    { key: "lower", title: "Lower bracket", rounds: [] },
    { key: "final", title: "Grand final", rounds: [] },
  ];
  for (const round of bracket.rounds || []) {
    const section = sections.find((item) => item.key === round.bracket);
    if (section) section.rounds.push(round);
  }
  // Who a section holds, as the bracket file itself reports it.
  //
  // A section normally exists because it has rounds in it. One case does not:
  // a cup on air is drawn from the rounds that are on disk, and a lower round
  // is not drawn until the upper round above it has finished — so for the
  // whole of an upper round the beaten teams are in a lower bracket that has
  // nothing in it to draw. It still has to be on the board, because that is
  // where those teams are; `waiting` in `cupBracketHtml` is what goes in it.
  //
  // Read off the file's own pools rather than off the reveal position, so that
  // this is a fact about the bracket and not about how much of it is on
  // screen: a layout that changed as a broadcast advanced would move boxes
  // under it, which is the one thing the growth is careful not to do.
  const pools = {
    upper: (bracket.upper || []).length,
    lower: (bracket.lower || []).length,
    final: 0,
  };
  const live = sections.filter(
    (section) => section.rounds.length || pools[section.key],
  );

  const place = {};                    // match_id -> {x, y}
  // Every section opens with a band for its name, and a second one under it
  // when any of its rounds gave a bye. Reserved here rather than drawn over
  // the tree later, which is how a bye chip came to sit on the box above it.
  let cursor = 0;
  const columns = Math.max(
    ...live.filter((s) => s.key !== "final").map((s) => s.rounds.length), 1,
  );

  for (const section of live) {
    section.labelAt = cursor;
    section.hasBye = section.rounds.some((round) => round.bye);
    // The band holds byes and, while a cup is still being played, the teams
    // waiting on a draw. A finished cup can have neither — every team is in a
    // box or out — so it keeps the tighter spacing it always had.
    section.hasChips = section.hasBye || !bracket.finished;
    section.chipAt = section.hasChips ? cursor + CUP_LABEL_H : null;
    cursor += CUP_LABEL_H + (section.hasChips ? CUP_CHIP_H : 0);
    section.top = cursor;
    let bottom = cursor;
    section.rounds.forEach((round, column) => {
      // The grand final is pushed to the right of both brackets, so it reads
      // as what follows them rather than as a third short bracket.
      const x = (section.key === "final" ? columns : column) * pitch;
      const wanted = (round.matches || []).map((match) => {
        const from = (edges[match.match_id] || [])
          .map((edge) => place[edge.from])
          .filter(Boolean);
        if (!from.length) return null;
        return from.reduce((total, box) => total + box.y, 0) / from.length;
      });
      // Anything with no placed predecessor — a first round, or a box whose
      // teams all arrived from a section drawn later — falls back to its
      // position in the round.
      let next = cursor;
      const ys = wanted.map((y, index) => {
        const fallback = cursor + index * (CUP_BOX_H + CUP_ROW_GAP);
        return y === null ? fallback : y;
      });
      // Pushed apart in order, so a column never overlaps itself. Done after
      // the averaging rather than instead of it: the averaging is what makes
      // the bracket look like a bracket, and this only repairs it where two
      // averages landed too close.
      const order = ys.map((y, index) => ({ y, index })).sort((a, b) => a.y - b.y);
      for (const item of order) {
        const y = Math.round(Math.max(item.y, next));
        place[round.matches[item.index].match_id] = { x, y };
        next = y + CUP_BOX_H + CUP_ROW_GAP;
        bottom = Math.max(bottom, y + CUP_BOX_H);
      }
    });
    section.bottom = bottom;
    cursor = bottom + CUP_SECTION_GAP;
  }

  // The grand final, alone in its section, is centred on the whole bracket
  // instead of sitting under the lower one.
  const finalSection = live.find((section) => section.key === "final");
  if (finalSection) {
    const others = live.filter((section) => section.key !== "final");
    const spread = others.length
      ? [Math.min(...others.map((s) => s.top)), Math.max(...others.map((s) => s.bottom))]
      : [0, CUP_BOX_H];
    const middle = Math.round((spread[0] + spread[1]) / 2 - CUP_BOX_H / 2);
    for (const round of finalSection.rounds) {
      for (const match of round.matches || []) {
        place[match.match_id] = { x: place[match.match_id].x, y: middle };
      }
    }
    finalSection.top = middle;
    finalSection.bottom = middle + CUP_BOX_H;
    // Moved with it: the final is lifted out of the flow above, so its name
    // has to follow rather than stay where the flow had put it.
    finalSection.labelAt = middle - CUP_LABEL_H;
    finalSection.chipAt = null;
  }

  const boxes = matches
    .filter((match) => place[match.match_id])
    .map((match) => ({ match, ...place[match.match_id] }));
  const wires = [];
  for (const match of matches) {
    for (const edge of edges[match.match_id] || []) {
      const from = place[edge.from];
      const to = place[match.match_id];
      if (!from || !to) continue;
      wires.push({
        from, to, kind: edge.kind, slug: edge.slug,
        fromSide: edge.fromSide, side: edge.side,
        from_id: edge.from, into: match.match_id,
      });
    }
  }
  // Every wire that turns in the same gap gets its own lane across it. Without
  // this, two wires into two different boxes in the same column turn at the
  // same x and their vertical runs are drawn one on top of the other — which
  // was fourteen of the fifty-six lines in a twenty-team cup. The lanes are
  // handed out in the order the wires arrive down the column, so neighbouring
  // lanes belong to neighbouring boxes and the lines do not cross on the way
  // in either.
  const byGap = new Map();
  for (const wire of wires) {
    if (wire.to.x <= wire.from.x) continue;      // a drop line, drawn differently
    if (!byGap.has(wire.to.x)) byGap.set(wire.to.x, []);
    byGap.get(wire.to.x).push(wire);
  }
  for (const [x, group] of byGap) {
    group.sort((a, b) => (a.to.y - b.to.y) || (a.side - b.side));
    const margin = 10;
    const band = CUP_COL_GAP - margin * 2;
    group.forEach((wire, index) => {
      const share = group.length === 1 ? 0.5 : index / (group.length - 1);
      wire.turn = Math.round(x - CUP_COL_GAP + margin + band * share);
    });
  }

  return {
    boxes,
    wires,
    sections: live,
    width: (finalSection ? columns + 1 : columns) * pitch - CUP_COL_GAP,
    height: Math.max(...boxes.map((box) => box.y + CUP_BOX_H), CUP_BOX_H) + 8,
    byId,
  };
}

//: Where a box's two team lines sit, measured from the box's top. Must agree
//: with `.cup-match` and `.cup-side` in the stylesheet: a wire arriving at the
//: wrong height is worse than no wire, because it names the wrong team.
const CUP_ROW_1 = 14;
const CUP_ROW_2 = 34;

function cupRowY(box, side) {
  return Math.round(box.y + (side === 1 ? CUP_ROW_2 : CUP_ROW_1));
}

/**
 * One wire, from the line a team left to the line they arrived on.
 *
 * **It joins team lines, not box centres.** Two teams arriving in one box from
 * two different matches used to be drawn to the same point, so their last two
 * segments were the same two segments and one was painted over the other; and
 * a line into the middle of a box says a team arrived without saying which
 * team. Leaving and arriving on the team's own line fixes both at once, and
 * makes a wire something you can follow with a finger.
 *
 * Two shapes, because the bracket has two kinds of movement in it.
 *
 * **Forward**, into a box further right: the classic elbow — out of the right
 * edge, across at a turn inside the gap, then in to the left edge. That is how
 * brackets have been drawn since they were drawn on paper, and it reads
 * correctly whether the boxes are one row apart or a whole bracket apart. The
 * turn is offset by which line the team arrives on, so two wires into one box
 * do not share a vertical lane either.
 *
 * **Sideways or backwards**, which is what a dropdown from the upper bracket
 * into the lower one looks like when the two land in the same column: an elbow
 * has nowhere to turn, and drawing one produces a line that doubles back
 * through its own box. So the wire leaves to the right, runs down (or up) past
 * the target, comes back along, and enters through the target's *top* edge —
 * which also says "this team fell into here" rather than "came through from
 * the left". Its lane and its entry point are offset by the arriving line, so
 * two teams dropping into the same match keep their own paths.
 */
function cupWirePath(from, to, fromSide, side, turn) {
  const lane = side === 1 ? 1 : 0;
  const ax = Math.round(from.x + CUP_BOX_W);
  const ay = cupRowY(from, fromSide);
  const by = cupRowY(to, side);
  if (to.x > from.x) {
    // `turn` is the lane this wire was given in the gap before its target —
    // see `cupLayout`. Clamped so a wire reaching back more than one column
    // still turns after it has left its own box.
    const at = Math.round(Math.max(turn == null ? ax + CUP_COL_GAP / 2 : turn, ax + 6));
    return `M ${ax} ${ay} H ${at} V ${by} H ${Math.round(to.x)}`;
  }
  const below = to.y >= from.y;
  const edge = Math.round(below ? to.y : to.y + CUP_BOX_H);
  const stand = Math.round(edge + (below ? -1 : 1) * (6 + lane * 9));
  // The two lines enter the top edge a third and two thirds across, so they
  // arrive over their own team's name rather than both at the middle.
  const entry = Math.round(to.x + CUP_BOX_W * (lane ? 0.66 : 0.34));
  const out = Math.round(ax + CUP_COL_GAP * (lane ? 0.5 : 0.26));
  return `M ${ax} ${ay} H ${out} V ${stand} H ${entry} V ${edge}`;
}

function cupSideHtml(match, side, opts) {
  const entry = match.teams[side];
  // An empty seat: this box exists on the board but the match that decides who
  // sits here has not been played. Drawn as a slot waiting to be filled, which
  // is what gives the team going through somewhere to arrive.
  if (opts.filled && !opts.filled(match, side)) {
    // `vacant`, not `empty`: `.empty` is the site's empty-state block and
    // carries `padding: 30px 0`, which a seat picked up as well — three times
    // the height a row is spaced at, so the second row sat below the wire
    // pointing at it, the note line fell outside the box, and both were
    // clipped by `.cup-match`. A seat is a row of a fixed-height box and has
    // to stay one; see the note on `.cup-match`.
    return `<div class="cup-side vacant">
      <span class="who">—</span><span class="goals">–</span>
    </div>`;
  }
  const shown = opts.revealed && match.winner;
  const classes = ["cup-side"];
  if (shown) classes.push(match.winner === entry.slug ? "won" : "lost");
  // The coin toss is worth showing: a cup tie is one match, so who starts with
  // the ball is a real part of the fixture rather than an averaging detail.
  if (!shown && match.kickoff === side) classes.push("kicks");
  // The broadcast's two movement beats: the team going through, then the team
  // dropping — or, where their cup has ended, leaving the board.
  //
  // There used to be a second, older mechanism here — an `arriving` set marking
  // both teams at once — and a row could carry both classes. Two `animation`
  // shorthands on one element means one of them silently loses, and the one
  // that won held the name at `opacity: 0` through its delay. So the movement
  // played and the name it was about did not appear. One mechanism now.
  const moving = opts.moving;
  if (moving && moving.slug === entry.slug) {
    if (moving.kind === "out" && match.match_id === moving.from) classes.push("leaving");
    else if (!opts.settled) classes.push("moving");
  }
  const goals = shown && match.score ? match.score[side] : "–";
  // data-team is what the hover trace matches on: pointing at a name lights up
  // every box and every wire that name appears in, which is the one question a
  // bracket is asked most and could not previously answer.
  return `<div class="${classes.join(" ")}" data-team="${escapeHtml(entry.slug)}">
    <span class="who"><span class="seed">${entry.seed}</span>${escapeHtml(cupTeamLabel(entry))}</span>
    <span class="goals">${goals}</span>
  </div>`;
}

function cupBoxHtml(box, index, state, stagger, moving, filled, kickoffs, estimates) {
  const match = box.match;
  const revealed = index < state.revealed;
  const classes = ["cup-match"];
  if (stagger != null) classes.push("fresh");
  const receiving = moving
    && match.teams.some((team) => team.slug === moving.slug)
    && !(moving.kind === "out" && match.match_id === moving.from)
    && index >= state.revealed;
  if (receiving) classes.push("receiving");
  // The box a team is leaving for the last time. Marked so the view can follow
  // them to it, the same way it follows an arrival.
  if (moving && moving.kind === "out" && match.match_id === moving.from) {
    classes.push("parting");
  }
  // A box with an empty seat is not a fixture yet, and must not answer
  // questions about one. Naming both teams in a hover panel would say who is
  // going to win the match currently being played, which is precisely what the
  // seat being empty is there to avoid.
  const settledSeats = !filled
    || match.teams.every((_team, side) => filled(match, side));
  if (!settledSeats) classes.push("no-tip");
  if (index === state.revealed && state.playing) classes.push("playing");
  else if (index === state.revealed && state.onDeck) classes.push("on-deck");
  if (match.bracket === "final" && revealed && match.winner) classes.push("champion");
  // The arrival animation belongs on the boxes a team has just *moved into* —
  // the round ahead of them — and not on the match they played to get there,
  // nor on any earlier round they already appear in.
  const teams = match.teams.map((team) => team.slug).join(" ");
  // Rendered whether or not there is anything to say, so that a box is always
  // the height the layout spaced it as — see `.cup-match` in the stylesheet.
  //
  // Which is also what makes room for the countdown: a broadcast knows how
  // long every match takes and how long the beats between them run, so for a
  // match still to come the line that will eventually say how it was decided
  // can say when it starts instead. Only for matches *past* the one on air —
  // the current one is playing or on deck and its box says so already — and
  // only while the cup is on air, which is when `kickoffs` is there at all.
  //
  // A cup is either on air or being reviewed, never both, so one line serves
  // for either: `kickoffs` is a rundown's time of day and `estimates` this
  // page's own projection of where its timers are heading. `rough` is which,
  // and so how it is said and how often it is worth re-reading.
  const times = kickoffs || estimates;
  const rough = !kickoffs && !!estimates;
  const startsAt = index >= state.revealed && times
    ? times.get(match.match_id) : undefined;
  const said = !revealed ? ""
    : match.error ? "walkover"
    : match.decided_by && match.decided_by !== "goals" ? `on ${match.decided_by}`
    : "";
  // The match on air is the one box whose line is not a time: it is being
  // played, and "in 0m 00s" is a worse answer than saying so. Its deck beat is
  // already behind the clock, so a countdown there would sit on "kicking off"
  // for the whole two minutes.
  const note = startsAt === undefined
    ? `<div class="cup-note${match.error && revealed ? " bad" : ""}"
        >${escapeHtml(said)}</div>`
    : index === state.revealed && state.playing
      ? `<div class="cup-note when">playing now</div>`
      : `<div class="cup-note when" data-cup-at="${startsAt}"${
          rough ? " data-cup-about" : ""}
          >${escapeHtml(rough
            ? cupRoughly(startsAt, cupNow())
            : cupUntil(startsAt, cupNow()))}</div>`;
  const sideOpts = { revealed, moving, settled: index < state.revealed, filled };
  return `<div class="${classes.join(" ")}" data-match="${escapeHtml(match.match_id)}"
       data-teams="${escapeHtml(teams)}"
       style="left:${box.x}px;top:${box.y}px${
         stagger != null ? `;animation-delay:${stagger * 55}ms` : ""}">
    ${cupSideHtml(match, 0, sideOpts)}
    ${cupSideHtml(match, 1, sideOpts)}
    ${note}
  </div>`;
}

/**
 * The bracket, drawn.
 *
 * `opts.limit` draws only the rounds up to and including that index, which is
 * what makes the tree *grow* during a broadcast instead of standing there
 * mostly empty: the boxes keep the positions the full layout gave them, so
 * nothing ever moves, and the picture gets bigger as the competition reaches
 * further into it.
 *
 * `opts.fresh` names the round whose boxes and wires have only just appeared,
 * so they can be animated in. It is a round rather than "whatever is new"
 * because the markup is rebuilt wholesale on every draw — everything is new to
 * the DOM every time — so what to animate has to be decided from the state,
 * not from the DOM.
 */
function cupBracketHtml(bracket, state, opts) {
  const {
    limit = Infinity, fresh = null, moving = null, kickoffs = null,
    estimates = null,
  } = opts || {};
  const layout = cupLayout(bracket);
  const order = new Map(cupMatches(bracket).map((match, index) => [match.match_id, index]));
  const roundOf = new Map();
  const byMatchId = new Map(cupMatches(bracket).map((match) => [match.match_id, match]));
  (bracket.rounds || []).forEach((round, index) => {
    for (const match of round.matches || []) roundOf.set(match.match_id, index);
  });
  const isFresh = (matchId) => fresh !== null && roundOf.get(matchId) === fresh;

  // Which match each side of each box arrived from. `null` means they entered
  // the draw here, which is only ever the first round of the upper bracket.
  const feeder = new Map();
  const edges = cupEdges(bracket);
  for (const match of cupMatches(bracket)) {
    const seats = [null, null];
    for (const edge of edges[match.match_id] || []) seats[edge.side] = order.get(edge.from);
    feeder.set(match.match_id, seats);
  }
  // A seat is filled once the match that feeds it has been played. This is
  // what stops a derived bracket claiming a pairing it cannot know yet: the
  // teams in a later box are only *there* because of results, so before those
  // results the seat is empty, exactly as it would be on a bracket being
  // filled in by hand.
  const filled = (match, side) => {
    const at = (feeder.get(match.match_id) || [])[side];
    return at == null || at < state.revealed;
  };
  // Drawn once the round is in play, or once either seat has somebody in it —
  // so a team going through has a box to go through *into*, and the box fills
  // one seat at a time as its two feeders finish.
  const drawn = (matchId) => {
    const match = byMatchId.get(matchId);
    if (!match) return false;
    if ((roundOf.get(matchId) ?? 0) <= limit) return true;
    return match.teams.some((_team, side) => filled(match, side));
  };

  // A wire is drawn solid once the match it *leaves* has been played, because
  // that is the moment anybody knows who took it. Before then the shape of the
  // bracket is still worth seeing — it says what is coming — but drawn faint,
  // since a solid line out of a box with no result in it reads as one.
  const wires = layout.wires.filter((wire) => {
    if (!drawn(wire.into)) return false;
    const target = byMatchId.get(wire.into);
    return !target || filled(target, wire.side);
  }).flatMap((wire) => {
    const settled = (order.get(wire.from_id) ?? Infinity) < state.revealed;
    const classes = ["cup-wire", wire.kind, settled ? "settled" : "pending"];
    if (isFresh(wire.into)) classes.push("fresh");
    const travelling = moving && wire.slug === moving.slug && wire.from_id === moving.from;
    if (travelling) classes.push("moving");
    const d = cupWirePath(wire.from, wire.to, wire.fromSide, wire.side, wire.turn);
    const path = `<path class="${classes.join(" ")}" pathLength="1"
      data-team="${escapeHtml(wire.slug)}" d="${d}"
      ${wire.kind === "dropped" ? 'marker-end="url(#cup-arrow)"' : ""} />`;
    // A second path over the first, carrying one short dash that runs the
    // length of it: the team visibly travelling from the box they left to the
    // box they arrived in. Cheaper and steadier than moving a real element
    // along a path, and it needs no measurement — `pathLength="1"` makes one
    // rule fit every wire in the bracket however long it is.
    if (!travelling) return [path];
    return [path, `<path class="cup-spark" pathLength="1" d="${d}" />`];
  }).join("");

  const boxesDrawn = layout.boxes.filter((box) => drawn(box.match.match_id));

  /* Teams in a bracket that has no box for them yet.
   *
   * A cup on air is drawn from the rounds that are on disk, and the lower
   * round a beaten team drops into is not handed out until the upper round
   * above it has finished (`cup.Bracket._hand_out`, and the bracket is written
   * a round at a time by `pipeline.run_cup`). So for the whole of an upper
   * round there was nowhere for the movement beat to land: the team that had
   * just lost left the board and came back much later, when the rest of the
   * round had been played — which is exactly what it looked like from the
   * sofa, a result applied to nothing.
   *
   * A chip in the section's band says the true thing instead. They are in the
   * lower bracket; who they play is a question the draw has not answered yet.
   * The same hole is on the other side — a team going through has no box
   * either until the next upper round is drawn — so both sections get it.
   *
   * Never anything on a cup being reviewed: every round is on disk, so every
   * team still in it has a box and this comes out empty.
   */
  const standing = cupStateAfter(bracket, state.revealed);
  // A seat in a box that is drawn and *not yet played* is where a team's next
  // fixture is. Their played boxes do not count: the whole question here is
  // whether the bracket can say what they do next.
  const seatedAhead = new Set();
  for (const box of boxesDrawn) {
    if ((order.get(box.match.match_id) ?? 0) < state.revealed) continue;
    box.match.teams.forEach((team, side) => {
      if (filled(box.match, side)) seatedAhead.add(team.slug);
    });
  }
  const waiting = layout.sections.filter(
    (section) => section.key !== "final" && section.chipAt != null,
  ).flatMap((section) => {
    const pool = section.key === "upper" ? standing.upper : standing.lower;
    const held = [...pool].filter((slug) => !seatedAhead.has(slug))
      .map((slug) => cupEntry(bracket, slug))
      .sort((a, b) => a.seed - b.seed);
    if (!held.length) return [];
    // At the column the round they are waiting for will occupy, which is the
    // one after the last round this section has drawn. So the queue for a draw
    // sits where the draw is going to appear, and the chips are replaced by
    // the boxes they were standing in for.
    const x = section.rounds.length * (CUP_BOX_W + CUP_COL_GAP);
    const chips = held.map((entry) => {
      const classes = ["cup-wait"];
      if (moving && moving.slug === entry.slug) classes.push("moving");
      return `<span class="${classes.join(" ")}" data-team="${escapeHtml(entry.slug)}"
        ><span class="seed">${entry.seed}</span>${escapeHtml(cupTeamLabel(entry))}</span>`;
    }).join("");
    return [{
      key: section.key,
      x,
      // Enough room for the row in the tree's declared width, generously: a
      // twenty-character name at this size is about 130px and the label on the
      // end is another 150. Over-estimating costs a little empty scroll;
      // under-estimating paints the row outside the box the scroller knows
      // about, where it is simply cut off.
      width: held.length * 136 + 160,
      html: `<div class="cup-waiting ${section.key}"
        style="left:${x}px;top:${section.chipAt}px">${chips}<span
        class="cup-wait said">waiting on the draw</span></div>`,
    }];
  });

  // A section's name appears with its first box, not before it: an empty
  // "Lower bracket" heading over nothing is a promise the tree has not kept
  // yet. A section holding only teams waiting on a draw has kept it — that is
  // where those teams are — so it is named too.
  const reached = new Set(boxesDrawn.map((box) => box.match.bracket));
  for (const item of waiting) reached.add(item.key);
  const labels = layout.sections.filter((section) => reached.has(section.key))
    .map((section) => {
      const x = section.key === "final" ? layout.width - CUP_BOX_W : 0;
      return `<div class="cup-section-label ${section.key}"
        style="left:${x}px;top:${section.labelAt}px">${escapeHtml(section.title)}</div>`;
    }).join("");

  // Byes go in the band their section reserved for them, at their round's own
  // column — not above the round's first box, which is the last box of the
  // round above it.
  const byes = layout.sections.flatMap((section) => (
    section.rounds.flatMap((round) => {
      if (!round.bye || section.chipAt == null) return [];
      const first = (round.matches || [])[0];
      if (!first || !drawn(first.match_id)) return [];
      const box = layout.boxes.find((item) => item.match.match_id === first.match_id);
      if (!box) return [];
      return [`<div class="cup-bye" style="left:${box.x}px;top:${section.chipAt}px">
        ${escapeHtml(cupTeamLabel(round.bye))} · bye</div>`];
    })
  )).join("");

  const boxes = boxesDrawn
    .map((box, index) => cupBoxHtml(
      box, order.get(box.match.match_id), state,
      // Staggered, so a round of ten arrives as a run of boxes rather than as
      // ten boxes appearing at once.
      isFresh(box.match.match_id) ? index % 12 : null,
      moving,
      filled,
      kickoffs,
      estimates,
    ))
    .join("");

  // Sized to what is drawn rather than to the whole competition, which is what
  // makes the tree visibly grow. The boxes keep their full-layout positions,
  // so growing never moves one.
  //
  // The waiting chips count towards it as well. A lower bracket that holds
  // nothing else is the whole of what is drawn down there, and a tree sized
  // only to its boxes would clip the one row that says where those teams are.
  const rights = boxesDrawn.map((box) => box.x + CUP_BOX_W)
    .concat(waiting.map((item) => item.x + item.width));
  const bottoms = boxesDrawn.map((box) => box.y + CUP_BOX_H)
    .concat(layout.sections.filter((section) => reached.has(section.key))
      .map((section) => (section.chipAt == null ? 0 : section.chipAt + CUP_CHIP_H)));
  const width = rights.length ? Math.max(...rights) : layout.width;
  const height = bottoms.length ? Math.max(...bottoms) + 8 : layout.height;

  return `<div class="cup-scroll"><div class="cup-tree"
      style="width:${width}px;height:${height}px">
    <svg class="cup-wires" width="${width}" height="${height}"
         aria-hidden="true">
      <defs>
        <marker id="cup-arrow" viewBox="0 0 8 8" refX="7" refY="4"
                markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1 L 7 4 L 0 7 z" fill="var(--team-b)" />
        </marker>
      </defs>
      ${wires}
    </svg>
    <div class="cup-boxes">${boxes}${byes}${
      waiting.map((item) => item.html).join("")}${labels}</div>
  </div></div>
  <p class="small muted" style="margin:10px 0 0">
    A solid line is a team going through; a dashed one with an arrow is a team
    dropping from the upper bracket into the lower. Each line leaves and
    arrives on its own team's row, so it can be followed. A yellow dot marks
    whoever the coin toss gave the kickoff to, and scores appear once the match
    has been played out.
  </p>`;
}

// ---------------------------------------------------------------------------
// Reading the bracket with a pointer
//
// Two questions a drawn bracket gets asked that a static picture cannot
// answer, both attached to hover because both are "tell me about this one"
// rather than "take me somewhere".
//
// Pointing at a **name** traces that team's whole run: every box they appear
// in and every wire that carries them, with the rest of the tree dimmed. In a
// double-elimination draw of twenty teams that is the only practical way to
// see how somebody got where they are.
//
// Pointing at a **box** opens that tie's numbers. A cup match is a single
// match, so it can be lost by a team that had the better of it — and where a
// level tie was settled on shots or possession, the number it was settled on
// is the one thing a reader is owed.
// ---------------------------------------------------------------------------

/** Which of a team's boxes and wires make up their run. Pure, so it is testable. */
function cupTrace(bracket, slug) {
  const matches = new Set();
  for (const match of cupMatches(bracket)) {
    if (match.teams.some((team) => team.slug === slug)) matches.add(match.match_id);
  }
  return matches;
}

function cupStatsHtml(bracket, match, revealed) {
  const [left, right] = match.teams;
  const name = (entry) => escapeHtml(cupTeamLabel(entry));
  // The two teams are stacked, each with its own score, rather than set either
  // side of a scoreline. Names here run past twenty characters — and the next
  // intake's may run further — so any width chosen for two of them side by side
  // is a width that breaks later. A row per team cannot overflow at any length,
  // and it is the same top-to-bottom order the match box itself uses, which is
  // what makes the left and right columns of the statistics below it readable
  // without labelling them.
  const seat = (entry, side) => `<div class="cup-tip-seat${
    revealed && match.winner === entry.slug ? " won" : ""}">
      <span class="who"><span class="seed">${entry.seed}</span>${name(entry)}</span>
      <span class="goals">${revealed && match.score ? match.score[side] : "–"}</span>
    </div>`;
  const head = `<div class="cup-tip-round">${escapeHtml(match.label)}</div>
    ${seat(left, 0)}${seat(right, 1)}`;
  const lines = [];
  if (!revealed) {
    // Everything about the fixture, and nothing about the result: during a
    // broadcast the box two columns along must not answer the match being
    // watched.
    lines.push(`<div class="cup-tip-note">Not played yet · seeds
      ${left.seed} and ${right.seed} · ${name(match.teams[match.kickoff])} kicks off</div>`);
    return head + lines.join("");
  }
  if (match.error) {
    lines.push(`<div class="cup-tip-note bad">Walkover — ${escapeHtml(match.error)}</div>`);
  } else if (match.decided_by && match.decided_by !== "goals") {
    lines.push(`<div class="cup-tip-note">Level after ninety;
      ${escapeHtml(match.decided_by)} decided it</div>`);
  }
  lines.push(`<div class="cup-tip-note">Seeds ${left.seed} and ${right.seed} ·
    ${name(match.teams[match.kickoff])} won the toss</div>`);
  const stats = match.stats;
  if (stats && stats.length === 2) {
    const rows = CUP_STAT_LABELS.filter(
      ([key]) => stats[0][key] != null || stats[1][key] != null,
    ).map(([key, label, unit]) => {
      const show = (value) => (value == null ? "–" : `${value}${unit || ""}`);
      const mine = stats[0][key];
      const theirs = stats[1][key];
      const best = mine == null || theirs == null ? -1 : (mine > theirs ? 0 : mine < theirs ? 1 : -1);
      return `<tr>
        <td class="n${best === 0 ? " lead" : ""}">${show(mine)}</td>
        <th>${escapeHtml(label)}</th>
        <td class="n${best === 1 ? " lead" : ""}">${show(theirs)}</td>
      </tr>`;
    }).join("");
    if (rows) lines.push(`<table class="cup-tip-stats"><tbody>${rows}</tbody></table>`);
  } else {
    lines.push('<div class="cup-tip-note">No statistics recorded for this tie.</div>');
  }
  return head + lines.join("");
}

//: Must agree with `cup.MATCH_STATISTICS`, which decides what is kept. A key
//: missing from a bracket — one written before that field was recorded — drops
//: its row rather than showing a blank one.
const CUP_STAT_LABELS = [
  ["shots", "Shots", ""],
  ["possession", "Possession", "%"],
  ["territory", "Territory", "%"],
  ["passes", "Passes completed", ""],
  ["tackles", "Tackles won", ""],
  ["dribbles", "Dribbles", ""],
  ["fouls", "Fouls", ""],
];

/**
 * Wires the hover behaviour onto a freshly drawn bracket.
 *
 * Called after every draw, because every draw replaces the markup — there is
 * nothing left of the previous one to have listeners on. The listeners go on
 * the tree rather than on each of a hundred-odd boxes and wires.
 */
function bindCupBracket(container, bracket, state) {
  const tree = container.querySelector(".cup-tree");
  if (!tree) return;
  const byId = new Map(cupMatches(bracket).map((match) => [match.match_id, match]));
  const order = new Map(cupMatches(bracket).map((match, index) => [match.match_id, index]));
  const tip = document.createElement("div");
  tip.className = "cup-tip";
  tip.hidden = true;
  tree.appendChild(tip);

  let traced = null;
  function trace(slug) {
    if (slug === traced) return;
    traced = slug;
    tree.classList.toggle("tracing", !!slug);
    // Every box and every wire is checked rather than selected by attribute,
    // because a slug is not guaranteed to be a safe CSS selector and building
    // one out of a name is how injection bugs start.
    for (const node of tree.querySelectorAll("[data-team], [data-teams]")) {
      const list = (node.getAttribute("data-teams")
        || node.getAttribute("data-team") || "").split(" ");
      node.classList.toggle("traced", !!slug && list.indexOf(slug) >= 0);
    }
  }

  let tipFor = null;
  function showTip(box) {
    const id = box.getAttribute("data-match");
    if (id === tipFor) return;
    const match = byId.get(id);
    if (!match) return;
    tipFor = id;
    tip.innerHTML = cupStatsHtml(bracket, match, (order.get(id) ?? 0) < state.revealed);
    tip.hidden = false;
    // Placed from the box's own coordinates, which are already in the tree's
    // space — no measuring of the page, and correct however the bracket is
    // scrolled. Flipped to the left of the box when there is no room right.
    const left = parseFloat(box.style.left) || 0;
    const top = parseFloat(box.style.top) || 0;
    const width = tip.offsetWidth || 240;
    const room = (parseFloat(tree.style.width) || 0) - (left + CUP_BOX_W + 12);
    tip.style.left = `${room >= width ? left + CUP_BOX_W + 12 : Math.max(left - width - 12, 0)}px`;
    const height = tip.offsetHeight || 180;
    const limit = (parseFloat(tree.style.height) || 0) - height;
    tip.style.top = `${Math.max(Math.min(top, limit), 0)}px`;
  }

  function hideTip() {
    tipFor = null;
    tip.hidden = true;
  }

  tree.addEventListener("mouseover", (event) => {
    const node = event.target;
    // A chip in a section's band names a team the same way a row in a box
    // does, so it answers the same question when it is pointed at.
    const side = node.closest
      ? (node.closest(".cup-side") || node.closest(".cup-wait[data-team]")) : null;
    const box = node.closest ? node.closest(".cup-match") : null;
    trace(side ? side.getAttribute("data-team") : null);
    // `no-tip` is a box whose two teams are not both known yet — see
    // `cupBoxHtml`. There is nothing to say about it that would not be a
    // spoiler for a match still being played.
    if (box && !box.classList.contains("no-tip")) showTip(box);
    else hideTip();
  });
  tree.addEventListener("mouseleave", () => { trace(null); hideTip(); });
}

function cupStandingHtml(bracket, state) {
  const placings = bracket.placings || [];
  if (!state.finished || !placings.length) return "";
  const rows = placings.map((row) => {
    const entry = cupEntry(bracket, row.slug);
    const record = cupRecord(bracket, row.slug, state.total);
    return `<tr>
      <td class="n">${row.place}</td>
      <td>${escapeHtml(cupTeamLabel(entry))}</td>
      <td class="n">${entry.seed}</td>
      <td class="n">${record.played}</td>
      <td class="n">${record.won}–${record.lost}</td>
      <td class="n">${record.for}–${record.against}</td>
      <td class="small">${escapeHtml(record.out_in || "won the cup")}</td>
    </tr>`;
  }).join("");
  return `<div class="card">
    <h3>Final placings</h3>
    <div class="scroll"><table>
      <thead><tr>
        <th class="n">Place</th><th>Team</th><th class="n">Seed</th><th class="n">Played</th>
        <th class="n">W–L</th><th class="n">Goals</th><th>Out in</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
    <p class="small muted" style="margin:10px 0 0">
      Two teams knocked out in the same round share a place: there was nothing
      between them, and ordering them would report a match that was never played.
    </p>
  </div>`;
}

// ---------------------------------------------------------------------------
// The front page
// ---------------------------------------------------------------------------

/**
 * When the next cup is due, as an instant rather than as a reading of a clock.
 *
 * `next_kickoff_ms` is the authority and the ISO string is the fallback, for
 * one reason: the string used to go out naive — "2026-09-20T19:00:00", no
 * offset — and `new Date` reads that as seven o'clock *here*. On a server
 * keeping UTC that is a countdown which reaches zero two hours before the cup
 * it is counting to, sits on "kicking off", and never becomes a broadcast.
 * The string now carries its offset too, so the fallback is sound; the number
 * is preferred because it cannot be misread by a browser at all.
 *
 * Null when nothing is scheduled, which the callers already draw as a dash.
 */
function cupDue(data) {
  if (!data) return null;
  if (typeof data.next_kickoff_ms === "number") return new Date(data.next_kickoff_ms);
  return data.next_kickoff ? new Date(data.next_kickoff) : null;
}

/**
 * "Sunday 7 September, 19:00" — a date somebody can act on, rather than an
 * ISO timestamp.
 */
function cupWhen(when) {
  try {
    return when.toLocaleString(undefined, {
      weekday: "long", day: "numeric", month: "long",
      hour: "2-digit", minute: "2-digit",
    });
  } catch (_) {
    return when.toISOString();
  }
}

/**
 * How long until the next cup, as a line that ticks.
 *
 * Days and hours while it is far off, seconds only in the last hour — a
 * counter reading "6d 04:11:57" spends most of its life redrawing a digit
 * nobody is watching, and the last minute is the one time the seconds are the
 * point.
 */
function cupCountdown(due, now) {
  const left = Math.max(0, Math.floor((due - now) / 1000));
  if (!left) return "kicking off";
  const days = Math.floor(left / 86400);
  const hours = Math.floor((left % 86400) / 3600);
  const minutes = Math.floor((left % 3600) / 60);
  const seconds = left % 60;
  const pad = (value) => String(value).padStart(2, "0");
  if (days) return `${days}d ${hours}h ${pad(minutes)}m`;
  if (hours) return `${hours}h ${pad(minutes)}m ${pad(seconds)}s`;
  return `${minutes}m ${pad(seconds)}s`;
}

/**
 * What the cup is, in the two lines somebody reads before anything else.
 *
 * Held in one place because the tab has two shapes — a cup on the board, and
 * a countdown to the first one — and a competition that described itself
 * differently depending on whether it had been played yet would read as two
 * different competitions.
 *
 * The last sentence is the one that matters most and was missing: a knockout
 * drawn from the league table, sitting on a site that marks coursework, looks
 * like it counts for something unless it says it does not.
 */
const CUP_LEDE = `Division One, drawn into a double-elimination knockout and
  played out every Sunday evening: one match a tie, kickoff on a coin toss,
  and two defeats and you are out. It counts for nothing — not towards your
  mark, not towards the league table. It is played for the fun of it, and for
  a week's bragging rights until the next one.`;

function cupWinnerHtml(bracket, slug, revealed, opts) {
  const entry = cupEntry(bracket, slug);
  const record = cupRecord(bracket, slug, revealed);
  const when = (opts || {}).when;
  return `<div class="cup-winner">
    <img class="trophy" src="assets/badge-weekly-cup-champion.png" alt="">
    <div class="cup-winner-copy">
      <div class="eyebrow">${escapeHtml((opts || {}).eyebrow || "Cup winners")}</div>
      <div class="who">${escapeHtml(cupTeamLabel(entry))}</div>
      <div class="small muted">
        Seeded ${entry.seed} · ${record.won} won, ${record.lost} lost ·
        ${record.for} scored, ${record.against} conceded${when ? ` · ${escapeHtml(when)}` : ""}
      </div>
    </div>
  </div>`;
}

/**
 * The list of cups already played, newest first.
 *
 * Each names its winner, which comes off the run manifest rather than out of
 * its bracket — so this costs one request however many cups there have been.
 */
/**
 * One reading of a cup's audience — "peak 34 · 112 watched" — or nothing.
 *
 * Nothing rather than zeroes when the figures are absent, because a scope with
 * no peak and no total is a cup nobody watched *in that window*, and a cup
 * played before any of this was recorded is a different claim. `cupAudienceHtml`
 * tells those two apart; this only formats what it is handed.
 *
 * `capped` marks a total that stopped rising at the room's bound, so the number
 * is a floor. Said with a "+" rather than a footnote: it is the same shape as
 * every other "at least this many" on a page and needs no explaining.
 */
function cupTallyHtml(label, counts) {
  if (!counts) return "";
  const total = `${counts.total}${counts.capped ? "+" : ""}`;
  return `<span class="tally">
    <span class="scope">${escapeHtml(label)}</span>
    peak ${counts.peak} · ${total} watched
  </span>`;
}

/**
 * How many people watched one cup, as the two readings the room keeps.
 *
 * `on air` is the broadcast window and is the figure two Sundays can be
 * compared on; `all time` adds everybody who has reviewed the cup since. The
 * second line is drawn only when it says something the first does not, which
 * for a cup nobody has gone back to is never — and a history list that printed
 * the same pair of numbers twice on every row would teach people to stop
 * reading both.
 *
 * A cup with no record at all says so. Every cup played before this was
 * written is one, and so is one played while the site was down; "nobody
 * watched" would be a different and false claim. See `RunView.audience`.
 */
function cupAudienceHtml(run) {
  const seen = run.audience;
  if (!seen || (!seen.live && !seen.all)) {
    return '<span class="tally none">audience not recorded</span>';
  }
  const live = seen.live || null;
  const all = seen.all || null;
  // A missing on-air figure is not a nought. Every cup played before any of
  // this was written has one, and the first person to review one of them would
  // otherwise give it a broadcast nobody attended. See `record_audience`.
  const onAir = live
    ? cupTallyHtml("on air", live)
    : '<span class="tally none"><span class="scope">on air</span>not recorded</span>';
  const same = live && all
    && live.peak === all.peak && live.total === all.total;
  return onAir + (same ? "" : cupTallyHtml("all time", all));
}

function cupHistoryHtml(cups, current) {
  const rows = cups.map((run) => {
    const on = run.run_id === current;
    // The name the run recorded, not the slug prettified: a team is spelled
    // one way across the whole site or it looks like two teams.
    const champion = run.champion
      ? escapeHtml(watchTeamLabel(run.champion_name || run.champion))
      : run.status === "running" ? "being played now" : "no winner recorded";
    return `<div class="cup-past${on ? " on" : ""}" data-run="${escapeHtml(run.run_id)}">
      <div class="cup-past-head">
        <span class="when">${escapeHtml(cupRunDate(run.run_id))}</span>
        <span class="who">${champion}</span>
        ${on ? '<span class="tagged">showing</span>' : ""}
      </div>
      <div class="cup-past-tally">${cupAudienceHtml(run)}</div>
    </div>`;
  }).join("");
  return `<div class="card">
    <h3>${plural(cups.length, "cup")} played</h3>
    <div class="cup-past-list">${rows}</div>
  </div>`;
}

// A cup's run id is `cup-<date>`, so its date is in its name. Printed rather
// than the raw id because "Sunday 6 September" is what somebody is looking for
// and `cup-2026-09-06` is not.
function cupRunDate(runId) {
  const match = /^cup-(\d{4})-(\d{2})-(\d{2})/.exec(runId || "");
  if (!match) return runId || "";
  const when = new Date(Number(match[1]), Number(match[2]) - 1, Number(match[3]));
  try {
    return when.toLocaleDateString(undefined, {
      weekday: "long", day: "numeric", month: "long", year: "numeric",
    });
  } catch (_) {
    return runId;
  }
}

// ---------------------------------------------------------------------------
// The password, for a cup that is published but not advertised
// ---------------------------------------------------------------------------

// sessionStorage rather than localStorage: the point of the password is that
// the competition is not ready to be seen, and a browser that remembers it
// across days is a browser that shows an unfinished bracket to whoever opens
// it next on a shared machine. Closing the tab forgets it.
//
// It is never rendered back into the page, and never put in a URL — see
// `CUP_PASSWORD_HEADER`.
const CUP_KEY = "cup-password";

function cupPassword() {
  try {
    return sessionStorage.getItem(CUP_KEY) || "";
  } catch (_) {
    // A browser with site data blocked. The password then lives for one
    // render, which still works — it is asked for again on the next.
    return cupPassword.held || "";
  }
}

// ---------------------------------------------------------------------------
// The crowd
// ---------------------------------------------------------------------------
//
// Two live facts about a cup that are not on disk: how many people have it
// open, and what they are throwing at the screen. Both come from one endpoint
// (`api/cup/live`) which touches no files, and being asked is the whole of how
// a viewer is counted — there is no join and no leave, so a closed tab, a flat
// battery and a walk out of wifi all look the same, which is what "watching
// now" should mean. See `evaluator.room`.

// How often a broadcast asks. Fast enough that a cheer lands while the thing
// being cheered is still on screen, and cheap enough to leave running for an
// hour and a half: the reply is a few hundred bytes.
const CUP_ROOM_POLL_MS = 3000;
// And how often the cup *tab* asks, which only wants the number.
const CUP_TAB_ROOM_POLL_MS = 10000;
// The most reactions on screen at once. A goal in a full hall arrives as a
// burst, and the frame rate matters more than the last few of them.
const CUP_CROWD_MAX = 26;

const VIEWER_KEY = "cup-viewer";

/**
 * This browser's identifier, as far as the room is concerned.
 *
 * Not an account and not a person: it exists so that one browser is counted
 * once however often it polls, and can be held to a cooldown. It is never
 * shown to anybody, never written to disk by the server, and is not sent
 * anywhere else. `localStorage` rather than `sessionStorage` so that two tabs
 * on the same machine are one viewer, which is what "how many people are
 * watching" means; a browser with storage blocked gets one that lasts as long
 * as the page, and is then simply counted as somebody.
 */
function cupViewer() {
  const make = () => {
    const bytes = new Uint8Array(12);
    (window.crypto || {}).getRandomValues
      ? window.crypto.getRandomValues(bytes)
      : bytes.forEach((_, index) => { bytes[index] = Math.floor(Math.random() * 256); });
    return Array.from(bytes, (byte) => byte.toString(36).padStart(2, "0")).join("").slice(0, 24);
  };
  try {
    let id = localStorage.getItem(VIEWER_KEY);
    if (!id) {
      id = make();
      localStorage.setItem(VIEWER_KEY, id);
    }
    return id;
  } catch (_) {
    return cupViewer.held || (cupViewer.held = make());
  }
}

/** The password header a cup request needs, or null when the cup is open. */
function cupHeaders() {
  return cupAccess() === "locked" ? { [CUP_PASSWORD_HEADER]: cupPassword() } : null;
}

/** "12 watching", or nothing at all when nobody else is there to say it of. */
function watchingText(count) {
  const people = Number(count) || 0;
  if (people < 1) return "";
  return people === 1 ? "1 watching" : `${people} watching`;
}

/**
 * Whether this browser can draw *every* glyph in the roster.
 *
 * Asked because the answer is sometimes no, and the machine it is no on is
 * often the one that matters: a lab box or a media player driving a screen at
 * the front of a room can have no emoji font installed, and a reaction then
 * rises up the frame as an empty rectangle. There is no font query in CSS for
 * this, so it is measured — each glyph is drawn to a canvas beside a codepoint
 * no font can have, and a glyph that leaves the same marks as that one is the
 * missing-glyph box rather than anything anybody can read.
 *
 * Every glyph and not a sample of one, because font coverage is patchy in
 * exactly this range: DejaVu alone will draw a face and none of the rest. And
 * all-or-nothing, because a bar of five pictures and three words looks like a
 * page that is half broken, while eight words look like a decision.
 *
 * The reactions that are phrases are not asked about. They are words on every
 * machine by design, so a font that cannot draw a snail says nothing about
 * them, and letting them into this vote would mean asking whether a browser
 * can render the letter N.
 */
let glyphInk = null;
function canDrawGlyphs(roster) {
  if (glyphInk !== null) return glyphInk;
  glyphInk = true;
  try {
    const canvas = document.createElement("canvas");
    canvas.width = 28;
    canvas.height = 28;
    const ctx = canvas.getContext("2d", { willReadFrequently: true });
    if (!ctx) return glyphInk;
    const ink = (text) => {
      ctx.clearRect(0, 0, 28, 28);
      ctx.font = '20px "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif';
      ctx.fillStyle = "#fff";
      ctx.fillText(text, 1, 22);
      return ctx.getImageData(0, 0, 28, 28).data.join(",");
    };
    // U+FFFF is permanently unassigned, so whatever it draws is this
    // browser's missing-glyph box and nothing else.
    const missing = ink("\uFFFF");
    glyphInk = (roster || [])
      .filter((item) => !item.phrase)
      .every((item) => item.glyph && ink(item.glyph) !== missing);
  } catch (_) {
    // A browser that will not give up a canvas — keep the glyphs, which is
    // the right guess for anything modern enough to be reading this page.
    glyphInk = true;
  }
  return glyphInk;
}

/**
 * The shortest thing that still says which reaction this is.
 *
 * The id, which is already a word — `goal`, `bug`, `snail` — rather than the
 * first word of the label, which is how you end up with a bar reading "WELL"
 * and "DIDN'T". The label stays on the button as its title and its accessible
 * name, where there is room for a sentence.
 *
 * Only ever asked about a picture. A reaction that is a phrase says itself.
 */
function emoticonWord(item) {
  return String((item && item.id) || "").replace(/[-_]+/g, " ") || "sent";
}

/**
 * Joins the room for one cup.
 *
 * Three jobs, and a caller can ask for any of them by passing the element it
 * wants filled: count this browser in (`countEl`), show what the crowd is
 * saying (`crowdEl`), and offer the bar that says something (`reactEl`). The
 * cup tab wants only the first; a broadcast wants all three.
 *
 * One cooldown covers the whole bar, because it is one per person and not one
 * per emoticon, and it is applied here *before* the request goes out — a
 * held-down key must stop at this page and not become a request per frame
 * that the server then has to refuse. What comes back is trusted over that
 * guess, since the server's cooldown is the real one.
 */
function cupRoom(options) {
  const viewer = cupViewer();
  const roster = options.roster || [];
  const known = new Map(roster.map((item) => [item.id, item]));
  // Reactions this browser sent and has already put on screen, so the poll
  // that brings them back does not show them twice.
  const mine = new Set();
  let since = 0;
  // Whether the first poll has been answered. A page that has just opened is
  // told the whole retained feed, because it has to ask from somewhere and
  // "somewhere" is sequence zero — but a screen joining a broadcast should
  // start at the present moment, not have sixty reactions from the last three
  // minutes arrive in one burst. So the first answer sets the cursor and
  // draws nothing.
  let joined = false;
  let cooling = false;
  let coolTimer = 0;
  let note = null;

  function setCount(count) {
    if (options.countEl) options.countEl.textContent = watchingText(count);
  }

  function spawn(reaction) {
    const layer = options.crowdEl;
    const item = known.get(reaction && reaction.emoticon);
    // An id this page does not know is not drawn. The server sends the roster
    // with the cup, so this is only reachable if one is retired mid-broadcast.
    if (!layer || !item) return;
    while (layer.childElementCount >= CUP_CROWD_MAX && layer.firstElementChild) {
      layer.firstElementChild.remove();
    }
    const node = document.createElement("span");
    if (item.art) {
      const art = document.createElement("img");
      art.src = `assets/${item.art}`;
      art.alt = "";
      node.appendChild(art);
    } else if (item.phrase) {
      // Words because that is what this reaction is, not because the machine
      // could not draw it — so it is styled as a phrase and never falls back
      // to an id. The text comes from the roster the server sent.
      node.className = "as-text as-phrase";
      node.textContent = item.phrase;
    } else if (canDrawGlyphs(roster)) {
      node.textContent = item.glyph;
    } else {
      node.className = "as-text";
      node.textContent = emoticonWord(item);
    }
    const drift = Number(reaction.offset) || 0;
    node.style[reaction.side === "right" ? "right" : "left"] = `${(1.5 + drift * 7).toFixed(2)}%`;
    node.style.bottom = `${(7 + drift * 44).toFixed(2)}%`;
    node.addEventListener("animationend", () => node.remove());
    layer.appendChild(node);
  }

  function cool(ms) {
    cooling = true;
    if (options.reactEl) options.reactEl.classList.add("cooling");
    clearTimeout(coolTimer);
    coolTimer = setTimeout(() => {
      cooling = false;
      if (options.reactEl) options.reactEl.classList.remove("cooling");
      if (note) note.textContent = "";
    }, Math.max(250, Number(ms) || 0));
  }

  async function send(id) {
    if (cooling || !known.has(id)) return;
    cool(options.cooldownMs || 3000);
    const reply = await postJson(
      "api/cup/react", { run: options.run, viewer, emoticon: id }, cupHeaders(),
    ).catch(() => null);
    if (reply && reply.ok && reply.reaction) {
      // On screen at once rather than on the next poll: the whole point is
      // that it lands while what it is about is still happening.
      mine.add(reply.reaction.seq);
      if (mine.size > 8) mine.clear();
      spawn(reply.reaction);
      setCount(reply.watching);
      cool(reply.cooldown_ms || 3000);
    } else if (reply && reply.reason === "busy") {
      cool(reply.retry_ms || 1000);
      if (note) note.textContent = "everyone at once — try again";
    } else if (reply && reply.retry_ms) {
      cool(reply.retry_ms);
    }
  }

  function drawBar() {
    if (!options.reactEl || !roster.length) return;
    options.reactEl.hidden = false;
    const words = !canDrawGlyphs(roster);
    // The rail is a width reserved out of the match (see `--react-rail`), so
    // whoever knows what is going in it has to say how wide it must be:
    // "heartbreak" does not fit in the width eight pictures need. A roster
    // with a phrase in it needs that width whatever the fonts can draw, since
    // one button reading "This is Soccer League!" sets the column on its own.
    const wide = words || roster.some((item) => item.phrase);
    options.reactEl.classList.toggle("as-words", wide);
    document.body.dataset.rail = wide ? "words" : "glyphs";
    fitRow();
    options.reactEl.innerHTML = roster.map((item, index) => {
      // A phrase says itself; anything else is words only where the glyph
      // cannot be drawn.
      const text = item.phrase || (words ? emoticonWord(item) : "");
      // Only the first nine are on the number keys, so only those nine say so
      // — a tooltip promising a key that does nothing is worse than no
      // tooltip. See the `[1-9]` handler on the broadcast.
      const key = index < 9 ? ` · press ${index + 1}` : "";
      // `as-phrase` so a phrase can keep its own capitalisation; `as-text` on
      // both so the two share everything else about being words.
      const kind = item.art || !text ? "" : (item.phrase ? "as-text as-phrase" : "as-text");
      return `
      <button type="button" data-emoticon="${escapeHtml(item.id)}"
        class="${kind}"
        title="${escapeHtml(item.label)}${key}"
        aria-label="${escapeHtml(item.label)}">${
          item.art
            ? `<img src="assets/${escapeHtml(item.art)}" alt="">`
            : escapeHtml(text || item.glyph)
        }</button>`;
    }).join("") + `<span class="react-note"></span>`;
    note = options.reactEl.querySelector(".react-note");
    for (const button of options.reactEl.querySelectorAll("button")) {
      button.onclick = () => send(button.dataset.emoticon);
    }
  }

  /**
   * Reserves the height a bar laid out as a row needs.
   *
   * The rail's width is a constant the CSS can hold, because a column of
   * eight is as tall as it is whatever the window does. A row is not: it
   * wraps, so its height is a fact about this window and this roster, and the
   * only honest way to know it is to measure it. Reserved rather than
   * overlaid for the same reason as the rail — a bar over the pitch is the
   * thing being avoided, and a margin that happens to be there is not a
   * guarantee.
   */
  function fitRow() {
    if (!options.reactEl || !roster.length) return;
    const row = getComputedStyle(options.reactEl).flexDirection === "row";
    const height = Math.ceil(options.reactEl.getBoundingClientRect().height);
    document.documentElement.style.setProperty(
      "--react-row", row ? `${height}px` : "0px");
  }

  async function poll() {
    try {
      const live = await api(
        "api/cup/live",
        { run: options.run, viewer, since: String(since) },
        cupHeaders(),
      );
      since = live.seq || since;
      setCount(live.watching);
      if (!joined) {
        joined = true;
        return;
      }
      for (const reaction of live.reactions || []) {
        if (mine.has(reaction.seq)) {
          mine.delete(reaction.seq);
          continue;
        }
        spawn(reaction);
      }
    } catch (_) {
      // The room is decoration on a broadcast that works without it, so a
      // failed poll leaves the last count on screen and tries again.
    }
  }

  drawBar();
  poll();
  const timer = setInterval(poll, options.intervalMs || CUP_ROOM_POLL_MS);
  // Re-measured whenever the bar's own box changes, which is the only thing
  // that can make the reservation wrong: a rotated phone, a resized window,
  // or simply the first layout after `drawBar` settling on a different height
  // than it had at the instant it was asked. Watching the element says "when
  // it changes" exactly; a resize listener only guesses at when that is.
  // Only where there is a bar to watch. The cup tab asks for a count and
  // nothing else, and `observe(undefined)` throws — which took the whole tab
  // down with it, since this runs while the page is being built.
  const watcher = options.reactEl && typeof ResizeObserver === "function"
    ? new ResizeObserver(fitRow) : null;
  if (watcher) watcher.observe(options.reactEl);
  else if (options.reactEl) window.addEventListener("resize", fitRow);
  return {
    /** The nth emoticon on the bar, for the number keys. */
    sendAt(index) {
      const item = roster[index];
      if (item) send(item.id);
    },
    stop() {
      clearInterval(timer);
      clearTimeout(coolTimer);
      if (watcher) watcher.disconnect();
      else window.removeEventListener("resize", fitRow);
      delete document.body.dataset.rail;
      document.documentElement.style.removeProperty("--react-row");
    },
  };
}

function rememberCupPassword(word) {
  cupPassword.held = word;
  try {
    sessionStorage.setItem(CUP_KEY, word);
  } catch (_) { /* held in memory above instead */ }
}

function forgetCupPassword() {
  cupPassword.held = "";
  try {
    sessionStorage.removeItem(CUP_KEY);
  } catch (_) { /* nothing was stored */ }
}

/**
 * Asks for the cup's password, and re-enters the tab once it is accepted.
 *
 * The form is the whole page rather than a dialog over a greyed-out bracket,
 * because there is nothing behind it: this runs before anything about the cup
 * has been fetched.
 */
function askForCupPassword(parts, message) {
  view.innerHTML = `
    <h2 class="section">Cup</h2>
    <div class="card" style="max-width:520px">
      <h3>This competition is not published yet</h3>
      <p class="small muted">
        The cup is still being worked on, so it is not on the menu. If you have
        been given the password, it opens here.
      </p>
      <label for="cup-word">Password</label>
      <input id="cup-word" type="password" autocomplete="off"
             style="max-width:280px" aria-describedby="cup-word-note">
      <p id="cup-word-note" class="small ${message ? "err" : "muted"}"
         style="margin:8px 0 0">${escapeHtml(message || "")}</p>
      <p style="margin:14px 0 0"><button id="cup-open">Open the cup</button></p>
    </div>`;
  const input = document.getElementById("cup-word");
  const submit = () => {
    rememberCupPassword(input.value);
    showCup(parts).catch(fail);
  };
  document.getElementById("cup-open").onclick = submit;
  input.onkeydown = (event) => { if (event.key === "Enter") submit(); };
  input.focus();
}

// ---------------------------------------------------------------------------
// The tab
// ---------------------------------------------------------------------------

async function showCup(parts) {
  const wanted = parts.length ? decodeURIComponent(parts.join("/")) : "";
  const locked = cupAccess() === "locked";
  let data;
  const sentAt = Date.now();
  try {
    data = await api(
      "api/cup",
      wanted ? { run: wanted } : {},
      locked ? { [CUP_PASSWORD_HEADER]: cupPassword() } : null,
    );
  } catch (error) {
    if (!error.locked) throw error;
    // Whatever was stored is wrong, or there was nothing stored. Either way it
    // is no use, so it goes rather than being retried on every navigation.
    const had = !!cupPassword();
    forgetCupPassword();
    askForCupPassword(parts, had ? "That is not the password." : "");
    return;
  }

  cupNoteServerClock(data, sentAt);
  let bracket = data.bracket;
  let broadcast = data.broadcast || null;
  // Whether this cup is on air right now, which is a question about the time
  // of day and not about whether the competition has finished being computed.
  // See `Arena.broadcast`.
  let live = !!(broadcast && broadcast.live);
  const cups = data.cups || [];
  const due = cupDue(data);
  // The last cup that actually finished, whichever one is being shown. That is
  // what "the previous winner" means on a week when a new cup is halfway
  // through, and it is what the front page leads with.
  const lastFinished = cups.find((run) => run.champion);

  if (!bracket || !(bracket.rounds || []).length) {
    view.innerHTML = `
      <h2 class="section">Cup</h2>
      <div class="cup-hero cup-hero-empty">
        <div class="cup-hero-next">
          <div class="eyebrow">Next cup</div>
          <div class="cup-clock" id="cup-clock">—</div>
          <p class="small muted" id="cup-when" style="margin:6px 0 0"></p>
          <p class="small muted" style="margin:6px 0 0">
            Division One enters the draw when the clock reaches zero.
          </p>
        </div>
      </div>
      <p class="lede">${escapeHtml(CUP_LEDE)}</p>
      <div class="card">
        <h3>No cup has been played yet</h3>
        <p class="muted">
          The draw is the top division of the ladder, seeded on the table:
          first plays twentieth, second plays nineteenth, and so on down.
        </p>
      </div>`;
    const emptyClock = document.getElementById("cup-clock");
    document.getElementById("cup-when").textContent = due ? cupWhen(due) : "not scheduled";
    function tickEmptyCup() {
      emptyClock.textContent = due ? cupCountdown(due, cupNow()) : "—";
    }
    tickEmptyCup();
    // Sunday at seven, on a page that was opened a minute before it: the cup
    // exists but its first round is not on disk yet, so there is nothing to
    // draw and nothing to wait for except its arrival. Both the countdown and
    // the poll are held on `cupCast` so that leaving the tab stops them.
    cupCast = {
      timer: 0, holdTimer: 0, goalTimer: 0, sync: 0, poll: 0,
      clock: setInterval(tickEmptyCup, 1000),
      onMessage: null, onKey: null,
    };
    cupCast.poll = setInterval(async () => {
      if (!cupCast) return;
      const at = Date.now();
      let fresh;
      try {
        fresh = await api(
          "api/cup", wanted ? { run: wanted } : {},
          locked ? { [CUP_PASSWORD_HEADER]: cupPassword() } : null,
        );
      } catch (_) {
        return;
      }
      if (!cupCast || !fresh) return;
      cupNoteServerClock(fresh, at);
      if (fresh.bracket && (fresh.bracket.rounds || []).length) route();
      // Often, because what is being waited for is a first round that takes a
      // second or two to play and a card reading "no cup has been played yet"
      // is wrong the moment it has.
    }, 5000);
    return;
  }

  let matches = cupMatches(bracket);

  /**
   * How much of this cup this page is allowed to show.
   *
   * Everything played, normally: a cup being reviewed has been watched
   * already and there is nothing left to spoil.
   *
   * A cup on air is the exception, and the reason is the broadcast. The
   * results are all on disk within seconds of kickoff, so "everything played"
   * at half past five is the whole competition including the final — and a
   * page that drew it would tell a room watching the second round who wins.
   * So while a cup is live the page shows exactly what has been broadcast and
   * not a match more, which is also what makes the bracket on this page and
   * the bracket on the wall screen the same bracket.
   */
  function broadcastReveal() {
    const played = matches.filter((match) => match.winner).length;
    if (!live) return played;
    const position = cupBroadcastAt(broadcast, cupNow());
    return Math.min(played, position ? position.revealed : 0);
  }

  const state = {
    revealed: broadcastReveal(),
    total: broadcastReveal(),
    finished: !!bracket.finished,
    onDeck: false,
    playing: false,
  };
  const showing = data.run ? data.run.run_id : "";

  view.innerHTML = `
    <h2 class="section">Cup</h2>
    <p class="lede">${escapeHtml(CUP_LEDE)}</p>
    <div class="cup-hero">
      <div class="cup-hero-main" id="cup-hero"></div>
      <div class="cup-hero-next">
        <div class="eyebrow" id="cup-next-eyebrow">Next cup</div>
        <div class="cup-clock" id="cup-clock">—</div>
        <p class="small muted" id="cup-when" style="margin:6px 0 0"></p>
        <p class="small muted" id="cup-sched" style="margin:6px 0 0"></p>
      </div>
    </div>
    <div class="card">
      <div class="cup-head">
        <strong id="cup-title"></strong>
        <span class="muted small" id="cup-progress"></span>
        <span class="watching" id="cup-watching"></span>
      </div>
      <div id="cup-actions"></div>
    </div>
    <div class="card">
      <h3>Bracket</h3>
      <div id="cup-bracket"></div>
    </div>
    <div id="cup-table"></div>
    <div id="cup-history"></div>`;

  const heroEl = document.getElementById("cup-hero");
  const clockEl = document.getElementById("cup-clock");
  const titleEl = document.getElementById("cup-title");
  const progressEl = document.getElementById("cup-progress");
  const actionsEl = document.getElementById("cup-actions");
  const bracketEl = document.getElementById("cup-bracket");
  const tableEl = document.getElementById("cup-table");
  const historyEl = document.getElementById("cup-history");

  const whenEl = document.getElementById("cup-when");
  titleEl.textContent = cupRunDate(showing);
  whenEl.textContent = due ? cupWhen(due) : "not scheduled";
  document.getElementById("cup-sched").textContent = data.scheduled
    ? "Played automatically every week, drawn from division one of the ladder."
    : "Nobody has scheduled it on this server; it is played by hand.";

  const nextEyebrow = document.getElementById("cup-next-eyebrow");

  function tick() {
    if (!live) {
      clockEl.textContent = due ? cupCountdown(due, cupNow()) : "—";
      return;
    }
    // On air, the countdown is to nothing: the cup people care about is the
    // one being played. So the same panel carries how far through it is, and
    // the page's own bracket keeps up with the broadcast as it goes.
    const position = cupBroadcastAt(broadcast, cupNow());
    const at = Math.min(position ? position.revealed : 0, state.total);
    clockEl.textContent = "On air";
    whenEl.textContent = position && position.phase === "on-air"
      ? `Match ${Math.min(at + 1, broadcast.matches_total || broadcast.matches)}`
        + ` of ${broadcast.matches_total || broadcast.matches}`
      : "Between matches";
    // Which beat is on, so this bracket marks the match being played the same
    // way the broadcast's own panel does. Somebody watching the bracket rather
    // than the match should be able to see where the competition is.
    const kind = position && position.segment ? position.segment.kind : "";
    const playing = kind === "match";
    const onDeck = kind === "deck";
    const landed = at !== state.revealed;
    if (landed || playing !== state.playing || onDeck !== state.onDeck) {
      state.revealed = state.total = at;
      state.playing = playing;
      state.onDeck = onDeck;
      // Followed only when a result has just landed. A page is read, not
      // watched: scrolling it under somebody every time a match kicks off
      // would take the box they were looking at away from them.
      draw(landed);
      drawActions();
    } else {
      // The bracket is not redrawn every second — see `cupRetime` — so the
      // countdowns on it are re-read instead.
      cupRetime(bracketEl);
    }
  }
  tick();
  // Held on `cupCast` when a broadcast is running and on its own otherwise, so
  // `stopCup` clears it either way when the tab is left.
  const clock = setInterval(tick, 1000);
  cupCast = {
    timer: 0, holdTimer: 0, goalTimer: 0, clock, sync: 0, poll: 0,
    onMessage: null, onKey: null,
  };

  /**
   * What this tab does while it is left open, which is two different jobs.
   *
   * A cup on air grows: the rounds it has not played are not on disk, so a
   * page that loaded at kickoff holds the first round and nothing else and
   * has to be told the rest. Polled less often than the broadcast polls —
   * nobody is watching a match here, and the reveal clamp means a stale
   * bracket shows too little rather than too much.
   *
   * The other job is noticing a cup that has begun. Sunday at seven is a time
   * people wait on a page for, and the page they are waiting on is showing
   * last week's competition; a broadcast nobody can see without knowing to
   * reload is not much of a broadcast. So when what ought to be on screen
   * changes — a new cup exists, or the one being shown has gone on air — the
   * tab is simply re-rendered, which is also how it picks up a bracket that
   * did not exist when it loaded.
   *
   * Only ever on the tab's own view of "the current cup". Somebody who
   * navigated to a particular cup to review it is reading that one, and a
   * page that moved them off it at seven o'clock would be taking it away
   * mid-sentence.
   */
  async function follow() {
    if (!cupCast) return;
    const at = Date.now();
    let fresh;
    try {
      fresh = await api(
        "api/cup",
        // Deliberately unpinned when the tab is on its default view, so that
        // "the current cup" can become a different cup.
        wanted ? { run: wanted } : {},
        cupAccess() === "locked" ? { [CUP_PASSWORD_HEADER]: cupPassword() } : null,
      );
    } catch (_) {
      // Not worth abandoning a broadcast over one failed poll.
      return;
    }
    if (!cupCast || !fresh) return;
    cupNoteServerClock(fresh, at);
    const arrived = fresh.run ? fresh.run.run_id : "";
    const nowLive = !!(fresh.broadcast && fresh.broadcast.live);
    const bracketArrived = !!(fresh.bracket && (fresh.bracket.rounds || []).length);
    if (!wanted && (arrived !== showing || nowLive !== live)) {
      route();
      return;
    }
    if (!bracketArrived) return;
    // `data` as well as the bracket, because it is what is handed to
    // `startCast` when somebody joins the broadcast from this page — a stale
    // copy would hand them a rundown missing the rounds it has just learnt.
    data = fresh;
    bracket = fresh.bracket;
    broadcast = fresh.broadcast;
    matches = cupMatches(bracket);
    live = nowLive;
    state.finished = !!bracket.finished;
    state.revealed = state.total = broadcastReveal();
    nextEyebrow.textContent = live ? "On air now" : "Next cup";
    draw();
    drawActions();
  }
  if (live) nextEyebrow.textContent = "On air now";
  // How often to look depends on what there is to see. A cup on air is
  // growing a bracket. A kickoff within the next few minutes, or a cup this
  // server is playing right now, is a broadcast about to start and worth
  // catching quickly — seven o'clock is a time people sit on this page waiting
  // for. Otherwise this is a page about a competition that finished, and once
  // a minute is more than enough.
  const soon = due && due - cupNow() < 10 * 60 * 1000;
  cupCast.poll = setInterval(
    follow, live ? 30000 : (soon || data.running ? 10000 : 60000));

  // How many people have this cup open, on its own poll. The tab's own
  // refresh above is about the bracket and runs as slowly as a minute, which
